name: Bloom Builder Worker Readonly Trace

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trace production builder worker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 6m
          script: |
            set +e
            cd /home/ubuntu/bloombouquet || exit 2
            echo "[trace] utc=$(date -u +%Y-%m-%dT%H:%M:%SZ) head=$(git rev-parse HEAD)"
            node <<'NODE'
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');
            try {
              const list = JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8' }));
              for (const name of ['bloom-builder-worker','bloom-evaluator-worker']) {
                const p = list.find((x) => x.name === name);
                const env = p?.pm2_env || {};
                console.log(`[pm2] ${name} status=${env.status || '-'} pid=${p?.pid || 0} restarts=${env.restart_time ?? '-'} uptime=${env.pm_uptime || '-'} script=${env.pm_exec_path || '-'}`);
              }
            } catch (e) { console.log(`[pm2] inspect failed ${e.message}`); }
            try {
              const raw = JSON.parse(fs.readFileSync('/home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-27/pm/pm-plan.json', 'utf8'));
              const { prepareOrchestrationPlan } = require('./.tmp/bloom-worker/orchestrationCore.js');
              const prepared = prepareOrchestrationPlan(raw);
              const rawById = new Map((raw.tasks || []).map((task) => [task.id, task]));
              console.log('[prepare-role-diff]');
              for (const task of prepared.tasks || []) {
                const before = rawById.get(task.id);
                if (!before || before.role !== task.role) {
                  console.log(`task=${task.id} raw=${before?.role || '<added>'} prepared=${task.role} title=${String(task.title || '').slice(0,160)}`);
                }
              }
              console.log(`[prepared-roles] ${(prepared.tasks || []).map((task) => task.role).join(',')}`);
            } catch (e) { console.log(`[prepare-role-diff] failed ${e.stack || e}`); }
            NODE
            echo '[processes]'
            ps -eo pid,ppid,etime,cmd | grep -E 'bloom-worker/run.js|luna-runtime-headless|bloom-runtime-bridge' | grep -v grep | tail -n 30 || true
            echo '[runtime-builder-27]'
            if [ -d /home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-27 ]; then
              find /home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-27 -maxdepth 5 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %s %p\n' 2>/dev/null | sort | tail -n 80
            else
              echo 'missing'
            fi
            python3 <<'PY'
            import json, os
            root='/home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-27/pm'
            plan_path=os.path.join(root,'pm-plan.json')
            print('[pm-plan]')
            if os.path.isfile(plan_path):
                try:
                    plan=json.load(open(plan_path,encoding='utf-8'))
                    tasks=plan.get('tasks') or []
                    print(f"repositoryName={plan.get('repositoryName','-')} taskCount={len(tasks)}")
                    for task in tasks:
                        deps=task.get('dependsOn') or task.get('dependencies') or []
                        ac=' | '.join(map(str, task.get('acceptanceCriteria') or []))
                        print(f"task id={task.get('id','-')} role={task.get('role','-')} slug={task.get('taskSlug','-')} deps={','.join(map(str,deps))} title={str(task.get('title','-'))[:120]} ac={ac[:420]}")
                except Exception as e:
                    print('parse-failed',repr(e))
            else:
                print('missing')
            events_path=os.path.join(root,'pm-events.jsonl')
            print('[pm-events-summary]')
            if os.path.isfile(events_path):
                rows=[]
                with open(events_path,encoding='utf-8',errors='replace') as f:
                    for i,line in enumerate(f,1):
                        try: v=json.loads(line)
                        except Exception: continue
                        method=v.get('method') or v.get('type') or '-'
                        rows.append((i,method))
                print(f'eventCount={len(rows)}')
                for row in rows[-40:]: print(f'event line={row[0]} method={row[1]}')
            else:
                print('missing')
            PY
            for log in "$HOME/.pm2/logs/bloom-builder-worker-out.log" "$HOME/.pm2/logs/bloom-builder-worker-error.log"; do
              echo "[log] $log"
              if [ -f "$log" ]; then
                tail -n 120 "$log" | sed -E 's/([Tt][Oo][Kk][Ee][Nn]|[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Ss][Ee][Cc][Rr][Ee][Tt]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn])[^ ]*/\1=<redacted>/g'
              else
                echo 'missing'
              fi
            done
