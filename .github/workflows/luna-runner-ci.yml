name: Luna Remote Runner CI

on:
  push:
    branches:
      - "luna/remote-runner"
    paths:
      - "services/luna-runner/**"
      - ".github/workflows/luna-runner-ci.yml"
  pull_request:
    paths:
      - "services/luna-runner/**"
      - ".github/workflows/luna-runner-ci.yml"

concurrency:
  group: luna-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check runner syntax
        run: npm --prefix services/luna-runner run check
