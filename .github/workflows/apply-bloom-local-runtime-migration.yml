name: Apply Bloom Local Runtime Migration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'refactor/bloom-remove-codex-runtime-v3' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Luna Bloom"
          git config user.email "luna-bloom@users.noreply.github.com"

      - name: Apply Codex-free runtime migration
        run: |
          python .github/scripts/fix_bloom_local_agent_compat.py
          python .github/scripts/migrate_bloom_local_runtime.py
          python .github/scripts/migrate_bloom_runtime_tests.py
          git add bloom-runtime bloom-worker
          if ! git diff --cached --quiet; then
            git commit -m "refactor : remove codex runtime dependencies"
          fi

      - name: Apply review package migration
        run: |
          python .github/scripts/migrate_luna_review_package.py
          git add bloom-runtime/ts/lunaProductionDelivery.ts \
            bloom-runtime/ts/observedHeadlessBuilderExecutor.ts \
            bloom-runtime/tsconfig.worker.json \
            bloom-runtime/tsconfig.policy-tests.json
          if ! git diff --cached --quiet; then
            git commit -m "feat : emit luna review package"
          fi

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Bloom policy tests
        run: pnpm run test:bloom-runtime

      - name: Verify Bloom worker build
        run: pnpm run build:bloom-worker

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Verify Rust runtime compiles
        run: cargo test --manifest-path bloom-runtime/Cargo.toml --no-run

      - name: Verify Codex executable paths are gone
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'Command::new\("codex"\)|run_checked_with_stdin\("codex"|createCodexSeniorEvaluatorRunner' \
            bloom-runtime/src bloom-worker/run.js bloom-runtime/ts/bloomBouquetSeniorEvaluator.ts
          git diff --check HEAD~2..HEAD || git diff --check

      - name: Remove one-time migration helpers
        run: |
          git rm .github/scripts/fix_bloom_local_agent_compat.py \
            .github/scripts/migrate_bloom_local_runtime.py \
            .github/scripts/migrate_bloom_runtime_tests.py \
            .github/scripts/migrate_luna_review_package.py \
            .github/workflows/apply-bloom-local-runtime-migration.yml
          git commit -m "chore : remove migration helper"

      - name: Push migrated branch
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
