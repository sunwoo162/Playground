name: Luna Desktop CI

on:
  push:
    branches:
      - "luna/**"
    paths:
      - "apps/desktop/**"
      - ".github/workflows/luna-desktop-ci.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/luna-desktop-ci.yml"

concurrency:
  group: luna-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Luna frontend
        run: pnpm --dir apps/desktop build

      - name: Run Luna policy tests
        run: pnpm --dir apps/desktop test:allocation

      - name: Check Luna Tauri runtime
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
