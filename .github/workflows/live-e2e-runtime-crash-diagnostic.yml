name: Live E2E Runtime Crash Diagnostic

on:
  push:
    branches:
      - test/luna-live-e2e-diagnostic-current

permissions:
  contents: read

jobs:
  inspect-crash:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect active Builder Agent hang evidence
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set +e
            cd /home/ubuntu/bloombouquet
            export PATH="$HOME/.local/bin:$HOME/.llama/bin:$HOME/.local/node_modules/.bin:$PATH"
            echo '=== TIME / MEMORY ==='
            date -Is
            free -h
            echo '=== PM2 STATUS ==='
            pm2 status
            echo '=== BUILDER WORKER LOGS ==='
            pm2 logs bloom-builder-worker --lines 180 --nostream 2>&1 | tail -180
            echo '=== T-002 STDERR ==='
            tail -120 /home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-18/agents/rose:accessibility/T-002/app-server.stderr.log 2>&1
            echo '=== T-002 EVENTS TAIL ==='
            tail -50 /home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-18/agents/rose:accessibility/T-002/app-server-events.jsonl 2>&1
            echo '=== T-003 ARTIFACTS ==='
            find /home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-18/agents -path '*T-003*' -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort
            echo '=== RUNTIME PROCESS SUMMARY ==='
            ps -eo pid,ppid,stat,etime,%cpu,%mem,comm | grep -E 'bloom-runtime|codex|node|git|gh' | tail -80
            echo '=== KERNEL OOM EVIDENCE ==='
            sudo journalctl -k --since '2026-09-01 06:35:00' --no-pager 2>/dev/null | grep -Ei 'oom|out of memory|killed process|memory cgroup' | tail -80
