name: Apply Runtime Publication Recovery V2

on:
  push:
    branches:
      - fix/runtime-owned-publication-blocker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-owned-publication-blocker
          fetch-depth: 0
      - name: Patch Runtime-owned publication recovery
        run: |
          echo '' | base64 -d | python
      - name: Remove one-shot workflows and publish patch
        run: |
          rm -f .github/workflows/apply-runtime-publication-recovery.yml
          rm -f .github/workflows/apply-runtime-publication-recovery-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloom-runtime/src/agent_runtime.rs .github/workflows/apply-runtime-publication-recovery.yml .github/workflows/apply-runtime-publication-recovery-v2.yml
          git commit -m "fix : recover runtime-owned publication blockers"
          git push origin HEAD:fix/runtime-owned-publication-blocker
