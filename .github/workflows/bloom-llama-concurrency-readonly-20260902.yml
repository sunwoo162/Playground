name: Bloom Llama Concurrency Readonly 20260902

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect active llama slot timing
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 6m
          script: |
            set -eu
            echo '[llama-health]'
            curl -fsS http://127.0.0.1:8091/health || true
            echo
            echo '[llama-out-tail]'
            OUT="$HOME/.pm2/logs/bloom-evaluator-llm-out.log"
            if [ -f "$OUT" ]; then
              tail -n 180 "$OUT" | grep -E 'slot|prompt eval|eval time|tokens per second|request|timings|processing task|released|stop processing|n_prompt_tokens|n_decoded|tokens' | tail -n 120 || true
            fi
            echo '[llama-error-tail]'
            ERR="$HOME/.pm2/logs/bloom-evaluator-llm-error.log"
            if [ -f "$ERR" ]; then
              tail -n 100 "$ERR" | grep -Ev 'Authorization|Bearer|token=' | tail -n 80 || true
            fi
            echo '[pm2-current]'
            node <<'NODE'
            const { execFileSync } = require('node:child_process');
            const list = JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8' }));
            const p = list.find((x) => x.name === 'bloom-evaluator-llm');
            console.log(JSON.stringify({
              pid: p?.pid || 0,
              restart_time: p?.pm2_env?.restart_time,
              max_memory_restart: p?.pm2_env?.max_memory_restart,
              status: p?.pm2_env?.status,
              memory: p?.monit?.memory,
              cpu: p?.monit?.cpu,
            }, null, 2));
            NODE
