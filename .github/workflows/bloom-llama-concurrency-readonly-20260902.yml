name: Bloom Llama Concurrency Readonly 20260902

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Isolate PM2 llama restart trigger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 6m
          script: |
            set -eu
            echo '[pm2-exact-window]'
            LOG="$HOME/.pm2/pm2.log"
            if [ -f "$LOG" ]; then
              awk '$0 >= "2026-09-02T09:48:50" && $0 <= "2026-09-02T09:49:20" {print}' "$LOG" || true
              echo '[first-kill-with-context]'
              grep -B 30 -A 5 -m1 '2026-09-02T09:49:18: PM2 log: pid=171514 msg=failed to kill' "$LOG" || true
              echo '[memory-keywords-nearby]'
              grep -Ei -B 8 -A 8 'memory|2600|2\.6|exceed|max_memory|max memory' "$LOG" | tail -n 120 || true
            fi
            echo '[pm2-current]'
            node <<'NODE'
            const { execFileSync } = require('node:child_process');
            const list = JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8' }));
            const p = list.find((x) => x.name === 'bloom-evaluator-llm');
            console.log(JSON.stringify({
              pid: p?.pid || 0,
              restart_time: p?.pm2_env?.restart_time,
              max_memory_restart: p?.pm2_env?.max_memory_restart,
              status: p?.pm2_env?.status,
            }, null, 2));
            NODE
