name: Ops Patch Bloom Recovery Ping Pong

on:
  push:
    branches:
      - ops/live-e2e-model-diagnostics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/bloom-recovery-ping-pong
          fetch-depth: 0

      - name: Apply minimal recovery fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bloom-runtime/ts/bloomLocalAgentRuntime.ts')
          s = p.read_text()
          old = '        forceToolTurn = true;\n        result.recovery = "RECOVERY_REQUIRED: This exact tool action has failed repeatedly. The next turn must use a different tool action to gather evidence or make progress before returning final.";'
          new = '        let hasRepositoryChanges = false;\n        if (input.requireMutation === true) {\n          const repositoryStatus = await executeRun(worktree, { command: "git", args: ["status", "--porcelain"], cwd: "." });\n          hasRepositoryChanges = repositoryStatus.ok === true && Boolean(String(repositoryStatus.stdout ?? "").trim());\n        }\n        forceToolTurn = !hasRepositoryChanges;\n        result.recovery = hasRepositoryChanges\n          ? "RECOVERY_REQUIRED: This exact tool action has failed repeatedly. The next turn must use a different tool action or return final if the current repository changes satisfy the task."\n          : "RECOVERY_REQUIRED: This exact tool action has failed repeatedly. The next turn must use a different tool action to gather evidence or make progress before returning final.";'
          if old not in s:
              raise SystemExit('target recovery lines not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloom-runtime/ts/bloomLocalAgentRuntime.ts
          git diff --cached --check
          git commit -m "fix : allow final after recovery with changes"
          git push origin HEAD:fix/bloom-recovery-ping-pong
