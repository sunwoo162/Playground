name: Evidence Vault Readonly Probe

on:
  push:
    branches:
      - probe/evidence-vault-infra-20260828

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require authorized SSH secret
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$SSH_PASSWORD" ]]; then
            echo "PROBE_SSH=unavailable"
            exit 1
          fi
          echo "PROBE_SSH=available"

      - name: Probe bootstrap prerequisites read-only
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: false
          script: |
            echo "PROBE_HOST_REACHED=yes"
            . /etc/os-release 2>/dev/null || true
            echo "PROBE_OS_ID=${ID:-unknown}"
            echo "PROBE_OS_VERSION=${VERSION_ID:-unknown}"

            sudo -n true >/dev/null 2>&1 && echo "PROBE_SUDO=passwordless" || echo "PROBE_SUDO=unavailable"
            command -v docker >/dev/null 2>&1 && echo "PROBE_DOCKER=present" || echo "PROBE_DOCKER=missing"
            command -v certbot >/dev/null 2>&1 && echo "PROBE_CERTBOT=present" || echo "PROBE_CERTBOT=missing"
            command -v snap >/dev/null 2>&1 && echo "PROBE_SNAP=present" || echo "PROBE_SNAP=missing"
            command -v corepack >/dev/null 2>&1 && echo "PROBE_COREPACK=present" || echo "PROBE_COREPACK=missing"
            command -v npm >/dev/null 2>&1 && echo "PROBE_NPM=present" || echo "PROBE_NPM=missing"

            if command -v systemctl >/dev/null 2>&1; then
              systemctl is-active --quiet postgresql && echo "PROBE_POSTGRES_SERVICE=active" || echo "PROBE_POSTGRES_SERVICE=inactive-or-missing"
              systemctl is-enabled --quiet postgresql >/dev/null 2>&1 && echo "PROBE_POSTGRES_ENABLED=yes" || echo "PROBE_POSTGRES_ENABLED=no-or-missing"
            fi

            if command -v dpkg-query >/dev/null 2>&1; then
              dpkg-query -W -f='${Status}\n' postgresql 2>/dev/null | grep -q 'install ok installed' && echo "PROBE_POSTGRES_PACKAGE=installed" || echo "PROBE_POSTGRES_PACKAGE=missing"
              dpkg-query -W -f='${Status}\n' postgresql-client 2>/dev/null | grep -q 'install ok installed' && echo "PROBE_POSTGRES_CLIENT_PACKAGE=installed" || echo "PROBE_POSTGRES_CLIENT_PACKAGE=missing"
            fi

            if command -v docker >/dev/null 2>&1; then
              sudo -n docker info >/dev/null 2>&1 && echo "PROBE_DOCKER_DAEMON=ready" || echo "PROBE_DOCKER_DAEMON=unavailable"
              sudo -n docker ps --format '{{.Image}}' 2>/dev/null | grep -qi 'postgres' && echo "PROBE_DOCKER_POSTGRES=present" || echo "PROBE_DOCKER_POSTGRES=absent"
            fi

            if command -v nginx >/dev/null 2>&1; then
              sudo -n nginx -t >/dev/null 2>&1 && echo "PROBE_NGINX_CONFIG=valid" || echo "PROBE_NGINX_CONFIG=invalid-or-unavailable"
              test -d /etc/nginx/sites-available && echo "PROBE_NGINX_SITES_AVAILABLE=yes" || echo "PROBE_NGINX_SITES_AVAILABLE=no"
              test -d /etc/nginx/sites-enabled && echo "PROBE_NGINX_SITES_ENABLED=yes" || echo "PROBE_NGINX_SITES_ENABLED=no"
            fi

            if command -v certbot >/dev/null 2>&1; then
              certbot plugins 2>/dev/null | grep -q 'nginx' && echo "PROBE_CERTBOT_NGINX_PLUGIN=present" || echo "PROBE_CERTBOT_NGINX_PLUGIN=missing"
            fi

            if getent ahosts evidence-vault.https.gsmsv.site >/dev/null 2>&1; then
              echo "PROBE_DNS=resolved"
            else
              echo "PROBE_DNS=unresolved"
            fi

            echo "PROBE_BOOTSTRAP_COMPLETE=yes"
