name: Evidence Vault ACME Diagnose

on:
  push:
    branches:
      - probe/evidence-vault-infra-20260828

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require authorized SSH secret
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$SSH_PASSWORD" ]]; then
            echo "ACME_DIAG_SSH=unavailable"
            exit 1
          fi
          echo "ACME_DIAG_SSH=available"

      - name: Diagnose ACME routing read-only
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: false
          script: |
            set -eu
            DOMAIN="evidence-vault.https.gsmsv.site"

            echo "ACME_DIAG_HOST_REACHED=yes"
            echo "ACME_DIAG_DNS_V4=$(getent ahostsv4 "$DOMAIN" | awk 'NR==1 {print $1}')"

            LOCAL_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' --resolve "$DOMAIN:80:127.0.0.1" "http://$DOMAIN/.well-known/acme-challenge/probe")"
            echo "ACME_DIAG_LOCAL_HTTP_STATUS=$LOCAL_STATUS"

            EXTERNAL_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 7 "http://$DOMAIN/.well-known/acme-challenge/probe" || true)"
            echo "ACME_DIAG_EXTERNAL_HTTP_STATUS=${EXTERNAL_STATUS:-000}"

            REDIRECT_TARGET="$(curl -sSI --max-time 7 "http://$DOMAIN/.well-known/acme-challenge/probe" 2>/dev/null | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); print $2; exit}' || true)"
            case "$REDIRECT_TARGET" in
              https://$DOMAIN/*) echo "ACME_DIAG_EXTERNAL_REDIRECT=https-same-host" ;;
              "") echo "ACME_DIAG_EXTERNAL_REDIRECT=none" ;;
              *) echo "ACME_DIAG_EXTERNAL_REDIRECT=other" ;;
            esac

            echo "ACME_DIAG_CERTBOT_ERRORS_BEGIN"
            sudo grep -E 'unauthorized|Invalid response|Detail:|Type:|Domain:|challenge|Connection refused|Timeout' /var/log/letsencrypt/letsencrypt.log 2>/dev/null | tail -n 40 || true
            echo "ACME_DIAG_CERTBOT_ERRORS_END"

      - name: Diagnose public routing from runner
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN="evidence-vault.https.gsmsv.site"
          HTTP_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "http://$DOMAIN/.well-known/acme-challenge/probe" || true)"
          HTTPS_STATUS="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 10 "https://$DOMAIN/.well-known/acme-challenge/probe" || true)"
          echo "ACME_DIAG_RUNNER_HTTP_STATUS=${HTTP_STATUS:-000}"
          echo "ACME_DIAG_RUNNER_HTTPS_STATUS=${HTTPS_STATUS:-000}"
