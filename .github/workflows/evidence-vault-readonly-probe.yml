name: BloomBouquet Domain Probe

on:
  push:
    branches:
      - probe/evidence-vault-infra-20260828

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify replacement domain from runner
        shell: bash
        run: |
          set -euo pipefail
          NEW_DOMAIN="bloombouquet.https.gsmsv.site"
          OLD_DOMAIN="playground.https.gsmsv.site"

          NEW_ROOT_STATUS="$(curl -sS -o /tmp/new-root -w '%{http_code}' --max-time 10 "https://$NEW_DOMAIN/" || true)"
          NEW_AUTH_STATUS="$(curl -sS -o /tmp/new-auth -w '%{http_code}' --max-time 10 "https://$NEW_DOMAIN/api/bouquet/auth/me" || true)"
          OLD_ROOT_STATUS="$(curl -sS -o /tmp/old-root -w '%{http_code}' --max-time 10 "https://$OLD_DOMAIN/" || true)"

          echo "DOMAIN_PROBE_NEW_ROOT_STATUS=${NEW_ROOT_STATUS:-000}"
          echo "DOMAIN_PROBE_NEW_AUTH_STATUS=${NEW_AUTH_STATUS:-000}"
          echo "DOMAIN_PROBE_OLD_ROOT_STATUS=${OLD_ROOT_STATUS:-000}"

          NEW_TITLE="$(grep -o '<title>[^<]*</title>' /tmp/new-root | head -n 1 || true)"
          OLD_TITLE="$(grep -o '<title>[^<]*</title>' /tmp/old-root | head -n 1 || true)"
          echo "DOMAIN_PROBE_NEW_TITLE=${NEW_TITLE:-missing}"
          echo "DOMAIN_PROBE_OLD_TITLE=${OLD_TITLE:-missing}"
          echo "DOMAIN_PROBE_AUTH_BODY=$(head -c 200 /tmp/new-auth | tr '\n' ' ')"

          test "$NEW_ROOT_STATUS" = "200"
          test "$NEW_AUTH_STATUS" = "200"
          test "$OLD_ROOT_STATUS" = "200"
          test "$NEW_TITLE" = "$OLD_TITLE"

          echo "DOMAIN_PROBE_NEW_DOMAIN=route-ready"
          echo "DOMAIN_PROBE_OLD_DOMAIN=still-ready"
          rm -f /tmp/new-root /tmp/new-auth /tmp/old-root
