name: Evidence Vault Proxy Boundary Diagnose

on:
  push:
    branches:
      - probe/evidence-vault-infra-20260828

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require authorized SSH secret
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$SSH_PASSWORD" ]]; then
            echo "PROXY_DIAG_SSH=unavailable"
            exit 1
          fi
          echo "PROXY_DIAG_SSH=available"

      - name: Diagnose server/public boundary read-only
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: false
          script: |
            set -eu
            DOMAIN="evidence-vault.https.gsmsv.site"

            DNS_V4="$(getent ahostsv4 "$DOMAIN" | awk 'NR==1 {print $1}')"
            SSH_DNS_V4="$(getent ahostsv4 ssh.gsmsv.site | awk 'NR==1 {print $1}')"
            PUBLIC_V4="$(curl -4fsS --max-time 7 https://api.ipify.org 2>/dev/null || true)"
            echo "PROXY_DIAG_DOMAIN_DNS_V4=$DNS_V4"
            echo "PROXY_DIAG_SSH_DNS_V4=$SSH_DNS_V4"
            echo "PROXY_DIAG_SERVER_PUBLIC_V4=${PUBLIC_V4:-unknown}"

            if test -n "$PUBLIC_V4" && test "$DNS_V4" = "$PUBLIC_V4"; then
              echo "PROXY_DIAG_DOMAIN_POINTS_DIRECTLY=yes"
            else
              echo "PROXY_DIAG_DOMAIN_POINTS_DIRECTLY=no"
            fi

            echo "PROXY_DIAG_LISTEN_80=$(ss -ltn 2>/dev/null | awk '$4 ~ /:80$/ {count++} END {print count+0}')"
            echo "PROXY_DIAG_LISTEN_443=$(ss -ltn 2>/dev/null | awk '$4 ~ /:443$/ {count++} END {print count+0}')"

            if sudo -n nginx -T >/tmp/evidence-vault-proxy-diag.txt 2>/dev/null; then
              if grep -Eq 'return[[:space:]]+30[178]' /tmp/evidence-vault-proxy-diag.txt; then
                echo "PROXY_DIAG_LOCAL_NGINX_HAS_REDIRECT=yes"
              else
                echo "PROXY_DIAG_LOCAL_NGINX_HAS_REDIRECT=no"
              fi
              grep -Fq 'server_name evidence-vault.https.gsmsv.site' /tmp/evidence-vault-proxy-diag.txt \
                && echo "PROXY_DIAG_LOCAL_SITE_PRESENT=yes" \
                || echo "PROXY_DIAG_LOCAL_SITE_PRESENT=no"
              rm -f /tmp/evidence-vault-proxy-diag.txt
            fi

      - name: Diagnose public certificate from runner
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN="evidence-vault.https.gsmsv.site"
          CERT_SUMMARY="$(echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null | openssl x509 -noout -subject -issuer 2>/dev/null || true)"
          if [[ -n "$CERT_SUMMARY" ]]; then
            echo "PROXY_DIAG_PUBLIC_TLS_CERT=present"
          else
            echo "PROXY_DIAG_PUBLIC_TLS_CERT=missing"
          fi
          HTTPS_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$DOMAIN/" || true)"
          echo "PROXY_DIAG_PUBLIC_HTTPS_STATUS=${HTTPS_STATUS:-000}"
