name: Evidence Vault HTTPS Bootstrap

on:
  push:
    branches:
      - probe/evidence-vault-infra-20260828

permissions:
  contents: read

jobs:
  https-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require authorized SSH secret
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$SSH_PASSWORD" ]]; then
            echo "HTTPS_BOOTSTRAP_SSH=unavailable"
            exit 1
          fi
          echo "HTTPS_BOOTSTRAP_SSH=available"

      - name: Configure Nginx and TLS for Evidence Vault
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 15m
          script_stop: false
          script: |
            set -eu
            APP_DIR="/home/ubuntu/evidence-vault"
            DOMAIN="evidence-vault.https.gsmsv.site"
            SITE="evidence-vault-preview"

            echo "HTTPS_BOOTSTRAP_HOST_REACHED=yes"

            test -d "$APP_DIR/.git"
            test "$(git -C "$APP_DIR" rev-parse HEAD)" = "0ddff8f5734928b5b275ff27aeda41fe8aea5430"
            test -f "$APP_DIR/.env.production"
            test "$(stat -c '%a' "$APP_DIR/.env.production")" = "600"

            BODY="$(curl -fsS --max-time 5 http://127.0.0.1:3011/api/health)"
            printf '%s' "$BODY" | grep -q '"ok":true'
            printf '%s' "$BODY" | grep -q '"service":"evidence-vault"'
            echo "HTTPS_BOOTSTRAP_LOOPBACK_HEALTH=ok"

            sudo install -m 0644 "$APP_DIR/deploy/nginx/evidence-vault-preview.conf.template" "/etc/nginx/sites-available/$SITE"
            sudo ln -sfn "/etc/nginx/sites-available/$SITE" "/etc/nginx/sites-enabled/$SITE"
            sudo nginx -t >/dev/null
            sudo systemctl reload nginx
            echo "HTTPS_BOOTSTRAP_NGINX_HTTP=ready"

            HTTP_BODY="$(curl -fsS --max-time 7 "http://$DOMAIN/api/health")"
            printf '%s' "$HTTP_BODY" | grep -q '"ok":true'
            printf '%s' "$HTTP_BODY" | grep -q '"service":"evidence-vault"'
            echo "HTTPS_BOOTSTRAP_PUBLIC_HTTP=ok"

            sudo certbot --nginx \
              --non-interactive \
              --agree-tos \
              --register-unsafely-without-email \
              --redirect \
              -d "$DOMAIN" >/dev/null

            sudo nginx -t >/dev/null
            sudo systemctl reload nginx
            echo "HTTPS_BOOTSTRAP_TLS_CONFIG=ready"

            echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null \
              | openssl x509 -noout -ext subjectAltName 2>/dev/null \
              | grep -Fq "DNS:$DOMAIN"
            echo "HTTPS_BOOTSTRAP_CERT_COVERAGE=ok"

            HTTPS_BODY="$(curl -fsS --max-time 7 "https://$DOMAIN/api/health")"
            printf '%s' "$HTTPS_BODY" | grep -q '"ok":true'
            printf '%s' "$HTTPS_BODY" | grep -q '"service":"evidence-vault"'
            echo "HTTPS_BOOTSTRAP_PUBLIC_HEALTH=ok"

            ROOT_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 7 "https://$DOMAIN/")"
            test "$ROOT_STATUS" = "200"
            echo "HTTPS_BOOTSTRAP_ANONYMOUS_ROOT=ok"

            AUTH_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 7 "https://$DOMAIN/auth/bouquet/start")"
            case "$AUTH_STATUS" in
              301|302|303|307|308) echo "HTTPS_BOOTSTRAP_OAUTH_START=redirect" ;;
              *) echo "unexpected OAuth start status: $AUTH_STATUS" >&2; exit 1 ;;
            esac

            echo "HTTPS_BOOTSTRAP_STAGE_B_COMPLETE=yes"
