name: BloomBouquet Domain Override Probe

on:
  push:
    branches:
      - probe/evidence-vault-infra-20260828

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require authorized SSH secret
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$SSH_PASSWORD" ]]; then
            echo "DOMAIN_OVERRIDE_SSH=unavailable"
            exit 1
          fi
          echo "DOMAIN_OVERRIDE_SSH=available"

      - name: Inspect hostname overrides read-only
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: false
          script: |
            set -eu
            OLD="playground.https.gsmsv.site"
            NEW="bloombouquet.https.gsmsv.site"

            classify_key() {
              FILE="$1"
              KEY="$2"
              LABEL="$3"
              if test ! -f "$FILE"; then
                echo "$LABEL=file-missing"
                return
              fi
              LINE="$(grep -E "^${KEY}=" "$FILE" | tail -n 1 || true)"
              if test -z "$LINE"; then
                echo "$LABEL=absent"
              elif printf '%s' "$LINE" | grep -Fq "$NEW"; then
                echo "$LABEL=new"
              elif printf '%s' "$LINE" | grep -Fq "$OLD"; then
                echo "$LABEL=old"
              else
                echo "$LABEL=other"
              fi
            }

            classify_key /home/ubuntu/playground/.env APP_CORS_ALLOWED_ORIGINS PLAYGROUND_SHARED_CORS_OVERRIDE
            classify_key /home/ubuntu/playground/.env.backend APP_CORS_ALLOWED_ORIGINS PLAYGROUND_BACKEND_CORS_OVERRIDE
            classify_key /home/ubuntu/evidence-vault/.env.production BOUQUET_BASE_URL EVIDENCE_VAULT_PROVIDER_OVERRIDE

            test "$(stat -c '%a' /home/ubuntu/evidence-vault/.env.production)" = "600"
            echo "EVIDENCE_VAULT_ENV_MODE=600"
