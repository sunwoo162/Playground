name: Restore Luna scheduler fixture

on:
  push:
    branches:
      - feat/luna-end-to-end-delivery-automation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/luna-end-to-end-delivery-automation
          fetch-depth: 0
      - name: Restore unrelated telemetry fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('bloom-runtime/ts/schedulerObservability.policy-test.ts')
          text = path.read_text(encoding='utf-8')
          old = 'taskRun("DOC-001", "documentation", "done", "rose:documentation", "2026-08-27T01:00:00.000Z", "2026-08-27T01:00:08.000Z")'
          new = 'taskRun("DOC-001", "documentation", "done", "rose:documentation", "2026-08-27T01:00:00.000Z", "2026-08-27T01:00:10.000Z")'
          if text.count(old) != 1:
              raise SystemExit(f'expected one scheduler fixture, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/patch-luna-scheduler-fixture.yml
      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloom-runtime/ts/schedulerObservability.policy-test.ts .github/workflows/patch-luna-scheduler-fixture.yml
          git diff --cached --check
          git commit -m "test: restore scheduler runtime fixture"
          git push origin HEAD:feat/luna-end-to-end-delivery-automation
