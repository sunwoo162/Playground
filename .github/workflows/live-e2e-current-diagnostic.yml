name: Live E2E Current Diagnostic

on:
  push:
    branches:
      - test/luna-live-e2e-diagnostic-current

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Recover Luna temporary disk safely
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          timeout: 60s
          command_timeout: 8m
          script: |
            set -eu
            echo '=== ACTIVE LUNA AGENT PROCESSES ==='
            active="$(ps -eo pid=,comm=,args= | awk '$2 == "luna-agent-bridge" || ($2 == "codex" && $0 ~ /app-server/) { print }')"
            if [ -n "$active" ]; then
              printf '%s\n' "$active"
              echo 'REFUSE_CLEANUP_ACTIVE_AGENT'
              exit 2
            fi
            echo 'NO_ACTIVE_LUNA_AGENT'
            echo '=== SPACE BEFORE ==='
            df -hT /
            sudo du -xsh /tmp/luna-agent-tools 2>/dev/null || true
            echo '=== CLEAN LUNA-OWNED TOOL STATE ==='
            sudo rm -rf /tmp/luna-agent-tools
            sync
            echo '=== SPACE AFTER ==='
            df -hT /
            echo '=== PM2 SAFE STATUS ==='
            pm2 jlist | node -e '
              let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{
                const rows=JSON.parse(s);
                for (const n of ["backend","bloom-builder-worker","bloom-evaluator-worker","bloom-evaluator-llm"]) {
                  const p=rows.find(x=>x.name===n);
                  console.log(JSON.stringify({name:n,pid:p?.pid,status:p?.pm2_env?.status,restarts:p?.pm2_env?.restart_time}));
                }
              });'
            echo '=== LOCAL HTTP ==='
            curl -sS -o /dev/null -w 'root_http=%{http_code}\n' --max-time 15 http://127.0.0.1:3000/ || true
            curl -sS -o /dev/null -w 'api_http=%{http_code}\n' --max-time 15 http://127.0.0.1:3000/api/builder/projects || true
