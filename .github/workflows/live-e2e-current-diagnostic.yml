name: Live E2E Current Diagnostic

on:
  push:
    branches:
      - test/luna-live-e2e-diagnostic-current

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Luna temporary disk accumulation
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          timeout: 60s
          command_timeout: 12m
          script: |
            set +e
            echo '=== ROOT SPACE ==='
            df -hT /
            echo '=== TMP TOP LEVEL ==='
            sudo du -xhd1 /tmp 2>/dev/null | sort -h | tail -60
            echo '=== LUNA AGENT TOOLS ==='
            sudo du -xhd3 /tmp/luna-agent-tools 2>/dev/null | sort -h | tail -100
            echo '=== LUNA AGENT TOOLS PROJECTS ==='
            sudo du -xsh /tmp/luna-agent-tools/* 2>/dev/null | sort -h | tail -80
            echo '=== LARGEST TMP FILES >= 100M ==='
            sudo find /tmp -xdev -type f -size +100M -printf '%s %TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort -n | tail -80
            echo '=== TMP DIRECTORIES BY MTIME ==='
            sudo find /tmp -xdev -mindepth 1 -maxdepth 2 -type d -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort | tail -100
            echo '=== LUNA TOOL STATE TASK BREAKDOWN ==='
            for project in /tmp/luna-agent-tools/*; do
              [ -d "$project" ] || continue
              echo "-- $(basename "$project") --"
              sudo du -xsh "$project"/* 2>/dev/null | sort -h | tail -40
            done
