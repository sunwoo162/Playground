name: Live E2E Current Diagnostic

on:
  push:
    branches:
      - test/luna-live-e2e-diagnostic-current

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current production Live E2E
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -eu
            cd /home/ubuntu/bloombouquet
            export PATH="$HOME/.local/bin:$HOME/.llama/bin:$HOME/.local/node_modules/.bin:$PATH"
            node <<'NODE'
            require('dotenv').config({ path: '.env' });
            const jwt = require('jsonwebtoken');
            const { execFileSync } = require('node:child_process');
            const apps = JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8' }));
            for (const name of ['bloom-evaluator-worker', 'bloom-builder-worker', 'bloom-evaluator-llm']) {
              const app = apps.find((value) => value.name === name);
              if (!app) throw new Error(`${name} missing`);
              console.log(JSON.stringify({ pm2: name, status: app.pm2_env?.status, pid: app.pid, kill_timeout: app.pm2_env?.kill_timeout }));
            }
            const base = 'http://127.0.0.1:3000';
            const token = jwt.sign({ id: 'sunwoo162-live-e2e', login: 'sunwoo162', name: 'sunwoo162', avatar_url: '', type: 'access' }, process.env.JWT_SECRET, { expiresIn: '20m' });
            const headers = { Cookie: `playground_token=${token}` };
            async function get(path) {
              const res = await fetch(`${base}${path}`, { headers });
              const text = await res.text();
              if (!res.ok) throw new Error(`${path} -> ${res.status}: ${text.slice(0, 500)}`);
              return text ? JSON.parse(text) : null;
            }
            async function main() {
              const raw = await get('/api/builder/projects');
              const projects = (Array.isArray(raw) ? raw : (raw?.content || [])).slice().sort((a,b) => Number(b.id||0)-Number(a.id||0));
              const project = projects[0];
              const runsRaw = await get(`/api/builder/projects/${project.id}/runs`);
              const runs = (Array.isArray(runsRaw) ? runsRaw : (runsRaw?.content || [])).slice().sort((a,b) => Number(b.id||0)-Number(a.id||0));
              const run = runs[0];
              const snapshot = await get(`/api/builder/projects/${project.id}/runs/${run.id}/snapshot`);
              const payload = snapshot?.payloadJson ? JSON.parse(snapshot.payloadJson) : null;
              console.log('=== LATEST LIVE E2E ===');
              console.log(JSON.stringify({ projectId: project.id, runId: run.id, projectStatus: project.status, runStatus: run.status, failureReason: run.failureReason || project.failureReason || null, heartbeatAt: run.heartbeatAt, phase: snapshot?.phase, version: snapshot?.version, repository: project.repositoryFullName || payload?.repository?.repository || null }, null, 2));
              console.log('=== TASKS ===');
              for (const task of payload?.taskRuns || []) {
                console.log(JSON.stringify({ taskId: task.taskId, role: task.role, status: task.status, attempts: task.attempts, pr: task.pullRequestNumber, commit: task.commitSha, lastError: task.lastError }));
              }
              console.log('LIVE_E2E_SNAPSHOT_PASS');
            }
            main().catch((error) => { console.error(error.stack || String(error)); process.exit(1); });
            NODE
            echo '=== ACTIVE AGENT ARTIFACTS ==='
            find /home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-18/agents -type f -printf '%T@ %TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort -nr | head -40 || true
