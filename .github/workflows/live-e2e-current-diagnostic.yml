name: Live E2E Current Diagnostic

on:
  push:
    branches:
      - test/luna-live-e2e-diagnostic-current

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production Bloom worker shutdown policy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -eu
            cd /home/ubuntu/bloombouquet
            export PATH="$HOME/.local/bin:$HOME/.llama/bin:$HOME/.local/node_modules/.bin:$PATH"
            echo '=== DEPLOYED MAIN ==='
            git rev-parse HEAD
            echo '=== ECOSYSTEM CONTRACT ==='
            grep -n "kill_timeout" ecosystem.config.js
            echo '=== PM2 RUNTIME ==='
            node <<'NODE'
            const { execFileSync } = require('node:child_process');
            const apps = JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8' }));
            for (const name of ['bloom-evaluator-worker', 'bloom-builder-worker', 'bloom-evaluator-llm']) {
              const app = apps.find((value) => value.name === name);
              if (!app) throw new Error(`${name} is not online in PM2`);
              const value = app.pm2_env?.kill_timeout;
              console.log(JSON.stringify({ name, status: app.pm2_env?.status, pid: app.pid, kill_timeout: value }));
              if (Number(value) !== 7200000) throw new Error(`${name} kill_timeout=${value}; expected 7200000`);
            }
            console.log('PM2_GRACEFUL_TIMEOUT_PASS');
            NODE
