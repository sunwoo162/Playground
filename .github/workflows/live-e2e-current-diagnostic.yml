name: Live E2E Current Diagnostic

on:
  push:
    branches:
      - test/luna-live-e2e-diagnostic-current

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production disk exhaustion
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          timeout: 60s
          command_timeout: 8m
          script: |
            set +e
            echo '=== NOW ==='
            date -Is
            echo '=== FILESYSTEM SPACE ==='
            df -hT
            echo '=== FILESYSTEM INODES ==='
            df -i
            echo '=== TOP /HOME/UBUNTU ==='
            du -xhd1 /home/ubuntu 2>/dev/null | sort -h | tail -30
            echo '=== TOP BLOOM WORKSPACES ==='
            du -xhd2 /home/ubuntu/bloom-workspaces 2>/dev/null | sort -h | tail -50
            echo '=== TOP BLOOMBOUQUET ==='
            du -xhd2 /home/ubuntu/bloombouquet 2>/dev/null | sort -h | tail -40
            echo '=== TOP PM2 ==='
            du -xhd2 /home/ubuntu/.pm2 2>/dev/null | sort -h | tail -40
            echo '=== TOP CACHE ==='
            du -xhd2 /home/ubuntu/.cache 2>/dev/null | sort -h | tail -40
            echo '=== LARGE FILES HOME >= 250M ==='
            find /home/ubuntu -xdev -type f -size +250M -printf '%s %TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort -n | tail -50
            echo '=== WORKSPACE PROJECT SIZES ==='
            du -xsh /home/ubuntu/bloom-workspaces/* 2>/dev/null | sort -h | tail -50
            echo '=== LUNA RUNTIME PROJECT SIZES ==='
            du -xsh /home/ubuntu/bloom-workspaces/.luna-runtime/projects/* 2>/dev/null | sort -h | tail -50
            echo '=== DISK RELATED KERNEL/JOURNAL ==='
            sudo journalctl --since '2026-09-01 08:15:00' --no-pager 2>/dev/null | grep -Ei 'ENOSPC|no space left|filesystem|ext4|I/O error' | tail -100
