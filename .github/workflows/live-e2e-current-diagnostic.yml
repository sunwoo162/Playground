name: Live E2E Current Diagnostic

on:
  push:
    branches:
      - test/luna-live-e2e-diagnostic-current

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Break down production root disk usage
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          timeout: 60s
          command_timeout: 12m
          script: |
            set +e
            echo '=== NOW ==='
            date -Is
            echo '=== ROOT SPACE ==='
            df -hT /
            echo '=== ROOT TOP LEVEL ==='
            sudo du -xhd1 / 2>/dev/null | sort -h | tail -30
            echo '=== VAR TOP LEVEL ==='
            sudo du -xhd1 /var 2>/dev/null | sort -h | tail -30
            echo '=== VAR LIB ==='
            sudo du -xhd2 /var/lib 2>/dev/null | sort -h | tail -50
            echo '=== VAR LOG ==='
            sudo du -xhd2 /var/log 2>/dev/null | sort -h | tail -50
            echo '=== SRV ==='
            sudo du -xhd3 /srv 2>/dev/null | sort -h | tail -60
            echo '=== USR ==='
            sudo du -xhd1 /usr 2>/dev/null | sort -h | tail -30
            echo '=== OPT ==='
            sudo du -xhd2 /opt 2>/dev/null | sort -h | tail -30
            echo '=== DOCKER SYSTEM DF ==='
            docker system df 2>&1 || sudo docker system df 2>&1 || true
            echo '=== DOCKER VAR LIB ==='
            sudo du -xhd2 /var/lib/docker 2>/dev/null | sort -h | tail -50
            echo '=== JOURNAL DISK ==='
            sudo journalctl --disk-usage 2>&1 || true
            echo '=== DELETED OPEN FILES ==='
            sudo lsof +L1 2>/dev/null | awk 'NR==1 || $7 ~ /^[0-9]+$/ {print}' | sort -k7,7n | tail -40
            echo '=== LARGE ROOT FILES >= 500M ==='
            sudo find / -xdev -type f -size +500M -printf '%s %TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort -n | tail -60
