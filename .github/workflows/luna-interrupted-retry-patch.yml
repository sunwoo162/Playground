name: Luna interrupted retry patch

on:
  push:
    branches:
      - fix/luna-interrupted-task-retry-v2

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'bootstrap-interrupted-retry-patch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/luna-interrupted-task-retry-v2
          fetch-depth: 0
      - name: Apply fix
        run: node .github/luna-interrupted-retry-patch.cjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run interrupted-task regression tests
        run: |
          pnpm --dir apps/desktop exec tsc -p ../../bloom-runtime/tsconfig.policy-tests.json
          node .tmp/bloom-policy-tests/headlessCrashRecovery.policy-test.js
          node .tmp/bloom-policy-tests/agentRuntimeOwnedPublishing.policy-test.js
      - name: Build Bloom worker
        run: pnpm run build:bloom-worker
      - name: Check Rust runtime bridge
        run: cargo check --manifest-path bloom-runtime/Cargo.toml --bin bloom-runtime-bridge
      - name: Verify diff and publish fix
        run: |
          git diff --check
          git status --short
          git config user.name 'Luna Bloom'
          git config user.email 'luna-bloom@users.noreply.github.com'
          git add bloom-runtime/src/agent_reconciliation.rs \
                  bloom-runtime/src/agent_runtime.rs \
                  bloom-runtime/ts/headlessBuilderExecutor.ts \
                  bloom-runtime/ts/headlessCrashRecovery.policy-test.ts \
                  bloom-runtime/ts/agentRuntimeOwnedPublishing.policy-test.ts
          git commit -m 'fix : retry interrupted non-writer tasks'
          git push origin HEAD:fix/luna-interrupted-task-retry-v2
