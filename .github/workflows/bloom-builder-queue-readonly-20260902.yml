name: Bloom Builder Queue Readonly 20260902

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect current production builder queue
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 6m
          script: |
            set -eu
            cd /home/ubuntu/bloombouquet
            echo "[trace] utc=$(date -u +%Y-%m-%dT%H:%M:%SZ) head=$(git rev-parse HEAD)"
            node <<'NODE'
            require('dotenv').config({ path: '.env' });
            const jwt = require('jsonwebtoken');
            const { execFileSync } = require('node:child_process');
            const base = 'http://127.0.0.1:3000';
            const token = jwt.sign(
              { id: 'sunwoo162-live-e2e', login: 'sunwoo162', name: 'sunwoo162', avatar_url: '', type: 'access' },
              process.env.JWT_SECRET,
              { expiresIn: '10m' },
            );
            const headers = { Cookie: `playground_token=${token}` };
            async function get(path) {
              const response = await fetch(`${base}${path}`, { headers });
              const text = await response.text();
              if (!response.ok) throw new Error(`${path} -> ${response.status}: ${text.slice(0, 300)}`);
              return text ? JSON.parse(text) : null;
            }
            async function main() {
              const projects = await get('/api/builder/projects');
              const latest = [...projects].sort((a, b) => b.id - a.id).slice(0, 8);
              for (const project of latest) {
                const runs = await get(`/api/builder/projects/${project.id}/runs`);
                const run = [...runs].sort((a, b) => b.id - a.id)[0] || null;
                let phase = '-';
                let version = '-';
                if (run) {
                  try {
                    const snapshot = await get(`/api/builder/projects/${project.id}/runs/${run.id}/snapshot`);
                    phase = snapshot?.phase || '-';
                    version = snapshot?.version ?? '-';
                  } catch {}
                }
                const marker = String(project.brief || '').includes('[BLOOM-E2E-SMOKE]');
                console.log(`[queue] project=${project.id} marker=${marker} projectStatus=${project.status} run=${run?.id ?? '-'} runStatus=${run?.status ?? '-'} worker=${run?.workerId || '-'} phase=${phase} version=${version} failure=${run?.failureReason || '-'}`);
              }
              const list = JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8' }));
              for (const name of ['bloom-evaluator-llm','bloom-builder-worker','bloom-evaluator-worker']) {
                const p = list.find((x) => x.name === name);
                const env = p?.pm2_env || {};
                console.log(`[pm2] ${name} status=${env.status || '-'} pid=${p?.pid || 0} restarts=${env.restart_time ?? '-'} uptime=${env.pm_uptime || '-'}`);
              }
            }
            main().catch((error) => { console.error(`[queue] FAILED ${error.stack || error}`); process.exit(1); });
            NODE
            echo '[process-tree]'
            ps -eo pid,ppid,etime,%cpu,%mem,stat,cmd --sort=pid | grep -E 'bloom-worker/run.js|bloom-runtime-bridge|bloomLocalAgentRuntime|llama|8091' | grep -v grep || true
            echo '[llama-health]'
            curl -fsS --max-time 3 http://127.0.0.1:8091/health || true
            echo
            echo '[llama-logs]'
            pm2 logs bloom-evaluator-llm --lines 120 --nostream 2>&1 | tail -n 160 || true
            echo '[builder-logs]'
            pm2 logs bloom-builder-worker --lines 160 --nostream 2>&1 | grep -E 'PM plan|builder run 36|semantic validation|repair' | tail -n 80 || true
            echo '[builder-36-pm-plan]'
            PM_PLAN=/home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-36/pm/pm-plan.json
            if [ -f "$PM_PLAN" ]; then cat "$PM_PLAN"; else echo '[missing]'; fi
