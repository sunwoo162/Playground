name: Bloom Builder Queue Readonly 20260902

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect builder 38 live attempt
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 6m
          script: |
            set -eu
            cd /home/ubuntu/bloombouquet
            echo "[trace] utc=$(date -u +%Y-%m-%dT%H:%M:%SZ) head=$(git rev-parse HEAD)"
            node <<'NODE'
            require('dotenv').config({ path: '.env' });
            const jwt = require('jsonwebtoken');
            const base = 'http://127.0.0.1:3000';
            const token = jwt.sign(
              { id: 'sunwoo162-live-e2e', login: 'sunwoo162', name: 'sunwoo162', avatar_url: '', type: 'access' },
              process.env.JWT_SECRET,
              { expiresIn: '10m' },
            );
            const headers = { Cookie: `playground_token=${token}` };
            async function get(path) {
              const response = await fetch(`${base}${path}`, { headers });
              const text = await response.text();
              if (!response.ok) throw new Error(`${path} -> ${response.status}: ${text.slice(0, 500)}`);
              return text ? JSON.parse(text) : null;
            }
            async function main() {
              const run = await get('/api/builder/projects/38/runs/38');
              const snapshot = await get('/api/builder/projects/38/runs/38/snapshot');
              const payload = snapshot?.payloadJson ? JSON.parse(snapshot.payloadJson) : null;
              console.log(`[run] status=${run?.status || '-'} failure=${run?.failureReason || '-'} phase=${snapshot?.phase || '-'} version=${snapshot?.version ?? '-'}`);
              console.log(`[repository] ${JSON.stringify(payload?.repository || null)}`);
              console.log(`[blockedReason] ${payload?.blockedReason || '-'}`);
              for (const task of payload?.taskRuns || []) {
                console.log(`[task] id=${task.taskId} role=${task.role} status=${task.status} attempts=${task.attempts} branch=${task.branchName || '-'} commit=${task.commitSha || '-'} pr=${task.pullRequestNumber || '-'} session=${task.sessionId || '-'} turn=${task.turnId || '-'} events=${task.eventsPath || '-'} stderr=${task.stderrPath || '-'} lastError=${task.lastError || '-'} blockers=${JSON.stringify(task.blockers || [])}`);
                if (task.verification?.length) console.log(`[verification:${task.taskId}] ${JSON.stringify(task.verification)}`);
              }
            }
            main().catch((error) => { console.error(`[inspect] FAILED ${error.stack || error}`); process.exit(1); });
            NODE
            ROOT=/home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-38
            echo '[builder-38-files]'
            if [ -d "$ROOT" ]; then
              find "$ROOT" -maxdepth 8 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %s %p\n' 2>/dev/null | sort | tail -n 160
            else
              echo '[missing-root]'
            fi
            echo '[llama-current]'
            node <<'NODE'
            const { execFileSync } = require('node:child_process');
            const list = JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8' }));
            const p = list.find((x) => x.name === 'bloom-evaluator-llm');
            console.log(JSON.stringify({ pid: p?.pid || 0, status: p?.pm2_env?.status, restart_time: p?.pm2_env?.restart_time, max_memory_restart: p?.pm2_env?.max_memory_restart, memory: p?.monit?.memory, cpu: p?.monit?.cpu }, null, 2));
            NODE
            echo '[builder-worker-logs]'
            pm2 logs bloom-builder-worker --lines 320 --nostream 2>&1 | grep -E 'builder run 38|blocked|Runtime|runtime|Agent|task|Local model|failed|error|tool' | tail -n 220 || true
