name: Bloom Builder Queue Readonly 20260902

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect active builder task wave
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 6m
          script: |
            set -eu
            cd /home/ubuntu/bloombouquet
            echo "[trace] utc=$(date -u +%Y-%m-%dT%H:%M:%SZ) head=$(git rev-parse HEAD)"
            node <<'NODE'
            require('dotenv').config({ path: '.env' });
            const fs = require('node:fs');
            const path = require('node:path');
            const jwt = require('jsonwebtoken');
            const base = 'http://127.0.0.1:3000';
            const token = jwt.sign(
              { id: 'sunwoo162-live-e2e', login: 'sunwoo162', name: 'sunwoo162', avatar_url: '', type: 'access' },
              process.env.JWT_SECRET,
              { expiresIn: '10m' },
            );
            const headers = { Cookie: `playground_token=${token}` };
            async function get(route) {
              const response = await fetch(`${base}${route}`, { headers });
              const text = await response.text();
              if (!response.ok) throw new Error(`${route} -> ${response.status}: ${text.slice(0, 500)}`);
              return text ? JSON.parse(text) : null;
            }
            async function main() {
              const projectId = 39;
              const runId = 39;
              const run = await get(`/api/builder/projects/${projectId}/runs/${runId}`);
              const snapshot = await get(`/api/builder/projects/${projectId}/runs/${runId}/snapshot`);
              console.log(`[run] status=${run?.status || '-'} failure=${run?.failureReason || '-'} phase=${snapshot?.phase || '-'} version=${snapshot?.version ?? '-'}`);
              if (snapshot?.payloadJson) {
                const payload = JSON.parse(snapshot.payloadJson);
                console.log('[task-status]');
                for (const task of payload.taskRuns || []) {
                  console.log(`${task.taskId} status=${task.status} attempts=${task.attempts} branch=${task.branchName || '-'} commit=${task.commitSha || '-'} pr=${task.pullRequestNumber || '-'} error=${JSON.stringify(task.lastError || null)} blockers=${JSON.stringify(task.blockers || [])}`);
                }
                console.log('[scheduler]');
                console.log(JSON.stringify(payload.schedulerObservability || null, null, 2));
              }
              const root = `/home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-${projectId}`;
              const planPath = path.join(root, 'pm', 'pm-plan.json');
              if (fs.existsSync(planPath)) {
                const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
                console.log(`[pm-plan] tasks=${plan.tasks?.length || 0}`);
                for (const task of plan.tasks || []) {
                  console.log(`[pm-task] id=${task.id || '-'} slug=${task.taskSlug || '-'} role=${task.agentRole || task.role || '-'} deps=${JSON.stringify(task.dependencies || task.dependsOn || [])}`);
                }
              }
            }
            main().catch((error) => { console.error(`[inspect] FAILED ${error.stack || error}`); process.exit(1); });
            NODE
            ROOT=/home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-39
            echo '[agent-files]'
            find "$ROOT/agents" -maxdepth 4 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %s %p\n' 2>/dev/null | sort | tail -n 120 || true
            echo '[agent-event-tails]'
            find "$ROOT/agents" -maxdepth 4 -type f \( -name '*.jsonl' -o -name '*stderr*' -o -name '*.log' \) -print0 2>/dev/null | while IFS= read -r -d '' f; do
              echo "--- $f"
              tail -n 8 "$f" | sed -E 's/([Tt][Oo][Kk][Ee][Nn]|[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Ss][Ee][Cc][Rr][Ee][Tt]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn])[^ ]*/\1=<redacted>/g' || true
            done
            echo '[active-runtimes]'
            ps -eo pid,ppid,etime,%cpu,%mem,stat,cmd --sort=pid | grep -E 'bloom-runtime-bridge|bloomLocalAgentRuntime|llama|8091' | grep -v grep || true
            echo '[llama-current]'
            node <<'NODE'
            const { execFileSync } = require('node:child_process');
            const list = JSON.parse(execFileSync('pm2', ['jlist'], { encoding: 'utf8' }));
            const p = list.find((x) => x.name === 'bloom-evaluator-llm');
            console.log(JSON.stringify({ pid: p?.pid || 0, status: p?.pm2_env?.status, restart_time: p?.pm2_env?.restart_time, max_memory_restart: p?.pm2_env?.max_memory_restart, memory: p?.monit?.memory, cpu: p?.monit?.cpu }, null, 2));
            NODE
