name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect backend changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -Eq '^(backend/|ecosystem\.config\.js$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.changes.outputs.backend == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build BloomBouquet root web
        run: |
          pnpm run build:bloom-web
          test -f dist/index.html
          grep -q '<title>BloomBouquet</title>' dist/index.html

      - name: Build Spring Boot JAR
        if: steps.changes.outputs.backend == 'true'
        run: |
          cd backend
          chmod +x ./gradlew
          ./gradlew bootJar -x test --no-daemon --stacktrace
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Copy JAR to server
        if: steps.changes.outputs.backend == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          source: "backend/build/libs/playground-backend-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/bloombouquet/backend/build/libs/"
          strip_components: 3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_CHANGED: ${{ steps.changes.outputs.backend }}
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          envs: BACKEND_CHANGED
          script: |
            set -eu
            BACKEND_CHANGED="${BACKEND_CHANGED:-false}"
            JWT_REGENERATED=false
            cd ~/bloombouquet

            record_failure() {
              mkdir -p dist
              printf '%s\n' "$1" > dist/deploy-error.txt
              exit 1
            }

            secure_production_env_files() {
              SHARED_ENV_FILE="/home/ubuntu/bloombouquet/.env"
              BACKEND_ENV_FILE="/home/ubuntu/bloombouquet/.env.backend"
              test -f "$SHARED_ENV_FILE" || record_failure "shared production env missing"
              chmod 600 "$SHARED_ENV_FILE"
              if [ -f "$BACKEND_ENV_FILE" ]; then
                chmod 600 "$BACKEND_ENV_FILE"
              fi
            }

            dump_backend_diagnostics() {
              echo "=== BloomBouquet backend diagnostics ==="
              pm2 status backend || true
              echo "--- backend PM2 logs ---"
              pm2 logs backend --lines 120 --nostream || true
              echo "--- port 8080 listeners ---"
              ss -ltnp 2>/dev/null | grep ':8080' || true
              echo "--- direct backend auth probe ---"
              curl -sS -i --max-time 5 http://127.0.0.1:8080/api/bouquet/auth/me || true
              echo
              echo "=== end backend diagnostics ==="
            }

            ensure_shared_jwt_secret() {
              ENV_FILE="/home/ubuntu/bloombouquet/.env"
              test -f "$ENV_FILE" || record_failure "shared production env missing"

              set -a
              . "$ENV_FILE"
              set +a
              JWT_SECRET="${JWT_SECRET:-}"

              if [ "${#JWT_SECRET}" -lt 32 ] || printf '%s' "$JWT_SECRET" | grep -q 'playground-jwt-secret-2024'; then
                JWT_SECRET="$(node -e "process.stdout.write(require('crypto').randomBytes(48).toString('hex'))")"
                TEMP_ENV="$(mktemp)"
                awk -v secret="$JWT_SECRET" '
                  BEGIN { replaced = 0 }
                  /^JWT_SECRET=/ { print "JWT_SECRET=" secret; replaced = 1; next }
                  { print }
                  END { if (!replaced) print "JWT_SECRET=" secret }
                ' "$ENV_FILE" > "$TEMP_ENV"
                chmod 600 "$TEMP_ENV"
                mv "$TEMP_ENV" "$ENV_FILE"
                export JWT_SECRET
                JWT_REGENERATED=true
                echo "Regenerated invalid production JWT secret."
              fi
            }

            git fetch origin main || record_failure "git fetch failed"
            git reset --hard origin/main || record_failure "git reset failed"
            secure_production_env_files

            export PATH="$HOME/.local/node_modules/.bin:$PATH"
            corepack enable || true
            corepack prepare pnpm@10.33.0 --activate || true
            command -v pnpm >/dev/null 2>&1 || npm install --prefix "$HOME/.local" pnpm@10.33.0 || record_failure "pnpm install local failed"

            DEPLOY_LOG="/tmp/bloombouquet-deploy-command.log"
            pnpm install --frozen-lockfile > "$DEPLOY_LOG" 2>&1 || { cat "$DEPLOY_LOG"; record_failure "pnpm install failed"; }
            pnpm run build:bloom-web > "$DEPLOY_LOG" 2>&1 || { cat "$DEPLOY_LOG"; record_failure "BloomBouquet build failed"; }
            test -f dist/index.html || record_failure "BloomBouquet dist/index.html missing"
            grep -q '<title>BloomBouquet</title>' dist/index.html || record_failure "BloomBouquet root shell marker missing"
            rm -f "$DEPLOY_LOG" dist/deploy-error.txt

            ensure_shared_jwt_secret
            SHARED_JWT_SECRET="$JWT_SECRET"
            SERVER_PORT="${PORT:-3000}"

            pm2 delete playground 2>/dev/null || true
            pm2 start ecosystem.config.js --only playground --update-env || record_failure "playground pm2 start failed"
            PLAYGROUND_PID="$(pm2 pid playground)"
            test -n "$PLAYGROUND_PID" && [ "$PLAYGROUND_PID" != "0" ] || record_failure "BloomBouquet Node server did not stay online"

            if [ "$BACKEND_CHANGED" = "true" ] || [ "$JWT_REGENERATED" = "true" ] || ! curl -fsS --max-time 3 http://127.0.0.1:8080/api/bouquet/auth/me >/dev/null 2>&1; then
              if [ -f /home/ubuntu/bloombouquet/.env.backend ]; then
                set -a
                . /home/ubuntu/bloombouquet/.env.backend
                set +a
              fi
              export JWT_SECRET="$SHARED_JWT_SECRET"

              test -n "${JWT_SECRET:-}" || { echo "JWT_SECRET is missing for backend"; exit 1; }
              test -n "${GITHUB_CLIENT_ID:-}" || { echo "GITHUB_CLIENT_ID is missing for backend"; exit 1; }
              test -n "${GITHUB_CLIENT_SECRET:-}" || { echo "GITHUB_CLIENT_SECRET is missing for backend"; exit 1; }

              pm2 delete backend 2>/dev/null || true
              pm2 start ecosystem.config.js --only backend --update-env || { dump_backend_diagnostics; record_failure "backend pm2 start failed"; }
              BACKEND_PID="$(pm2 pid backend)"
              test -n "$BACKEND_PID" && [ "$BACKEND_PID" != "0" ] || { dump_backend_diagnostics; record_failure "backend did not stay online"; }
            fi

            ROOT_OK=false
            AUTH_OK=false
            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${SERVER_PORT}/" | grep -q '<title>BloomBouquet</title>'; then
                ROOT_OK=true
              fi
              if curl -fsS "http://127.0.0.1:${SERVER_PORT}/api/bouquet/auth/me" >/tmp/bouquet-auth-smoke.json; then
                AUTH_OK=true
              fi
              if [ "$ROOT_OK" = "true" ] && [ "$AUTH_OK" = "true" ]; then
                break
              fi
              sleep 2
            done
            [ "$ROOT_OK" = "true" ] || record_failure "BloomBouquet root smoke check failed"
            if [ "$AUTH_OK" != "true" ]; then
              dump_backend_diagnostics
              record_failure "Bouquet auth proxy smoke check failed"
            fi
            rm -f /tmp/bouquet-auth-smoke.json

            pm2 save
            sudo systemctl reload nginx 2>/dev/null || true

            node scripts/notion-sync.js update || true

      - name: Verify BloomBouquet public domain
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN="bloombouquet.https.gsmsv.site"
          PUBLIC_OK=false

          for attempt in $(seq 1 20); do
            ROOT_STATUS="$(curl -sS -o /tmp/bloombouquet-root -w '%{http_code}' --max-time 10 "https://$DOMAIN/" || true)"
            AUTH_STATUS="$(curl -sS -o /tmp/bloombouquet-auth -w '%{http_code}' --max-time 10 "https://$DOMAIN/api/bouquet/auth/me" || true)"

            if [ "$ROOT_STATUS" = "200" ] \
              && grep -q '<title>BloomBouquet</title>' /tmp/bloombouquet-root \
              && [ "$AUTH_STATUS" = "200" ] \
              && grep -q '"user":null' /tmp/bloombouquet-auth; then
              PUBLIC_OK=true
              break
            fi

            sleep 3
          done

          rm -f /tmp/bloombouquet-root /tmp/bloombouquet-auth
          [ "$PUBLIC_OK" = "true" ] || { echo "BloomBouquet public domain smoke failed" >&2; exit 1; }
          echo "BloomBouquet public domain smoke passed"
