name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect backend changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -Eq '^backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.changes.outputs.backend == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm run install:all

      - name: Reinstall frontend workspace
        run: |
          pnpm store prune
          pnpm install --frozen-lockfile

      - name: Build frontend apps
        run: |
          pnpm run build:all
          pnpm --filter ./apps/virtual-study-room run build
          pnpm --filter ./apps/virtual-avatar run build
          pnpm --filter ./apps/voice-studio run build
          pnpm --filter ./apps/code-run-visualizer run build
          test -f apps/idea-mixer/dist/index.html
          test -f apps/virtual-study-room/dist/index.html
          test -f apps/virtual-avatar/dist/index.html
          test -f apps/voice-studio/dist/index.html
          test -f apps/code-run-visualizer/dist/index.html
          test -f apps/commute-alarm/dist/index.html

      - name: Build Spring Boot JAR
        if: steps.changes.outputs.backend == 'true'
        run: |
          cd backend
          chmod +x ./gradlew
          ./gradlew bootJar -x test --no-daemon --stacktrace
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Copy JAR to server
        if: steps.changes.outputs.backend == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          source: "backend/build/libs/playground-backend-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/playground/backend/build/libs/"
          strip_components: 3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_CHANGED: ${{ steps.changes.outputs.backend }}
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          envs: BACKEND_CHANGED
          script: |
            set -eu
            BACKEND_CHANGED="${BACKEND_CHANGED:-false}"
            cd ~/playground

            record_failure() {
              mkdir -p dist
              printf '%s\n' "$1" > dist/deploy-error.txt
              exit 1
            }

            # 서버에서 수정된 파일(application.yml 등) 무시하고 pull
            git fetch origin main || record_failure "git fetch failed"
            git reset --hard origin/main || record_failure "git reset failed"

            # 의존성 설치 및 프론트 빌드
            export PATH="$HOME/.local/node_modules/.bin:$PATH"
            corepack enable || true
            corepack prepare pnpm@10.33.0 --activate || true
            command -v pnpm >/dev/null 2>&1 || npm install --prefix "$HOME/.local" pnpm@10.33.0 > dist/deploy-command.log 2>&1 || record_failure "pnpm install local failed"
            pnpm run install:all > dist/deploy-command.log 2>&1 || record_failure "pnpm install failed"
            pnpm run build:all > dist/deploy-command.log 2>&1 || record_failure "pnpm build:all failed"
            pnpm --filter ./apps/virtual-study-room run build > dist/deploy-command.log 2>&1 || record_failure "virtual-study-room build failed"
            pnpm --filter ./apps/virtual-avatar run build > dist/deploy-command.log 2>&1 || record_failure "virtual-avatar build failed"
            pnpm --filter ./apps/voice-studio run build > dist/deploy-command.log 2>&1 || record_failure "voice-studio build failed"
            pnpm --filter ./apps/code-run-visualizer run build > dist/deploy-command.log 2>&1 || record_failure "code-run-visualizer build failed"
            pnpm --filter ./apps/commute-alarm run build > dist/deploy-command.log 2>&1 || record_failure "commute-alarm build failed"
            test -f apps/idea-mixer/dist/index.html || record_failure "idea-mixer dist missing"
            test -f apps/virtual-study-room/dist/index.html || record_failure "virtual-study-room dist missing"
            test -f apps/virtual-avatar/dist/index.html || record_failure "virtual-avatar dist missing"
            test -f apps/voice-studio/dist/index.html || record_failure "voice-studio dist missing"
            test -f apps/code-run-visualizer/dist/index.html || record_failure "code-run-visualizer dist missing"
            test -f apps/commute-alarm/dist/index.html || record_failure "commute-alarm dist missing"
            rm -f dist/deploy-error.txt
            rm -f dist/deploy-command.log

            # 공용 환경변수를 먼저 읽고 서비스별 env는 override로 적용
            export $(grep -v '^#' /home/ubuntu/playground/.env | xargs)
            test -n "${JWT_SECRET:-}" || { echo "JWT_SECRET is missing in /home/ubuntu/playground/.env"; exit 1; }

            # playground (Node.js) 재시작
            pm2 delete playground 2>/dev/null || true
            pm2 start ecosystem.config.js --only playground --update-env || record_failure "playground pm2 start failed"

            # backend는 변경됐거나 현재 내려가 있을 때 복구/재시작
            if [ "$BACKEND_CHANGED" = "true" ] || ! pm2 describe backend >/dev/null 2>&1; then
              if [ -f /home/ubuntu/playground/.env.backend ]; then
                export $(grep -v '^#' /home/ubuntu/playground/.env.backend | xargs)
              fi

              test -n "${JWT_SECRET:-}" || { echo "JWT_SECRET is missing for backend"; exit 1; }
              test -n "${GITHUB_CLIENT_ID:-}" || { echo "GITHUB_CLIENT_ID is missing for backend"; exit 1; }
              test -n "${GITHUB_CLIENT_SECRET:-}" || { echo "GITHUB_CLIENT_SECRET is missing for backend"; exit 1; }

              pm2 delete backend 2>/dev/null || true
              pm2 start ecosystem.config.js --only backend --update-env || record_failure "backend pm2 start failed"

              BACKEND_PID="$(pm2 pid backend)"
              test -n "$BACKEND_PID" && [ "$BACKEND_PID" != "0" ] || record_failure "backend did not stay online"
            fi

            pm2 save
            sudo systemctl reload nginx 2>/dev/null || true

            # Notion 업데이트
            node scripts/notion-sync.js update || true
