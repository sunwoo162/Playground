name: Evidence Vault Port Owner Probe

on:
  push:
    branches:
      - ops/evidence-vault-provider-cutover-20260828

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require SSH
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: bash
        run: |
          test -n "$SSH_PASSWORD"
          echo "PORT_OWNER_PROBE_SSH=available"

      - name: Inspect port ownership and ingress read-only
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: false
          script: |
            set -u
            PROCESS_NAME="evidence-vault-preview"
            PORT="3011"
            HOST_NAME="evidence-vault.https.gsmsv.site"
            GOOD_HOST="bloombouquet.https.gsmsv.site"
            OLD_HOST="playground.https.gsmsv.site"
            PM2_BIN="$(command -v pm2 2>/dev/null || true)"

            USER_PM2_PID=""
            if [ -n "$PM2_BIN" ]; then
              USER_PM2_PID="$($PM2_BIN pid "$PROCESS_NAME" 2>/dev/null | awk 'NF && $1 != 0 { print $1; exit }' || true)"
            fi
            if [ -n "$USER_PM2_PID" ]; then
              echo "PORT_OWNER_PROBE_USER_PM2=present"
            else
              echo "PORT_OWNER_PROBE_USER_PM2=absent"
            fi

            ROOT_PM2_PID=""
            if [ -n "$PM2_BIN" ]; then
              ROOT_PM2_PID="$(sudo -n "$PM2_BIN" pid "$PROCESS_NAME" 2>/dev/null | awk 'NF && $1 != 0 { print $1; exit }' || true)"
            fi
            if [ -n "$ROOT_PM2_PID" ]; then
              echo "PORT_OWNER_PROBE_ROOT_PM2=present"
            else
              echo "PORT_OWNER_PROBE_ROOT_PM2=absent"
            fi

            USER_LINE="$(ss -ltnp 2>/dev/null | awk -v port=":$PORT" '$4 ~ port"$" { print; exit }' || true)"
            if [ -n "$USER_LINE" ]; then
              echo "PORT_OWNER_PROBE_LISTENER=present"
              if printf '%s' "$USER_LINE" | grep -Eq 'pid=[0-9]+'; then
                echo "PORT_OWNER_PROBE_USER_SS_PID=visible"
              else
                echo "PORT_OWNER_PROBE_USER_SS_PID=hidden"
              fi
            else
              echo "PORT_OWNER_PROBE_LISTENER=absent"
            fi

            SUDO_LINE=""
            if sudo -n ss -ltnp >/tmp/evidence-vault-port-owner.txt 2>/dev/null; then
              echo "PORT_OWNER_PROBE_SUDO_SS=available"
              SUDO_LINE="$(awk -v port=":$PORT" '$4 ~ port"$" { print; exit }' /tmp/evidence-vault-port-owner.txt || true)"
            else
              echo "PORT_OWNER_PROBE_SUDO_SS=unavailable"
            fi
            rm -f /tmp/evidence-vault-port-owner.txt

            LISTENER_PID="$(printf '%s' "$SUDO_LINE" | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -n 1)"
            if [ -n "$LISTENER_PID" ]; then
              echo "PORT_OWNER_PROBE_SUDO_SS_PID=visible"
              LISTENER_USER="$(sudo -n ps -o user= -p "$LISTENER_PID" 2>/dev/null | awk 'NF {print $1; exit}' || true)"
              LISTENER_COMM="$(sudo -n ps -o comm= -p "$LISTENER_PID" 2>/dev/null | awk 'NF {print $1; exit}' || true)"
              if [ "$LISTENER_USER" = "ubuntu" ]; then
                echo "PORT_OWNER_PROBE_LISTENER_USER=ubuntu"
              elif [ "$LISTENER_USER" = "root" ]; then
                echo "PORT_OWNER_PROBE_LISTENER_USER=root"
              elif [ -n "$LISTENER_USER" ]; then
                echo "PORT_OWNER_PROBE_LISTENER_USER=other"
              else
                echo "PORT_OWNER_PROBE_LISTENER_USER=unknown"
              fi
              if [ "$LISTENER_COMM" = "node" ] || [ "$LISTENER_COMM" = "next-server" ]; then
                echo "PORT_OWNER_PROBE_LISTENER_PROCESS=node-like"
              elif [ -n "$LISTENER_COMM" ]; then
                echo "PORT_OWNER_PROBE_LISTENER_PROCESS=other"
              else
                echo "PORT_OWNER_PROBE_LISTENER_PROCESS=unknown"
              fi
            else
              echo "PORT_OWNER_PROBE_SUDO_SS_PID=hidden-or-absent"
            fi

            HEALTH="$(curl -fsS --max-time 3 http://127.0.0.1:3011/api/health 2>/dev/null || true)"
            if printf '%s' "$HEALTH" | grep -q '"ok":true' && printf '%s' "$HEALTH" | grep -q '"service":"evidence-vault"'; then
              echo "PORT_OWNER_PROBE_LOCAL_HEALTH=evidence-vault"
            else
              echo "PORT_OWNER_PROBE_LOCAL_HEALTH=unexpected"
            fi

            ENV_LINE="$(grep -E '^BOUQUET_BASE_URL=' /home/ubuntu/evidence-vault/.env.production | tail -n 1 || true)"
            if printf '%s' "$ENV_LINE" | grep -Fq 'playground.https.gsmsv.site'; then
              echo "PORT_OWNER_PROBE_ENV=old"
            elif printf '%s' "$ENV_LINE" | grep -Fq 'bloombouquet.https.gsmsv.site'; then
              echo "PORT_OWNER_PROBE_ENV=new"
            else
              echo "PORT_OWNER_PROBE_ENV=unexpected"
            fi
            if [ "$(stat -c '%a' /home/ubuntu/evidence-vault/.env.production 2>/dev/null || true)" = "600" ]; then
              echo "PORT_OWNER_PROBE_ENV_MODE=600"
            else
              echo "PORT_OWNER_PROBE_ENV_MODE=invalid"
            fi

            if systemctl is-active --quiet nginx 2>/dev/null; then
              echo "INGRESS_PROBE_NGINX_SERVICE=active"
            else
              echo "INGRESS_PROBE_NGINX_SERVICE=inactive-or-missing"
            fi

            if sudo -n nginx -t >/dev/null 2>&1; then
              echo "INGRESS_PROBE_NGINX_CONFIG=valid"
            else
              echo "INGRESS_PROBE_NGINX_CONFIG=invalid-or-unavailable"
            fi

            MATCHED_CONFIGS="$(sudo -n grep -R -l -F "$HOST_NAME" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true)"
            if [ -n "$MATCHED_CONFIGS" ]; then
              echo "INGRESS_PROBE_HOST_CONFIG=present"
              if printf '%s\n' "$MATCHED_CONFIGS" | while IFS= read -r file; do sudo -n grep -Eq 'proxy_pass[[:space:]]+http://127\.0\.0\.1:3011' "$file" || exit 1; done; then
                echo "INGRESS_PROBE_PROXY_TARGET=3011"
              else
                echo "INGRESS_PROBE_PROXY_TARGET=unexpected"
              fi
            else
              echo "INGRESS_PROBE_HOST_CONFIG=absent"
            fi

            LOCAL_NGINX_STATUS="$(curl -sS -o /dev/null --max-time 5 -w '%{http_code}' -H "Host: $HOST_NAME" http://127.0.0.1/api/health 2>/dev/null || true)"
            echo "INGRESS_PROBE_LOCAL_NGINX_STATUS=${LOCAL_NGINX_STATUS:-request-failed}"

            PUBLIC_ROOT_STATUS="$(curl -sS -o /tmp/evidence-public-root --max-time 8 -w '%{http_code}' "https://$HOST_NAME/" 2>/dev/null || true)"
            PUBLIC_STATUS="$(curl -sS -D /tmp/evidence-public-headers -o /tmp/evidence-public-body --max-time 8 -w '%{http_code}' "https://$HOST_NAME/api/health" 2>/dev/null || true)"
            GOOD_STATUS="$(curl -sS -D /tmp/bloom-public-headers -o /tmp/bloom-public-body --max-time 8 -w '%{http_code}' "https://$GOOD_HOST/api/bouquet/auth/me" 2>/dev/null || true)"
            OLD_STATUS="$(curl -sS -o /dev/null --max-time 8 -w '%{http_code}' "https://$OLD_HOST/" 2>/dev/null || true)"
            echo "INGRESS_PROBE_PUBLIC_ROOT_STATUS=${PUBLIC_ROOT_STATUS:-request-failed}"
            echo "INGRESS_PROBE_PUBLIC_STATUS=${PUBLIC_STATUS:-request-failed}"
            echo "INGRESS_PROBE_GOOD_HOST_STATUS=${GOOD_STATUS:-request-failed}"
            echo "INGRESS_PROBE_OLD_HOST_STATUS=${OLD_STATUS:-request-failed}"

            EV_IPS="$(getent ahostsv4 "$HOST_NAME" 2>/dev/null | awk '{print $1}' | sort -u | tr '\n' ' ')"
            GOOD_IPS="$(getent ahostsv4 "$GOOD_HOST" 2>/dev/null | awk '{print $1}' | sort -u | tr '\n' ' ')"
            OLD_IPS="$(getent ahostsv4 "$OLD_HOST" 2>/dev/null | awk '{print $1}' | sort -u | tr '\n' ' ')"
            if [ -n "$EV_IPS" ] && [ "$EV_IPS" = "$GOOD_IPS" ]; then
              echo "INGRESS_PROBE_DNS_MATCH_BLOOM=yes"
            else
              echo "INGRESS_PROBE_DNS_MATCH_BLOOM=no"
            fi
            if [ -n "$EV_IPS" ] && [ "$EV_IPS" = "$OLD_IPS" ]; then
              echo "INGRESS_PROBE_DNS_MATCH_OLD=yes"
            else
              echo "INGRESS_PROBE_DNS_MATCH_OLD=no"
            fi

            EVIDENCE_SERVER="$(awk 'BEGIN{IGNORECASE=1} /^server:/ {sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' /tmp/evidence-public-headers)"
            BLOOM_SERVER="$(awk 'BEGIN{IGNORECASE=1} /^server:/ {sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' /tmp/bloom-public-headers)"
            if [ -n "$EVIDENCE_SERVER" ] && [ "$EVIDENCE_SERVER" = "$BLOOM_SERVER" ]; then
              echo "INGRESS_PROBE_SERVER_HEADER_MATCH=yes"
            else
              echo "INGRESS_PROBE_SERVER_HEADER_MATCH=no"
            fi

            if grep -qi '<title>BloomBouquet</title>' /tmp/evidence-public-body 2>/dev/null; then
              echo "INGRESS_PROBE_404_BODY=bloombouquet"
            elif grep -qi 'nginx' /tmp/evidence-public-body 2>/dev/null; then
              echo "INGRESS_PROBE_404_BODY=nginx"
            elif grep -qi '404' /tmp/evidence-public-body 2>/dev/null; then
              echo "INGRESS_PROBE_404_BODY=generic-404"
            else
              echo "INGRESS_PROBE_404_BODY=unclassified"
            fi

            LOCAL_TLS_STATUS="$(curl -k -sS --resolve "$HOST_NAME:443:127.0.0.1" -o /dev/null --max-time 5 -w '%{http_code}' "https://$HOST_NAME/api/health" 2>/dev/null || true)"
            echo "INGRESS_PROBE_LOCAL_TLS_STATUS=${LOCAL_TLS_STATUS:-request-failed}"

            PORT_443_LINE="$(sudo -n ss -ltnp 2>/dev/null | awk '$4 ~ /:443$/ { print; exit }' || true)"
            if [ -n "$PORT_443_LINE" ]; then
              PORT_443_PID="$(printf '%s' "$PORT_443_LINE" | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -n 1)"
              PORT_443_COMM="$(sudo -n ps -o comm= -p "$PORT_443_PID" 2>/dev/null | awk 'NF {print $1; exit}' || true)"
              if [ "$PORT_443_COMM" = "nginx" ]; then
                echo "INGRESS_PROBE_LOCAL_443=nginx"
              elif [ -n "$PORT_443_COMM" ]; then
                echo "INGRESS_PROBE_LOCAL_443=other"
              else
                echo "INGRESS_PROBE_LOCAL_443=unknown"
              fi
            else
              echo "INGRESS_PROBE_LOCAL_443=absent"
            fi

            rm -f /tmp/evidence-public-root /tmp/evidence-public-headers /tmp/evidence-public-body /tmp/bloom-public-headers /tmp/bloom-public-body
