name: Bloom E2E49 Readonly

on:
  push:
    branches:
      - test/bloom-e2e49-readonly

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect latest Bloom Live E2E owner state
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 6m
          script: |
            set -eu
            cd /home/ubuntu/bloombouquet
            echo "[trace] utc=$(date -u +%Y-%m-%dT%H:%M:%SZ) head=$(git rev-parse HEAD)"
            node <<'NODE'
            require('dotenv').config({ path: '.env' });
            const jwt = require('jsonwebtoken');
            const base = 'http://127.0.0.1:3000';
            const marker = '[BLOOM-E2E-SMOKE]';
            const token = jwt.sign(
              { id: 'bloom-live-e2e-actions', login: 'bloom-live-e2e', name: 'Bloom Live E2E', avatar_url: '', type: 'access' },
              process.env.JWT_SECRET,
              { expiresIn: '10m' },
            );
            const headers = { Cookie: `playground_token=${token}` };
            async function get(route, allowEmpty = false) {
              const response = await fetch(`${base}${route}`, { headers });
              const text = await response.text();
              if (allowEmpty && response.status === 204) return null;
              if (!response.ok) throw new Error(`${route} -> ${response.status}: ${text.slice(0, 300)}`);
              return text ? JSON.parse(text) : null;
            }
            async function main() {
              const projects = await get('/api/builder/projects');
              const project = [...projects]
                .filter((item) => String(item.brief || '').includes(marker))
                .sort((a, b) => b.id - a.id)[0];
              if (!project) throw new Error('current Bloom Live E2E project not found for workflow owner');
              const runs = await get(`/api/builder/projects/${project.id}/runs`);
              const run = [...runs].sort((a, b) => b.id - a.id)[0];
              if (!run) throw new Error(`run not found for project ${project.id}`);
              const snapshot = await get(`/api/builder/projects/${project.id}/runs/${run.id}/snapshot`, true);
              const payload = snapshot?.payloadJson ? JSON.parse(snapshot.payloadJson) : null;
              const expected = String(project.brief || '').match(/Use the exact repository name ([A-Za-z0-9._-]+)/)?.[1] || '-';
              console.log(`[state] project=${project.id} run=${run.id} projectStatus=${project.status} runStatus=${run.status} worker=${run.workerId || '-'} failure=${run.failureReason || '-'}`);
              console.log(`[state] expectedRepo=${expected} projectRepo=${project.repositoryFullName || '-'} planRepo=${payload?.plan?.repositoryName || '-'} phase=${snapshot?.phase || '-'} version=${snapshot?.version ?? '-'}`);
              const roles = (payload?.plan?.tasks || []).map((task) => task.role);
              console.log(`[plan] roles=${roles.join(',')} frontend=${roles.includes('frontend')} backend=${roles.includes('backend')}`);
              for (const task of payload?.taskRuns || []) {
                console.log(`[task] ${task.taskId || '-'} role=${task.role || '-'} status=${task.status || '-'} attempts=${task.attempts ?? '-'} commit=${task.commitSha || '-'} pr=${task.pullRequestNumber || '-'} error=${String(task.lastError || task.error || '-').replace(/\s+/g, ' ').slice(0, 300)}`);
              }
              const runtimeProjectId = payload?.runtimeProjectId || `builder-${project.id}`;
              console.log(`[runtime] id=${runtimeProjectId}`);
              process.stdout.write(runtimeProjectId);
            }
            main().catch((error) => { console.error(`[inspect] FAILED ${error.stack || error}`); process.exit(1); });
            NODE
            echo
            echo '[runtime-processes]'
            ps -eo pid,ppid,etime,%cpu,%mem,stat,cmd --sort=pid \
              | grep -E 'bloom-worker/run.js|bloom-runtime-bridge|bloomLocalAgentRuntime|llama serve' \
              | grep -v grep || true
