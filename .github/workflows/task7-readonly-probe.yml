name: Task 7 Owner Context Probe

on:
  push:
    branches:
      - ops/task7-readonly-probe

permissions:
  contents: read

jobs:
  probe-owner-context:
    runs-on: ubuntu-latest
    steps:
      - name: Read project context with worker kept stopped
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 5m
          script: |
            set -eu
            cd /home/ubuntu/bloombouquet
            WORKER_STATUS="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(v=>v.name==="bloom-worker");process.stdout.write(x?.pm2_env?.status||"missing")})')"
            [ "$WORKER_STATUS" = "stopped" ] || { echo "bloom-worker must stay stopped, found=$WORKER_STATUS" >&2; exit 1; }
            echo "bloom-worker=$WORKER_STATUS"

            DB_USER="$(awk '/^[[:space:]]+username:/{print $2; exit}' backend/src/main/resources/application.yml)"
            DB_PASS="$(awk '/^[[:space:]]+password:/{print $2; exit}' backend/src/main/resources/application.yml)"

            echo '=== EVIDENCE VAULT PROJECT CANDIDATES ==='
            MYSQL_PWD="$DB_PASS" mysql -h 127.0.0.1 -u "$DB_USER" playground_db -N -B -e "
              SELECT p.id,t.id,t.name,p.name,p.slug,p.published,
                     COALESCE(s.id,''),COALESCE(s.version_label,''),COALESCE(s.demo_url,'')
              FROM bloom_bouquet_projects p
              JOIN bloom_bouquet_teams t ON t.id=p.team_id
              LEFT JOIN bloom_bouquet_submissions s ON s.id=(
                SELECT s2.id FROM bloom_bouquet_submissions s2 WHERE s2.project_id=p.id ORDER BY s2.created_at DESC LIMIT 1
              )
              WHERE LOWER(p.name) LIKE '%evidence%'
                 OR LOWER(p.slug) LIKE '%evidence%'
                 OR s.frontend_repository_url='https://github.com/BloomBouquet/evidence-vault'
                 OR s.backend_repository_url='https://github.com/BloomBouquet/evidence-vault'
              ORDER BY p.updated_at DESC;"

            echo '=== ALL OWNER CONSOLE PROJECTS ==='
            MYSQL_PWD="$DB_PASS" mysql -h 127.0.0.1 -u "$DB_USER" playground_db -N -B -e "
              SELECT p.id,t.name,p.name,p.slug,p.published
              FROM bloom_bouquet_projects p
              JOIN bloom_bouquet_teams t ON t.id=p.team_id
              ORDER BY t.id,p.id;"
