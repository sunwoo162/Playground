name: Task 7 Nginx Default Probe

on:
  push:
    branches:
      - ops/task7-readonly-probe

permissions:
  contents: read

jobs:
  probe-nginx-default:
    runs-on: ubuntu-latest
    steps:
      - name: Read active default nginx config
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 5m
          script: |
            set -eu
            STATUS="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(v=>v.name==="bloom-worker");process.stdout.write(x?.pm2_env?.status||"missing")})')"
            [ "$STATUS" = "stopped" ] || { echo "bloom-worker must stay stopped, found=$STATUS" >&2; exit 1; }
            echo "bloom-worker=$STATUS"
            ENABLED=/etc/nginx/sites-enabled/default
            [ -e "$ENABLED" ] || { echo 'default nginx config missing' >&2; exit 1; }
            printf 'enabled='; readlink -f "$ENABLED"
            echo '=== CONFIG ==='
            sudo sed -n '1,220p' "$ENABLED"
            echo '=== NGINX TEST ==='
            sudo nginx -t
