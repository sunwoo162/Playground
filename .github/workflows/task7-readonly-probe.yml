name: Task 7 Evidence Vault Nginx Probe

on:
  push:
    branches:
      - ops/task7-readonly-probe

permissions:
  contents: read

jobs:
  probe-evidence-nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Read current standalone Evidence Vault nginx config
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 5m
          script: |
            set -eu
            STATUS="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(v=>v.name==="bloom-worker");process.stdout.write(x?.pm2_env?.status||"missing")})')"
            [ "$STATUS" = "stopped" ] || { echo "bloom-worker must stay stopped, found=$STATUS" >&2; exit 1; }
            echo "bloom-worker=$STATUS"

            echo '=== EVIDENCE VAULT NGINX FILES ==='
            MATCHES="$(sudo grep -RIlE 'server_name[[:space:]]+evidence-vault\.https\.gsmsv\.site([[:space:];]|$)' /etc/nginx 2>/dev/null || true)"
            printf '%s\n' "$MATCHES"
            for FILE in $MATCHES; do
              echo "--- $FILE ---"
              sudo sed -n '1,180p' "$FILE"
            done

            echo '=== PORT 3011 REFERENCES ==='
            sudo grep -RInE '127\.0\.0\.1:3011|localhost:3011' /etc/nginx 2>/dev/null || true
            sudo nginx -t
