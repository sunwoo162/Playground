name: Task 7 Stop Bloom Worker

on:
  push:
    branches:
      - ops/task7-readonly-probe

permissions:
  contents: read

jobs:
  stop-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Stop only Bloom evaluator worker
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 5m
          script: |
            set -eu
            cd /home/ubuntu/bloombouquet
            DB_USER="$(awk '/^[[:space:]]+username:/{print $2; exit}' backend/src/main/resources/application.yml)"
            DB_PASS="$(awk '/^[[:space:]]+password:/{print $2; exit}' backend/src/main/resources/application.yml)"

            RUNNING_COUNT="$(MYSQL_PWD="$DB_PASS" mysql -h 127.0.0.1 -u "$DB_USER" playground_db -N -B -e "SELECT COUNT(*) FROM bloom_bouquet_evaluation_runs WHERE status='RUNNING';")"
            [ "$RUNNING_COUNT" = "0" ] || { echo "Refusing to stop worker: RUNNING evaluations=$RUNNING_COUNT" >&2; exit 1; }

            pm2 stop bloom-worker
            pm2 save

            STATUS="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(v=>v.name==="bloom-worker");process.stdout.write(x?.pm2_env?.status||"missing")})')"
            [ "$STATUS" = "stopped" ] || { echo "bloom-worker status=$STATUS" >&2; exit 1; }

            echo "bloom-worker=$STATUS"
            pm2 jlist | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                for(const name of ["playground","backend","bloom-evaluator-llm","evidence-vault-preview"]){
                  const x=JSON.parse(s).find(v=>v.name===name);
                  console.log(`${name}=${x?.pm2_env?.status||"missing"}`);
                  if(x?.pm2_env?.status!=="online") process.exitCode=1;
                }
              })'

            echo 'active-evaluations:'
            MYSQL_PWD="$DB_PASS" mysql -h 127.0.0.1 -u "$DB_USER" playground_db -N -B -e "
              SELECT r.id,r.status,p.name,s.version_label
              FROM bloom_bouquet_evaluation_runs r
              JOIN bloom_bouquet_submissions s ON s.id=r.submission_id
              JOIN bloom_bouquet_projects p ON p.id=s.project_id
              WHERE r.status IN ('QUEUED','RUNNING')
              ORDER BY r.created_at ASC;"
