name: Luna Output Guard Regression Runner

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/luna-agent-output-guard
          fetch-depth: 0
      - name: Inspect agent runtime test surface
        shell: bash
        run: |
          set -euo pipefail
          echo '=== runtime command surface ==='
          grep -nE 'Command::new\(|app-server|read_json_line|turn/completed|item/agentMessage/delta' bloom-runtime/src/agent_runtime.rs | head -120
          echo '=== bridge surface ==='
          grep -RniE 'agent-task|run_agent|AgentTaskRuntimeInput' bloom-runtime/src | head -120
          echo '=== existing tests ==='
          grep -RniE '#\[test\]|cfg\(test\)' bloom-runtime/src bloom-runtime/tests 2>/dev/null | head -160 || true
