name: Live E2E Readonly Diagnostic 20260902

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect production Luna task without mutation
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 8m
          script: |
            set -u
            cd /home/ubuntu/bloombouquet
            export PATH="$HOME/.local/bin:$HOME/.llama/bin:$HOME/.local/node_modules/.bin:$PATH"

            echo '=== TIME ==='
            date -u
            echo '=== DISK ==='
            df -hT /

            echo '=== PM2 BUILDER ==='
            pm2 jlist | node -e '
              let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{
                const p=JSON.parse(s).find(x=>x.name==="bloom-builder-worker");
                console.log(JSON.stringify({pid:p?.pid,status:p?.pm2_env?.status,restarts:p?.pm2_env?.restart_time,uptime:p?.pm2_env?.pm_uptime}));
              });'

            echo '=== PROCESS TREE ==='
            builder_pid="$(pm2 pid bloom-builder-worker 2>/dev/null | tail -1 || true)"
            echo "builder_pid=${builder_pid:-unknown}"
            if [ -n "${builder_pid:-}" ] && [ "${builder_pid}" != "0" ]; then
              pstree -ap "$builder_pid" 2>/dev/null || true
            fi

            echo '=== RELEVANT PROCESSES ==='
            ps -eo pid=,ppid=,etime=,stat=,args= | grep -E 'luna-agent|builder-25|PB-001|codex|claude|gemini|node' | grep -v 'grep -E' | tail -120 || true

            echo '=== ACTIVE TASK TOOL DIR ==='
            task_root='/tmp/luna-agent-tools/builder-25/PB-001'
            if [ -d "$task_root" ]; then
              du -xsh "$task_root" 2>/dev/null || true
              find "$task_root" -maxdepth 2 -mindepth 1 -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %y %p\n' 2>/dev/null | sort | tail -120 || true
            else
              echo "missing $task_root"
              find /tmp/luna-agent-tools -maxdepth 2 -mindepth 1 -type d -path '*builder-25*' -print 2>/dev/null | head -80 || true
            fi

            echo '=== BUILDER LOG TAIL ==='
            pm2 logs bloom-builder-worker --lines 180 --nostream 2>&1 | tail -220 || true

            echo '=== RUN SNAPSHOT ==='
            node <<'NODE'
            require('dotenv').config({ path: '.env' });
            const jwt = require('jsonwebtoken');
            const base = 'http://127.0.0.1:3000';
            const token = jwt.sign(
              { id: 'sunwoo162-live-e2e', login: 'sunwoo162', name: 'sunwoo162', avatar_url: '', type: 'access' },
              process.env.JWT_SECRET,
              { expiresIn: '5m' },
            );
            const headers = { Cookie: `playground_token=${token}` };
            async function get(path) {
              const r = await fetch(`${base}${path}`, { headers });
              const text = await r.text();
              if (!r.ok) throw new Error(`${path} -> ${r.status}: ${text.slice(0, 300)}`);
              return text ? JSON.parse(text) : null;
            }
            (async () => {
              const project = await get('/api/builder/projects/25');
              const run = await get('/api/builder/projects/25/runs/25');
              const snapshot = await get('/api/builder/projects/25/runs/25/snapshot');
              const payload = snapshot?.payloadJson ? JSON.parse(snapshot.payloadJson) : null;
              console.log(JSON.stringify({
                projectStatus: project?.status,
                runStatus: run?.status,
                heartbeatAt: run?.heartbeatAt,
                failureReason: run?.failureReason || project?.failureReason || null,
                phase: snapshot?.phase,
                version: snapshot?.version,
                repository: project?.repositoryFullName,
                tasks: (payload?.taskRuns || []).map(t => ({
                  taskId:t.taskId, role:t.role, status:t.status, attempts:t.attempts,
                  pr:t.pullRequestNumber, commit:t.commitSha, lastError:t.lastError,
                })),
              }, null, 2));
            })().catch(e => { console.error(e.stack || String(e)); process.exitCode = 1; });
            NODE
