name: Bloom Live E2E PM Role Repair Verification

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/live-e2e-pm-implementation-roles
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add Live E2E PM implementation-role validation
        run: |
          python3 <<'PY'
          from pathlib import Path

          e2e = Path('bloom-runtime/ts/e2eSmoke.ts')
          text = e2e.read_text()
          anchor = '''const GOVERNANCE_ROLES: ExecutableAgentRole[] = [
            "data-marketing",
            "documentation",
            "code-review",
            "reviewer",
            "qa",
          ];
          '''
          insert = anchor + '''
          type LiveE2EImplementationPlan = {
            tasks: Array<{ role: ExecutableAgentRole }>;
          };

          export function validateLiveE2EImplementationPlan(
            request: string,
            plan: LiveE2EImplementationPlan,
          ) {
            if (!request.includes(LIVE_E2E_MARKER)) return;

            const roles = new Set(plan.tasks.map((task) => task.role));
            const missingRoles = IMPLEMENTATION_ROLES.filter((role) => !roles.has(role));
            if (missingRoles.length > 0) {
              throw new Error(
                `Bloom live E2E PM 계획에 필수 구현 Agent role이 없습니다: ${missingRoles.join(", ")}`,
              );
            }
          }
          '''
          if 'export function validateLiveE2EImplementationPlan' not in text:
              if anchor not in text:
                  raise SystemExit('e2eSmoke.ts insertion anchor not found')
              text = text.replace(anchor, insert, 1)
              e2e.write_text(text)

          worker = Path('bloom-worker/run.js')
          text = worker.read_text()
          require_anchor = 'const { prepareOrchestrationPlan } = require("../.tmp/bloom-worker/orchestrationCore.js");\n'
          require_insert = require_anchor + 'const { validateLiveE2EImplementationPlan } = require("../.tmp/bloom-worker/e2eSmoke.js");\n'
          if 'const { validateLiveE2EImplementationPlan }' not in text:
              if require_anchor not in text:
                  raise SystemExit('run.js require anchor not found')
              text = text.replace(require_anchor, require_insert, 1)

          semantic_anchor = '    "PM Task DAG",\n'
          semantic_insert = semantic_anchor + '    "필수 구현 Agent role",\n'
          if '    "필수 구현 Agent role",' not in text:
              if semantic_anchor not in text:
                  raise SystemExit('run.js semantic marker anchor not found')
              text = text.replace(semantic_anchor, semantic_insert, 1)

          validation_anchor = '        result.plan = prepareOrchestrationPlan(result.plan);\n        return result;\n'
          validation_insert = '        result.plan = prepareOrchestrationPlan(result.plan);\n        validateLiveE2EImplementationPlan(input.request, result.plan);\n        return result;\n'
          if 'validateLiveE2EImplementationPlan(input.request, result.plan);' not in text:
              if validation_anchor not in text:
                  raise SystemExit('run.js PM repair validation anchor not found')
              text = text.replace(validation_anchor, validation_insert, 1)

          worker.write_text(text)
          PY

      - name: Run Bloom runtime policy tests
        run: pnpm run test:bloom-runtime

      - name: Run production runtime policy tests
        run: pnpm run test:production-runtime

      - name: Build Bloom worker
        run: pnpm run build:bloom-worker

      - name: Check diff
        run: |
          git diff --check
          git diff --name-status

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloom-runtime/ts/e2eSmoke.ts bloom-worker/run.js
          git diff --cached --quiet && exit 0
          git commit -m "fix : repair missing live e2e implementation roles"
          git push origin HEAD:fix/live-e2e-pm-implementation-roles
