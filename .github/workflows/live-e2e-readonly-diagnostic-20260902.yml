name: Luna Output Guard GREEN Runner

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/luna-agent-output-guard
          fetch-depth: 0

      - name: Install Tauri Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Implement aggregate agent output guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('bloom-runtime/src/agent_runtime.rs')
          text = path.read_text()

          const_anchor = 'const MAX_JSONL_LINE_BYTES: usize = 10 * 1024 * 1024;\n'
          if text.count(const_anchor) != 1:
              raise SystemExit(f'unexpected MAX_JSONL_LINE_BYTES anchor count: {text.count(const_anchor)}')
          text = text.replace(
              const_anchor,
              const_anchor + 'const MAX_AGENT_MESSAGE_DELTA_BYTES: usize = 512 * 1024;\n',
              1,
          )

          state_anchor = '''        let mut final_message: Option<String> = None;
                  let mut turn_status: Option<String> = None;
                  let mut turn_error: Option<String> = None;
          '''
          if text.count(state_anchor) != 1:
              raise SystemExit(f'unexpected turn state anchor count: {text.count(state_anchor)}')
          text = text.replace(
              state_anchor,
              state_anchor + '        let mut streamed_agent_message_bytes = 0usize;\n',
              1,
          )

          loop_anchor = '''            let value = read_json_line(&mut reader, &mut events_log)?;
                      let method = value.get("method").and_then(Value::as_str).unwrap_or_default();
          '''
          if text.count(loop_anchor) != 1:
              raise SystemExit(f'unexpected event loop anchor count: {text.count(loop_anchor)}')
          guard = '''            let value = read_json_line(&mut reader, &mut events_log)?;
                      let method = value.get("method").and_then(Value::as_str).unwrap_or_default();
                      if method == "item/agentMessage/delta" {
                          if let Some(delta) = value
                              .get("params")
                              .and_then(|params| params.get("delta"))
                              .and_then(Value::as_str)
                          {
                              streamed_agent_message_bytes = streamed_agent_message_bytes
                                  .checked_add(delta.len())
                                  .ok_or_else(|| {
                                      "Codex Agent 메시지 누적 출력 안전 한도 계산이 overflow 되었습니다."
                                          .to_string()
                                  })?;
                              if streamed_agent_message_bytes > MAX_AGENT_MESSAGE_DELTA_BYTES {
                                  return Err(format!(
                                      "Codex Agent 메시지 누적 출력 안전 한도를 초과했습니다. bytes={}, limit={}",
                                      streamed_agent_message_bytes,
                                      MAX_AGENT_MESSAGE_DELTA_BYTES
                                  ));
                              }
                          }
                      }
          '''
          text = text.replace(loop_anchor, guard, 1)
          path.write_text(text)
          PY

          git rm -f .github/workflows/luna-agent-output-guard-patch.yml
          git rm -f .github/luna-agent-output-guard-trigger.txt
          cargo fmt --manifest-path bloom-runtime/Cargo.toml
          git diff --check
          git status --short

      - name: Verify targeted regression GREEN
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path bloom-runtime/Cargo.toml --test agent_output_guard rejects_agent_message_delta_stream_over_safe_limit -- --nocapture

      - name: Verify full Bloom runtime tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path bloom-runtime/Cargo.toml

      - name: Verify Bloom runtime check
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path bloom-runtime/Cargo.toml
          git diff --check

      - name: Commit implementation and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bloom-runtime/src/agent_runtime.rs bloom-runtime/tests/agent_output_guard.rs
          git add -u .github
          git diff --cached --check
          echo '=== staged diff stat ==='
          git diff --cached --stat
          git commit -m 'fix : bound Luna agent message output'
          git push origin HEAD:fix/luna-agent-output-guard
