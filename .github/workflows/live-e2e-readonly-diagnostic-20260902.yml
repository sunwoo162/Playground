name: Live E2E Readonly Diagnostic 20260902

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect production Luna task without mutation
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 8m
          script: |
            set -u
            cd /home/ubuntu/bloombouquet
            export PATH="$HOME/.local/bin:$HOME/.llama/bin:$HOME/.local/node_modules/.bin:$PATH"

            echo '=== TIME / DISK ==='
            date -u
            df -hT /

            echo '=== BUILDER PROCESS TREE ==='
            builder_pid="$(pm2 pid bloom-builder-worker 2>/dev/null | tail -1 || true)"
            echo "builder_pid=${builder_pid:-unknown}"
            if [ -n "${builder_pid:-}" ] && [ "${builder_pid}" != "0" ]; then
              pstree -ap "$builder_pid" 2>/dev/null || true
            fi
            ps -eo pid=,ppid=,etime=,stat=,%cpu=,%mem=,wchan:24=,args= | grep -E 'bloom-runtime-b|codex app-server|codex-code-mode' | grep -v 'grep -E' || true

            echo '=== PB-001 TOOL STATE ==='
            task_root='/tmp/luna-agent-tools/builder-25/PB-001'
            if [ -d "$task_root" ]; then
              du -xsh "$task_root" 2>/dev/null || true
              find "$task_root" -maxdepth 2 -mindepth 1 -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %y %p\n' 2>/dev/null | sort | tail -80 || true
            fi

            echo '=== PB-001 APP-SERVER EVENT FILES ==='
            mapfile -t event_files < <(find /home/ubuntu /srv/bloombouquet /tmp -type f -path '*/.luna-runtime/projects/*/*/PB-001/app-server-events.jsonl' -print 2>/dev/null | head -10)
            if [ "${#event_files[@]}" -eq 0 ]; then
              echo 'PB-001 event file not found'
            fi
            for events in "${event_files[@]}"; do
              echo "events=$events"
              stat -c 'size=%s modified=%y' "$events" 2>/dev/null || true
              EVENTS_FILE="$events" node <<'NODE'
            const fs = require('fs');
            const file = process.env.EVENTS_FILE;
            const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/).filter(Boolean);
            console.log(`eventCount=${lines.length}`);
            for (const line of lines.slice(-60)) {
              let v;
              try { v = JSON.parse(line); } catch { console.log(JSON.stringify({parseError:true})); continue; }
              const p = v && typeof v.params === 'object' && v.params ? v.params : {};
              const item = p && typeof p.item === 'object' && p.item ? p.item : {};
              const turn = p && typeof p.turn === 'object' && p.turn ? p.turn : {};
              const error = v && typeof v.error === 'object' && v.error ? v.error : {};
              const out = {
                method: typeof v.method === 'string' ? v.method : null,
                responseId: v.id ?? null,
                itemType: typeof item.type === 'string' ? item.type : null,
                itemStatus: typeof item.status === 'string' ? item.status : null,
                itemName: typeof item.name === 'string' ? item.name : null,
                turnId: typeof turn.id === 'string' ? turn.id : null,
                turnStatus: typeof turn.status === 'string' ? turn.status : null,
                hasAgentText: item.type === 'agentMessage' && typeof item.text === 'string',
                errorCode: error.code ?? null,
                errorMessage: typeof error.message === 'string' ? error.message.slice(0, 240) : null,
              };
              console.log(JSON.stringify(out));
            }
            NODE
              stderr="$(dirname "$events")/app-server.stderr.log"
              if [ -f "$stderr" ]; then
                echo "stderr=$stderr"
                stat -c 'stderr_size=%s modified=%y' "$stderr" 2>/dev/null || true
                tail -30 "$stderr" 2>/dev/null | sed -E 's/(ghp_|github_pat_|sk-|Bearer )[A-Za-z0-9_.=-]+/[REDACTED]/g' || true
              fi
            done

            echo '=== RUN SNAPSHOT ==='
            node <<'NODE'
            require('dotenv').config({ path: '.env' });
            const jwt = require('jsonwebtoken');
            const base = 'http://127.0.0.1:3000';
            const token = jwt.sign(
              { id: 'sunwoo162-live-e2e', login: 'sunwoo162', name: 'sunwoo162', avatar_url: '', type: 'access' },
              process.env.JWT_SECRET,
              { expiresIn: '5m' },
            );
            const headers = { Cookie: `playground_token=${token}` };
            async function get(path) {
              const r = await fetch(`${base}${path}`, { headers });
              const text = await r.text();
              if (!r.ok) throw new Error(`${path} -> ${r.status}: ${text.slice(0, 300)}`);
              return text ? JSON.parse(text) : null;
            }
            (async () => {
              const project = await get('/api/builder/projects/25');
              const run = await get('/api/builder/projects/25/runs/25');
              const snapshot = await get('/api/builder/projects/25/runs/25/snapshot');
              const payload = snapshot?.payloadJson ? JSON.parse(snapshot.payloadJson) : null;
              console.log(JSON.stringify({
                projectStatus: project?.status,
                runStatus: run?.status,
                heartbeatAt: run?.heartbeatAt,
                failureReason: run?.failureReason || project?.failureReason || null,
                phase: snapshot?.phase,
                version: snapshot?.version,
                repository: project?.repositoryFullName,
                tasks: (payload?.taskRuns || []).map(t => ({
                  taskId:t.taskId, role:t.role, status:t.status, attempts:t.attempts,
                  pr:t.pullRequestNumber, commit:t.commitSha, lastError:t.lastError,
                })),
              }, null, 2));
            })().catch(e => { console.error(e.stack || String(e)); process.exitCode = 1; });
            NODE
