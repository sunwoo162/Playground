name: Luna Live E2E Readonly Audit

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect production Bloom state and Agent streams
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 8m
          script: |
            set -eu
            cd /home/ubuntu/bloombouquet
            node <<'NODE'
            require('dotenv').config({ path: '.env' });
            const jwt = require('jsonwebtoken');
            const base='http://127.0.0.1:3000';
            const marker='[BLOOM-E2E-SMOKE]';
            const token=jwt.sign({id:'sunwoo162-live-e2e',login:'sunwoo162',name:'sunwoo162',avatar_url:'',type:'access'},process.env.JWT_SECRET,{expiresIn:'20m'});
            const headers={Cookie:`playground_token=${token}`};
            async function get(path){const r=await fetch(`${base}${path}`,{headers});const t=await r.text();if(!r.ok)throw new Error(`${path} -> ${r.status}: ${t.slice(0,500)}`);return t?JSON.parse(t):null;}
            async function main(){
              const projects=await get('/api/builder/projects');
              const project=[...projects].sort((a,b)=>b.id-a.id).find((p)=>String(p.brief||'').includes(marker));
              const runs=await get(`/api/builder/projects/${project.id}/runs`);
              const run=[...runs].sort((a,b)=>b.id-a.id)[0];
              const snapshot=await get(`/api/builder/projects/${project.id}/runs/${run.id}/snapshot`);
              const p=snapshot?JSON.parse(snapshot.payloadJson):null;
              console.log(`[state] project=${project.id} run=${run.id} projectStatus=${project.status} runStatus=${run.status} worker=${run.workerId||'-'} failure=${run.failureReason||'-'}`);
              console.log(`[state] repository=${project.repositoryFullName||'-'} preview=${project.previewUrl||'-'} phase=${snapshot?.phase||'-'} version=${snapshot?.version||'-'} blocked=${p?.blockedReason||'-'} runtime=${p?.runtimeProjectId||'-'} repoName=${p?.plan?.repositoryName||'-'}`);
              for(const r of p?.taskRuns||[]) console.log(`[task] ${r.taskId||r.id||'-'} role=${r.role} status=${r.status} attempts=${r.attempts??r.attempt??'-'} commit=${r.commitSha||'-'} pr=${r.pullRequestNumber||'-'} error=${String(r.error||'-').slice(0,300)}`);
            }
            main().catch((e)=>{console.error(`[state] FAILED ${e.stack||e}`);process.exit(1)});
            NODE

            python3 <<'PY'
            import glob, json, os
            root='/home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-26/agents'
            files=sorted(glob.glob(root+'/*/*/app-server-events.jsonl'))
            if not files:
                print('[streams] none')
            for path in files:
                events=deltas=delta_bytes=completed=turns=failed=0
                last='-'
                try:
                    f=open(path,'r',encoding='utf-8',errors='replace')
                except OSError:
                    continue
                with f:
                    for line in f:
                        events+=1
                        try:v=json.loads(line)
                        except Exception:continue
                        m=v.get('method') or '-';last=m
                        if m=='item/agentMessage/delta':
                            deltas+=1
                            d=((v.get('params') or {}).get('delta'))
                            if isinstance(d,str):delta_bytes+=len(d.encode())
                        elif m=='item/completed':
                            item=(v.get('params') or {}).get('item') or {}
                            if item.get('type')=='agentMessage':completed+=1
                        elif m=='turn/completed':turns+=1
                        elif m=='turn/failed':failed+=1
                rel=os.path.relpath(path,root)
                print(f'[stream] {rel} fileBytes={os.path.getsize(path)} events={events} deltas={deltas} deltaBytes={delta_bytes} remaining={max(0,524288-delta_bytes)} completedMessages={completed} turnCompleted={turns} turnFailed={failed} last={last}')
            PY
