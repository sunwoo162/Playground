name: Bloom Worker Provision Readonly Diagnostic

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: read

jobs:
  inspect-worker:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Install SSH client helper
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Collect read-only worker diagnostics
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set +e
          sshpass -e ssh \
            -p 24136 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            ubuntu@ssh.gsmsv.site 'bash -s' > bloom-worker-diag.txt 2>&1 <<'REMOTE'
          set +e
          cd /home/ubuntu/bloombouquet || { echo '[fatal] repository directory missing'; exit 2; }
          export PATH="$HOME/.local/bin:$HOME/.llama/bin:$HOME/.local/node_modules/.bin:$PATH"

          echo "[meta] host=$(hostname) user=$(id -un) utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "[git] head=$(git rev-parse HEAD 2>/dev/null || echo missing)"
          echo "[git] origin_main=$(git rev-parse origin/main 2>/dev/null || echo missing)"
          echo "[git] dirty_count=$(git status --porcelain 2>/dev/null | wc -l | tr -d ' ')"
          echo "[disk] $(df -h / | tail -1)"
          for cmd in node npm pnpm pm2 gh curl openssl; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "[command] $cmd=present path=$(command -v "$cmd")"
            else
              echo "[command] $cmd=MISSING"
            fi
          done

          if [ -x bloom-runtime/target/release/bloom-runtime-bridge ]; then
            echo "[bridge] executable=yes sha256=$(sha256sum bloom-runtime/target/release/bloom-runtime-bridge | awk '{print $1}')"
            BRIDGE_SMOKE_OUTPUT="$(printf '%s' '{}' | bloom-runtime/target/release/bloom-runtime-bridge 2>/dev/null || true)"
            if printf '%s' "$BRIDGE_SMOKE_OUTPUT" | grep -Fq '"ok":false'; then
              echo '[bridge] smoke=PASS'
            else
              echo '[bridge] smoke=FAIL'
            fi
          else
            echo '[bridge] executable=NO smoke=FAIL'
          fi

          if [ -f .tmp/bloom-worker/e2eSmoke.js ]; then
            node <<'NODE'
          try {
            const moduleValue = require('./.tmp/bloom-worker/e2eSmoke.js');
            console.log(`[bundle] e2eSmoke=present validator=${typeof moduleValue.validateLiveE2EImplementationPlan === 'function' ? 'PASS' : 'FAIL'}`);
          } catch (error) {
            console.log(`[bundle] e2eSmoke=LOAD_FAIL error=${String(error && error.message || error).slice(0, 240)}`);
          }
          NODE
          else
            echo '[bundle] e2eSmoke=MISSING validator=FAIL'
          fi
          if [ -f .tmp/bloom-worker/run.js ]; then
            if grep -Fq 'validateLiveE2EImplementationPlan' .tmp/bloom-worker/run.js; then
              echo '[bundle] worker_wiring=PASS'
            else
              echo '[bundle] worker_wiring=FAIL'
            fi
          else
            echo '[bundle] run=MISSING worker_wiring=FAIL'
          fi

          ENV_FILE=/home/ubuntu/bloombouquet/.env
          if [ -r "$ENV_FILE" ]; then
            echo '[env] readable=yes'
            for key in BUILDER_WORKER_TOKEN LUNA_DELIVERY_TOKEN BLOOM_WORKER_MODE BLOOM_EVALUATOR_RUNTIME BLOOM_LOCAL_EVALUATOR_URL; do
              if grep -Eq "^${key}=.+$" "$ENV_FILE"; then
                echo "[env] $key=present"
              else
                echo "[env] $key=MISSING"
              fi
            done
          else
            echo '[env] readable=NO'
          fi

          if curl -fsS --max-time 3 http://127.0.0.1:8091/health >/dev/null 2>&1; then
            echo '[evaluator] health=PASS'
          else
            echo '[evaluator] health=FAIL'
          fi

          if [ -f .tmp/bloom-worker/bloomBouquetLocalSeniorEvaluator.js ]; then
            node <<'NODE'
          const { createLocalEvaluatorTransport } = require('./.tmp/bloom-worker/bloomBouquetLocalSeniorEvaluator.js');
          async function main() {
            try {
              const transport = createLocalEvaluatorTransport({
                endpoint: 'http://127.0.0.1:8091/v1/chat/completions',
                model: 'qwen2.5-coder-1.5b-instruct',
                timeoutMs: 120000,
                maxTokens: 64,
                maxRetries: 0,
              });
              const value = await transport.run({
                title: 'readonly-production-inference-diagnostic',
                prompt: 'Return exactly one JSON object with {"ok":true}. Do not add any other fields.',
                outputSchema: {
                  type: 'object',
                  additionalProperties: false,
                  required: ['ok'],
                  properties: { ok: { type: 'boolean' } },
                },
              });
              console.log(`[evaluator] inference=${value && value.ok === true ? 'PASS' : 'FAIL_UNEXPECTED'}`);
            } catch (error) {
              console.log(`[evaluator] inference=FAIL error=${String(error && error.message || error).slice(0, 400)}`);
            }
          }
          main();
          NODE
          else
            echo '[evaluator] inference=SKIP bundle_missing'
          fi

          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          try {
            const raw = execFileSync('pm2', ['jlist'], { encoding: 'utf8' });
            const processes = JSON.parse(raw);
            for (const name of ['bloom-evaluator-llm', 'bloom-evaluator-worker', 'bloom-builder-worker', 'backend']) {
              const process = processes.find((item) => item.name === name);
              if (!process) {
                console.log(`[pm2] ${name}=MISSING`);
                continue;
              }
              const env = process.pm2_env || {};
              console.log(`[pm2] ${name} status=${env.status || '-'} pid=${process.pid || 0} restarts=${env.restart_time ?? '-'} cwd=${env.pm_cwd || '-'} script=${env.pm_exec_path || '-'}`);
            }
          } catch (error) {
            console.log(`[pm2] jlist=FAIL error=${String(error && error.message || error).slice(0, 300)}`);
          }
          NODE

          for name in bloom-evaluator-worker bloom-builder-worker bloom-evaluator-llm; do
            LOG="$HOME/.pm2/logs/${name}-error.log"
            if [ -f "$LOG" ]; then
              echo "[pm2-error] $name lines=$(wc -l < "$LOG" | tr -d ' ') bytes=$(wc -c < "$LOG" | tr -d ' ')"
              tail -n 20 "$LOG" \
                | sed -E 's/([Tt][Oo][Kk][Ee][Nn]|[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Ss][Ee][Cc][Rr][Ee][Tt]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn])[^ ]*/\1=<redacted>/g' \
                | sed "s/^/[pm2-error-line] $name /"
            else
              echo "[pm2-error] $name log=MISSING"
            fi
          done
          REMOTE
          status=$?
          echo "[ssh] exit=$status" >> bloom-worker-diag.txt
          cat bloom-worker-diag.txt
          exit 0

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: bloom-worker-provision-diagnostic
          path: bloom-worker-diag.txt
          if-no-files-found: error
          retention-days: 1
