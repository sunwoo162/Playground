name: Luna Live E2E Readonly Audit

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect latest production Bloom Live E2E
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 8m
          script: |
            set -eu
            cd /home/ubuntu/bloombouquet
            node <<'NODE'
            require('dotenv').config({ path: '.env' });
            const fs = require('node:fs');
            const jwt = require('jsonwebtoken');
            const { auditLiveE2ESnapshot } = require('./.tmp/bloom-worker/e2eSmoke.js');
            const base = 'http://127.0.0.1:3000';
            const marker = '[BLOOM-E2E-SMOKE]';
            const token = jwt.sign(
              { id: 'sunwoo162-live-e2e', login: 'sunwoo162', name: 'sunwoo162', avatar_url: '', type: 'access' },
              process.env.JWT_SECRET,
              { expiresIn: '20m' },
            );
            const headers = { Cookie: `playground_token=${token}` };
            async function get(path) {
              const response = await fetch(`${base}${path}`, { headers });
              const text = await response.text();
              if (!response.ok) throw new Error(`${path} -> ${response.status}: ${text.slice(0, 500)}`);
              return text ? JSON.parse(text) : null;
            }
            async function main() {
              const projects = await get('/api/builder/projects');
              const project = [...projects]
                .sort((a, b) => b.id - a.id)
                .find((item) => String(item.brief || '').includes(marker));
              if (!project) throw new Error('Bloom Live E2E project not found');
              const runs = await get(`/api/builder/projects/${project.id}/runs`);
              const run = [...runs].sort((a, b) => b.id - a.id)[0];
              if (!run) throw new Error(`Run not found for project ${project.id}`);
              const snapshot = await get(`/api/builder/projects/${project.id}/runs/${run.id}/snapshot`);
              const payload = snapshot ? JSON.parse(snapshot.payloadJson) : null;
              const runtimeProjectId = payload?.runtimeProjectId || `builder-${project.id}`;
              fs.writeFileSync('/tmp/bloom-live-e2e-runtime-id', runtimeProjectId);

              console.log(`[state] project=${project.id} run=${run.id} projectStatus=${project.status} runStatus=${run.status} worker=${run.workerId || '-'} failure=${run.failureReason || '-'}`);
              console.log(`[state] repository=${project.repositoryFullName || '-'} preview=${project.previewUrl || '-'} phase=${snapshot?.phase || '-'} version=${snapshot?.version || '-'} blocked=${payload?.blockedReason || '-'} runtime=${runtimeProjectId} repoName=${payload?.plan?.repositoryName || '-'}`);
              const planRoles = (payload?.plan?.tasks || []).map((task) => task.role);
              console.log(`[plan] roles=${planRoles.join(',')} frontend=${planRoles.includes('frontend')} backend=${planRoles.includes('backend')}`);

              const audit = auditLiveE2ESnapshot(snapshot, run.status);
              console.log(`[audit] passed=${audit.passed} completed=${audit.completedChecks}/${audit.totalChecks}`);
              for (const check of audit.checks) {
                console.log(`[audit-check] ${check.id} status=${check.status} detail=${check.detail}`);
              }

              for (const task of payload?.taskRuns || []) {
                console.log(`[task] ${task.taskId || task.id || '-'} role=${task.role} status=${task.status} attempts=${task.attempts ?? task.attempt ?? '-'} commit=${task.commitSha || '-'} pr=${task.pullRequestNumber || '-'} error=${String(task.error || task.lastError || '-').slice(0, 300)}`);
              }
            }
            main().catch((error) => {
              console.error(`[state] FAILED ${error.stack || error}`);
              process.exit(1);
            });
            NODE

            python3 <<'PY'
            import glob, json, os

            marker_path = '/tmp/bloom-live-e2e-runtime-id'
            runtime_id = open(marker_path, 'r', encoding='utf-8').read().strip()
            root = f'/home/ubuntu/bloom-workspaces/.luna-runtime/projects/{runtime_id}/agents'
            files = sorted(glob.glob(root + '/*/*/app-server-events.jsonl'))
            if not files:
                print(f'[streams] none runtime={runtime_id}')
            for path in files:
                events = deltas = delta_bytes = completed = turns = failed = 0
                last = '-'
                try:
                    handle = open(path, 'r', encoding='utf-8', errors='replace')
                except OSError:
                    continue
                with handle:
                    for line in handle:
                        events += 1
                        try:
                            value = json.loads(line)
                        except Exception:
                            continue
                        method = value.get('method') or '-'
                        last = method
                        if method == 'item/agentMessage/delta':
                            deltas += 1
                            delta = ((value.get('params') or {}).get('delta'))
                            if isinstance(delta, str):
                                delta_bytes += len(delta.encode())
                        elif method == 'item/completed':
                            item = (value.get('params') or {}).get('item') or {}
                            if item.get('type') == 'agentMessage':
                                completed += 1
                        elif method == 'turn/completed':
                            turns += 1
                        elif method == 'turn/failed':
                            failed += 1
                relative = os.path.relpath(path, root)
                print(
                    f'[stream] {relative} fileBytes={os.path.getsize(path)} events={events} '
                    f'deltas={deltas} deltaBytes={delta_bytes} remaining={max(0, 524288-delta_bytes)} '
                    f'completedMessages={completed} turnCompleted={turns} turnFailed={failed} last={last}'
                )
            PY
