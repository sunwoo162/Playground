name: Luna Output Guard Minimal-Diff Verification

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/luna-agent-output-guard
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore main source shape and reapply minimal guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- bloom-runtime/src/agent_runtime.rs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('bloom-runtime/src/agent_runtime.rs')
          text = path.read_text()

          const_anchor = 'const MAX_JSONL_LINE_BYTES: usize = 10 * 1024 * 1024;\n'
          assert text.count(const_anchor) == 1, text.count(const_anchor)
          text = text.replace(
              const_anchor,
              const_anchor + 'const MAX_AGENT_MESSAGE_DELTA_BYTES: usize = 512 * 1024;\n',
              1,
          )

          state_anchor = '''        let mut final_message: Option<String> = None;
                  let mut turn_status: Option<String> = None;
                  let mut turn_error: Option<String> = None;
          '''
          assert text.count(state_anchor) == 1, text.count(state_anchor)
          text = text.replace(
              state_anchor,
              state_anchor + '        let mut streamed_agent_message_bytes = 0usize;\n',
              1,
          )

          loop_anchor = '''            let value = read_json_line(&mut reader, &mut events_log)?;
                      let method = value.get("method").and_then(Value::as_str).unwrap_or_default();
          '''
          assert text.count(loop_anchor) == 1, text.count(loop_anchor)
          guard = '''            let value = read_json_line(&mut reader, &mut events_log)?;
                      let method = value.get("method").and_then(Value::as_str).unwrap_or_default();
                      if method == "item/agentMessage/delta" {
                          if let Some(delta) = value
                              .get("params")
                              .and_then(|params| params.get("delta"))
                              .and_then(Value::as_str)
                          {
                              streamed_agent_message_bytes = streamed_agent_message_bytes
                                  .checked_add(delta.len())
                                  .ok_or_else(|| "Codex Agent 메시지 누적 출력 안전 한도 계산이 overflow 되었습니다.".to_string())?;
                              if streamed_agent_message_bytes > MAX_AGENT_MESSAGE_DELTA_BYTES {
                                  return Err(format!(
                                      "Codex Agent 메시지 누적 출력 안전 한도를 초과했습니다. bytes={}, limit={}",
                                      streamed_agent_message_bytes,
                                      MAX_AGENT_MESSAGE_DELTA_BYTES
                                  ));
                              }
                          }
                      }
          '''
          text = text.replace(loop_anchor, guard, 1)
          path.write_text(text)
          PY
          git diff --check
          grep -F 'report.blockers.iter().all(is_runtime_owned_publication_blocker)' bloom-runtime/src/agent_runtime.rs

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Bloom runtime policy suite
        run: pnpm run test:bloom-runtime

      - name: Assert final PR diff is exactly runtime plus regression
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD || true
          mapfile -t committed < <(git diff --name-only origin/main...HEAD | sort)
          printf 'committed-before-repair=%s\n' "${committed[@]}"
          mapfile -t effective < <(git diff --name-only origin/main -- bloom-runtime/src/agent_runtime.rs bloom-runtime/tests/agent_output_guard.rs | sort)
          printf 'effective=%s\n' "${effective[@]}"
          test "${#effective[@]}" -eq 2
          test "${effective[0]}" = 'bloom-runtime/src/agent_runtime.rs'
          test "${effective[1]}" = 'bloom-runtime/tests/agent_output_guard.rs'

      - name: Build Bloom worker
        run: pnpm run build:bloom-worker

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Verify runaway-output regression
        run: cargo test --manifest-path bloom-runtime/Cargo.toml --test agent_output_guard rejects_agent_message_delta_stream_over_safe_limit -- --nocapture

      - name: Verify all Bloom runtime Rust tests
        run: cargo test --manifest-path bloom-runtime/Cargo.toml

      - name: Verify Bloom runtime Rust build
        run: cargo check --manifest-path bloom-runtime/Cargo.toml

      - name: Commit minimal source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bloom-runtime/src/agent_runtime.rs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix : preserve Luna runtime policy shape'
          git push origin HEAD:fix/luna-agent-output-guard
