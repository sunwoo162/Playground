name: Luna Output Guard TDD Runner

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/luna-agent-output-guard
          fetch-depth: 0

      - name: Add RED regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64,pathlib; p=pathlib.Path('bloom-runtime/src/agent_runtime.rs'); s=p.read_text(); m='rejects_agent_message_delta_stream_over_safe_limit'; a=base64.b64decode('').decode(); p.write_text(s if m in s else s+a)"
          git diff --check

      - name: Verify RED
        shell: bash
        run: |
          set +e
          cargo test --manifest-path bloom-runtime/Cargo.toml rejects_agent_message_delta_stream_over_safe_limit -- --nocapture 2>&1 | tee /tmp/luna-output-guard-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Regression unexpectedly passed before the guard implementation.' >&2
            exit 1
          fi
          grep -F 'runaway agent message delta stream must be rejected' /tmp/luna-output-guard-red.log
          echo "RED_CONFIRMED exit=$status"

      - name: Commit RED regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bloom-runtime/src/agent_runtime.rs
          if git diff --cached --quiet; then
            echo 'RED test already committed.'
            exit 0
          fi
          git commit -m 'test : reproduce runaway agent output'
          git push origin HEAD:fix/luna-agent-output-guard
