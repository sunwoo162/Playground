name: Luna Live E2E Readonly Audit

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect latest production Bloom Live E2E
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 8m
          script: |
            set -eu
            cd /home/ubuntu/bloombouquet
            node <<'NODE'
            require('dotenv').config({ path: '.env' });
            const jwt = require('jsonwebtoken');

            const base = 'http://127.0.0.1:3000';
            const marker = '[BLOOM-E2E-SMOKE]';
            const writerRoles = new Set([
              'design-system', 'designer', 'ux-research', 'frontend', 'backend',
              'database', 'security', 'devops', 'accessibility', 'performance',
              'api-integration', 'test-automation', 'data-marketing', 'documentation',
              'debug-router',
            ]);
            const implementationRoles = ['frontend', 'backend'];
            const governanceRoles = ['data-marketing', 'documentation', 'code-review', 'reviewer', 'qa'];

            const token = jwt.sign({
              id: 'sunwoo162-live-e2e',
              login: 'sunwoo162',
              name: 'sunwoo162',
              avatar_url: '',
              type: 'access',
            }, process.env.JWT_SECRET, { expiresIn: '20m' });
            const headers = { Cookie: `playground_token=${token}` };

            async function request(path) {
              const response = await fetch(`${base}${path}`, { headers });
              const text = await response.text();
              if (!response.ok) {
                throw new Error(`GET ${path} -> ${response.status}: ${text.slice(0, 500)}`);
              }
              return text ? JSON.parse(text) : null;
            }

            function roleRuns(payload, role) {
              return payload.taskRuns.filter((run) => run.role === role);
            }

            function allRolesDone(payload, roles) {
              return roles.every((role) => {
                const runs = roleRuns(payload, role);
                return runs.length > 0 && runs.every((run) => run.status === 'done');
              });
            }

            async function main() {
              const projects = await request('/api/builder/projects');
              const project = [...projects]
                .sort((a, b) => Number(b.id) - Number(a.id))
                .find((item) => typeof item.brief === 'string' && item.brief.includes(marker));
              if (!project) throw new Error('No Bloom Live E2E project found');

              const runs = await request(`/api/builder/projects/${project.id}/runs`);
              const run = [...runs].sort((a, b) => Number(b.id) - Number(a.id))[0];
              if (!run) throw new Error(`Project #${project.id} has no run`);

              const snapshot = await request(`/api/builder/projects/${project.id}/runs/${run.id}/snapshot`);
              console.log(`[audit] project=${project.id} run=${run.id} projectStatus=${project.status} runStatus=${run.status}`);
              console.log(`[audit] repository=${project.repositoryFullName || '-'} preview=${project.previewUrl || '-'}`);
              console.log(`[audit] worker=${run.workerId || '-'} failureReason=${run.failureReason || '-'}`);
              if (!snapshot) {
                console.log('[audit] snapshot=none');
                return;
              }

              const payload = JSON.parse(snapshot.payloadJson);
              const terminal = run.status === 'completed' || run.status === 'failed';
              const writers = payload.taskRuns.filter((item) => writerRoles.has(item.role));
              const writerPrNumbers = writers
                .map((item) => item.pullRequestNumber)
                .filter((value) => typeof value === 'number');
              const writerPrsVerified = writers.length > 0 && writers.every((item) =>
                item.status === 'done'
                && Boolean(item.commitSha)
                && typeof item.pullRequestNumber === 'number'
                && Boolean(item.pullRequestUrl));
              const reviewed = new Set(roleRuns(payload, 'code-review').flatMap((item) => item.reviewedPullRequests || []));
              const reviewCoverage = writerPrNumbers.length > 0 && writerPrNumbers.every((number) => reviewed.has(number));
              const integrationExpected = payload.integrationPullRequestNumbers || [];
              const mergedNumbers = new Set(payload.integration?.mergedPullRequests?.map((item) => item.number) || []);
              const integrationComplete = integrationExpected.length > 0
                && writerPrNumbers.every((number) => integrationExpected.includes(number))
                && integrationExpected.every((number) => mergedNumbers.has(number));

              const rawChecks = [
                ['Bloom orchestration snapshot', String(payload.request || '').includes(marker), 'snapshot marker'],
                ['Organization Intake', Boolean(payload.intake?.analysis && payload.intake?.sessionId), 'intake analysis + session'],
                ['PM plan', Boolean(payload.plan && payload.pm?.sessionId), 'plan + PM session'],
                ['Repository bootstrap', Boolean(payload.repository?.repository && payload.repository?.workspacePath), 'repository + workspace'],
                ['Frontend + Backend implementation', allRolesDone(payload, implementationRoles), 'frontend/backend done'],
                ['Writer commit / PR evidence', writerPrsVerified, `${writers.length} writer task(s)`],
                ['Governance chain', allRolesDone(payload, governanceRoles), 'data-marketing -> documentation -> code-review -> reviewer -> qa'],
                ['Code Review PR coverage', reviewCoverage, `${reviewed.size}/${writerPrNumbers.length} reviewed writer PR(s)`],
                ['Integration merge', integrationComplete, `${mergedNumbers.size}/${integrationExpected.length} integration PR(s) merged`],
                ['Run completion', run.status === 'completed' && snapshot.phase === 'completed' && !payload.blockedReason, `run=${run.status} phase=${snapshot.phase} blocked=${payload.blockedReason || '-'}`],
              ];

              console.log(`[audit] snapshotPhase=${snapshot.phase} version=${snapshot.version} blocked=${payload.blockedReason || '-'}`);
              console.log(`[audit] intakeSession=${payload.intake?.sessionId || '-'} pmSession=${payload.pm?.sessionId || '-'}`);
              console.log(`[audit] runtimeProjectId=${payload.runtimeProjectId || '-'} repositoryName=${payload.plan?.repositoryName || '-'}`);
              for (const item of payload.taskRuns) {
                console.log(`[task] ${item.taskId || item.id || '-'} role=${item.role} status=${item.status} attempts=${item.attempts ?? item.attempt ?? '-'} commit=${item.commitSha || '-'} pr=${item.pullRequestNumber || '-'} error=${String(item.error || '-').slice(0, 280)}`);
              }

              let passed = 0;
              rawChecks.forEach(([label, condition, detail], index) => {
                const status = condition ? 'PASS' : terminal ? 'FAIL' : 'PENDING';
                if (condition) passed += 1;
                console.log(`[milestone] ${index + 1}/10 ${status} ${label} :: ${detail}`);
              });
              console.log(`[audit] RESULT ${passed}/10${passed === 10 ? ' ALL PASS' : ''}`);
            }

            main().catch((error) => {
              console.error(`[audit] FAILED ${error instanceof Error ? error.stack || error.message : String(error)}`);
              process.exit(1);
            });
            NODE
