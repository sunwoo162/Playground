name: Luna Output Guard Integration Verification

on:
  push:
    branches:
      - test/luna-live-e2e-readonly-20260902

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/luna-agent-output-guard
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Bloom runtime bridge contract
        run: pnpm run test:bloom-runtime

      - name: Build Bloom worker
        run: pnpm run build:bloom-worker

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Verify runaway-output regression
        run: cargo test --manifest-path bloom-runtime/Cargo.toml --test agent_output_guard rejects_agent_message_delta_stream_over_safe_limit -- --nocapture

      - name: Verify all Bloom runtime Rust tests
        run: cargo test --manifest-path bloom-runtime/Cargo.toml

      - name: Verify Bloom runtime Rust build
        run: |
          cargo check --manifest-path bloom-runtime/Cargo.toml
          git diff --check
          git status --short
