name: Ops Bloom Runtime Diagnostics

on:
  push:
    branches:
      - ops/live-e2e-model-diagnostics

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require production SSH credential
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: test -n "$SSH_PASSWORD" || { echo "SSH_PASSWORD is required" >&2; exit 1; }

      - name: Inspect active Bloom builder state
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 8m
          script: |
            set -eu
            cd /home/ubuntu/bloombouquet
            API_BASE="http://127.0.0.1:3000"
            set -a
            . /home/ubuntu/bloombouquet/.env
            set +a
            TOKEN="$(node - <<'NODE'
            const jwt = require('jsonwebtoken');
            process.stdout.write(jwt.sign({
              id: 'bloom-live-e2e-actions',
              login: 'bloom-live-e2e',
              name: 'Bloom Live E2E',
              avatar_url: '',
              type: 'access',
            }, process.env.JWT_SECRET, { expiresIn: '10m' }));
            NODE
            )"
            export TOKEN
            trap 'unset TOKEN' EXIT

            PROJECTS_JSON="$(curl -fsS --max-time 20 -H "Authorization: Bearer ${TOKEN}" "$API_BASE/api/builder/projects")"
            PROJECT_ID="50"
            RUNS_JSON="$(curl -fsS --max-time 20 -H "Authorization: Bearer ${TOKEN}" "$API_BASE/api/builder/projects/${PROJECT_ID}/runs")"
            RUN_ID="$(printf '%s' "$RUNS_JSON" | node -e 'const a=JSON.parse(require("fs").readFileSync(0,"utf8")); a.sort((x,y)=>Number(y.id)-Number(x.id)); if(!a[0]?.id) process.exit(2); process.stdout.write(String(a[0].id));')"
            echo "latest_project=${PROJECT_ID} latest_run=${RUN_ID}"
            curl -fsS --max-time 20 -H "Authorization: Bearer ${TOKEN}" "$API_BASE/api/builder/projects/${PROJECT_ID}/runs/${RUN_ID}"
            echo

            SNAPSHOT_FILE="$(mktemp)"
            CODE="$(curl -sS --max-time 20 -o "$SNAPSHOT_FILE" -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" "$API_BASE/api/builder/projects/${PROJECT_ID}/runs/${RUN_ID}/snapshot" || true)"
            echo "snapshot_http=${CODE}"
            if [ "$CODE" = "200" ]; then
              node - "$SNAPSHOT_FILE" <<'NODE'
            const fs = require('fs');
            const envelope = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            const payload = JSON.parse(envelope.payloadJson);
            console.log(JSON.stringify({
              phase: envelope.phase,
              blockedReason: payload.blockedReason,
              repository: payload.plan?.repositoryName ?? null,
              intakeReady: Boolean(payload.intake),
              pmReady: Boolean(payload.pm),
              taskCount: payload.taskRuns?.length ?? 0,
              tasks: (payload.taskRuns ?? []).map(({ taskId, role, status, attempts, lastError }) => ({ taskId, role, status, attempts, lastError })),
            }, null, 2));
            NODE
            fi
            rm -f "$SNAPSHOT_FILE"
            echo "=== builder50 process descendants ==="
            python3 <<'PY'
            import os
            root=282008
            children={}
            for entry in os.listdir('/proc'):
                if not entry.isdigit(): continue
                try:
                    stat=open(f'/proc/{entry}/stat',encoding='utf-8',errors='replace').read().split()
                    ppid=int(stat[3]); children.setdefault(ppid,[]).append(int(entry))
                except Exception: pass
            stack=[root]; seen=set()
            while stack:
                pid=stack.pop(0)
                for child in sorted(children.get(pid,[])):
                    if child in seen: continue
                    seen.add(child); stack.append(child)
                    try: cmd=open(f'/proc/{child}/cmdline','rb').read().replace(b'\0',b' ').decode('utf-8','replace').strip()
                    except Exception: cmd='?'
                    try: cwd=os.readlink(f'/proc/{child}/cwd')
                    except Exception: cwd='?'
                    print(f'[desc] pid={child} ppid={pid} cwd={cwd} cmd={cmd[:700]}')
            PY
            echo "=== targeted builder50 agent files ==="
            find /home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-50 -maxdepth 7 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n' 2>/dev/null | sort | tail -80 || true
            echo "=== builder50 BLOOM-001 plan ==="
            node <<'NODE'
            const fs=require('fs');
            const plan=JSON.parse(fs.readFileSync('/home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-50/pm/pm-plan.json','utf8'));
            const task=(plan.tasks||[]).find((x)=>x.id==='BLOOM-001');
            console.log(JSON.stringify(task,null,2));
            NODE
            echo "=== builder50 frontend/src probe ==="
            WT=/home/ubuntu/bloom-workspaces/.luna-worktrees/builder-50/BLOOM-001
            if [ -e "$WT/frontend/src" ]; then
              stat -c '[src-stat] type=%F size=%s mtime=%y' "$WT/frontend/src" || true
              if [ -f "$WT/frontend/src" ]; then
                echo '[src-content]'
                sed -n '1,120p' "$WT/frontend/src"
              fi
            fi
            echo "=== builder50 BLOOM-001 worktree status ==="
            WT=/home/ubuntu/bloom-workspaces/.luna-worktrees/builder-50/BLOOM-001
            if [ -d "$WT" ]; then
              git -C "$WT" status --short || true
              echo "[diff-stat]"
              git -C "$WT" diff --stat || true
              echo "[recent-files]"
              find "$WT" -maxdepth 4 -type f -newermt '2026-09-03 03:37:00 UTC' -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n' 2>/dev/null | sort | tail -120 || true
            fi
            echo "=== builder50 runtime files ==="
            find /home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-50 -maxdepth 7 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n' 2>/dev/null | sort | tail -120 || true
            echo "=== builder50 tool-state summary ==="
            du -sh /tmp/luna-agent-tools/builder-50 2>/dev/null || true
            echo "=== builder50 local agent stderr ==="
            STDERR50=/home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-50/agents/rose:frontend/BLOOM-001/local-agent.stderr.log
            if [ -f "$STDERR50" ]; then cat "$STDERR50"; fi
            echo "=== builder50 local agent streams ==="
            python3 <<'PY'
            import glob, json, os
            root='/home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-50/agents'
            for path in sorted(glob.glob(root+'/*/*/local-agent-events.jsonl')):
                rows=[]
                with open(path,encoding='utf-8',errors='replace') as f:
                    for line in f:
                        try: rows.append(json.loads(line))
                        except Exception: pass
                print('[agent-stream]', os.path.relpath(path,root), 'bytes='+str(os.path.getsize(path)), 'events='+str(len(rows)), 'last='+json.dumps(rows[-12:],ensure_ascii=False))
            PY

            echo "=== builder process ==="
            BUILDER_PID="$(pm2 pid bloom-builder-worker || true)"
            echo "builder_pid=${BUILDER_PID}"
            if [ -n "$BUILDER_PID" ] && [ "$BUILDER_PID" != "0" ]; then
              ps -o pid,ppid,stat,etime,cmd -p "$BUILDER_PID" || true
              pgrep -a -P "$BUILDER_PID" || true
            fi
            echo "=== builder logs ==="
            pm2 logs bloom-builder-worker --lines 120 --nostream || true
            echo "=== local llama process ==="
            LLAMA_PID="$(pm2 pid bloom-evaluator-llm || true)"
            echo "llama_pid=${LLAMA_PID}"
            if [ -n "$LLAMA_PID" ] && [ "$LLAMA_PID" != "0" ]; then
              ps -o pid,ppid,stat,etime,pcpu,pmem,rss,vsz,cmd -p "$LLAMA_PID" || true
            fi
            curl -fsS --max-time 3 http://127.0.0.1:8091/health || true
            echo
            pm2 logs bloom-evaluator-llm --lines 160 --nostream || true
            echo "=== drain files ==="
            ls -l /tmp/bloom-builder-worker.drain /tmp/bloom-builder-worker.busy 2>/dev/null || true
