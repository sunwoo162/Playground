name: Ops Bloom Runtime Diagnostics

on:
  push:
    branches:
      - ops/live-e2e-model-diagnostics

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require production SSH credential
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: test -n "$SSH_PASSWORD" || { echo "SSH_PASSWORD is required" >&2; exit 1; }

      - name: Inspect active Bloom builder state
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 8m
          script: |
            set -eu
            cd /home/ubuntu/bloombouquet
            API_BASE="http://127.0.0.1:3000"
            set -a
            . /home/ubuntu/bloombouquet/.env
            set +a
            TOKEN="$(node - <<'NODE'
            const jwt = require('jsonwebtoken');
            process.stdout.write(jwt.sign({
              id: 'bloom-live-e2e-actions',
              login: 'bloom-live-e2e',
              name: 'Bloom Live E2E',
              avatar_url: '',
              type: 'access',
            }, process.env.JWT_SECRET, { expiresIn: '10m' }));
            NODE
            )"
            export TOKEN
            trap 'unset TOKEN' EXIT

            PROJECTS_JSON="$(curl -fsS --max-time 20 -H "Authorization: Bearer ${TOKEN}" "$API_BASE/api/builder/projects")"
            PROJECT_ID="$(printf '%s' "$PROJECTS_JSON" | node -e 'const a=JSON.parse(require("fs").readFileSync(0,"utf8")); a.sort((x,y)=>Number(y.id)-Number(x.id)); if(!a[0]?.id) process.exit(2); process.stdout.write(String(a[0].id));')"
            printf '%s' "$PROJECTS_JSON" | node -e 'const a=JSON.parse(require("fs").readFileSync(0,"utf8")); a.sort((x,y)=>Number(y.id)-Number(x.id)); const p=a[0]; if (p) console.log(JSON.stringify({id:p.id,brief:p.brief,templateId:p.templateId}));'
            RUNS_JSON="$(curl -fsS --max-time 20 -H "Authorization: Bearer ${TOKEN}" "$API_BASE/api/builder/projects/${PROJECT_ID}/runs")"
            RUN_ID="$(printf '%s' "$RUNS_JSON" | node -e 'const a=JSON.parse(require("fs").readFileSync(0,"utf8")); a.sort((x,y)=>Number(y.id)-Number(x.id)); if(!a[0]?.id) process.exit(2); process.stdout.write(String(a[0].id));')"
            echo "latest_project=${PROJECT_ID} latest_run=${RUN_ID}"
            curl -fsS --max-time 20 -H "Authorization: Bearer ${TOKEN}" "$API_BASE/api/builder/projects/${PROJECT_ID}/runs/${RUN_ID}"
            echo

            SNAPSHOT_FILE="$(mktemp)"
            CODE="$(curl -sS --max-time 20 -o "$SNAPSHOT_FILE" -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" "$API_BASE/api/builder/projects/${PROJECT_ID}/runs/${RUN_ID}/snapshot" || true)"
            echo "snapshot_http=${CODE}"
            if [ "$CODE" = "200" ]; then
              node - "$SNAPSHOT_FILE" <<'NODE'
            const fs = require('fs');
            const envelope = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            const payload = JSON.parse(envelope.payloadJson);
            console.log(JSON.stringify({
              phase: envelope.phase,
              blockedReason: payload.blockedReason,
              repository: payload.plan?.repositoryName ?? null,
              intakeReady: Boolean(payload.intake),
              pmReady: Boolean(payload.pm),
              taskCount: payload.taskRuns?.length ?? 0,
              tasks: (payload.taskRuns ?? []).map(({ taskId, role, status, attempts, lastError }) => ({ taskId, role, status, attempts, lastError })),
            }, null, 2));
            NODE
            fi
            rm -f "$SNAPSHOT_FILE"
            RUNTIME_ROOT="/home/ubuntu/bloom-workspaces/.luna-runtime/projects/builder-${PROJECT_ID}"
            PLAN_FILE="$RUNTIME_ROOT/pm/pm-plan.json"
            FRONTEND_TASK_ID=""
            if [ -f "$PLAN_FILE" ]; then
              node - "$PLAN_FILE" <<'NODE'
            const fs=require('fs');
            const plan=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
            const task=(plan.tasks||[]).find((x)=>x.role==='frontend');
            console.log('[plan-context] '+JSON.stringify({productSummary:plan.productSummary,architectureSummary:plan.architectureSummary,frontendTask:task}));
            NODE
              FRONTEND_TASK_ID="$(node - "$PLAN_FILE" <<'NODE'
            const fs=require('fs');
            const plan=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
            const task=(plan.tasks||[]).find((x)=>x.role==='frontend');
            if (task?.id) process.stdout.write(String(task.id));
            NODE
              )"
            fi
            echo "=== latest builder runtime project=${PROJECT_ID} frontendTask=${FRONTEND_TASK_ID:-none} ==="
            find "$RUNTIME_ROOT" -maxdepth 7 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n' 2>/dev/null | sort | tail -120 || true
            if [ -n "$FRONTEND_TASK_ID" ]; then
              WT="/home/ubuntu/bloom-workspaces/.luna-worktrees/builder-${PROJECT_ID}/${FRONTEND_TASK_ID}"
              echo "=== frontend worktree $WT ==="
              if [ -e "$WT/frontend/src" ]; then stat -c '[src-stat] type=%F size=%s mtime=%y' "$WT/frontend/src" || true; fi
              if [ -f "$WT/frontend/src" ]; then echo "[src-content]"; sed -n '1,160p' "$WT/frontend/src"; fi
              echo "[frontend-files]"
              find "$WT/frontend" -maxdepth 4 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n' 2>/dev/null | sort | tail -120 || true
              echo "[worktree-status]"
              git -C "$WT" status --short 2>/dev/null || true
              echo "[worktree-files]"
              find "$WT" -maxdepth 3 -type f -not -path '*/.git/*' -printf '%s %p\n' 2>/dev/null | sort | head -160 || true
              if [ -f "$WT/README.md" ]; then echo "[readme-content]"; sed -n '1,180p' "$WT/README.md"; fi
              STDERR="$RUNTIME_ROOT/agents/rose:frontend/${FRONTEND_TASK_ID}/local-agent.stderr.log"
              if [ -s "$STDERR" ]; then echo "[frontend-stderr]"; cat "$STDERR"; fi
              EVENTS="$RUNTIME_ROOT/agents/rose:frontend/${FRONTEND_TASK_ID}/local-agent-events.jsonl"
              if [ -s "$EVENTS" ]; then echo "[frontend-events]"; cat "$EVENTS"; fi
            fi
            echo "=== builder process ==="
            BUILDER_PID="$(pm2 pid bloom-builder-worker || true)"
            echo "builder_pid=${BUILDER_PID}"
            if [ -n "$BUILDER_PID" ] && [ "$BUILDER_PID" != "0" ]; then
              ps -o pid,ppid,stat,etime,cmd -p "$BUILDER_PID" || true
              pgrep -a -P "$BUILDER_PID" || true
              python3 - "$BUILDER_PID" <<'PY'
            import os, sys
            root=int(sys.argv[1]); children={}
            for entry in os.listdir('/proc'):
                if not entry.isdigit(): continue
                try:
                    stat=open(f'/proc/{entry}/stat',encoding='utf-8',errors='replace').read().split()
                    children.setdefault(int(stat[3]),[]).append(int(entry))
                except Exception: pass
            queue=[root]; seen=set()
            while queue:
                parent=queue.pop(0)
                for child in sorted(children.get(parent,[])):
                    if child in seen: continue
                    seen.add(child); queue.append(child)
                    try: cmd=open(f'/proc/{child}/cmdline','rb').read().replace(b'\0',b' ').decode('utf-8','replace').strip()
                    except Exception: cmd='?'
                    try: cwd=os.readlink(f'/proc/{child}/cwd')
                    except Exception: cwd='?'
                    print(f'[desc] pid={child} ppid={parent} cwd={cwd} cmd={cmd[:700]}')
            PY
            fi
            echo "=== builder logs ==="
            pm2 logs bloom-builder-worker --lines 120 --nostream || true
            echo "=== local llama process ==="
            LLAMA_PID="$(pm2 pid bloom-evaluator-llm || true)"
            echo "llama_pid=${LLAMA_PID}"
            if [ -n "$LLAMA_PID" ] && [ "$LLAMA_PID" != "0" ]; then
              ps -o pid,ppid,stat,etime,pcpu,pmem,rss,vsz,cmd -p "$LLAMA_PID" || true
            fi
            pm2 jlist 2>/dev/null | node -e '
              const fs = require("fs");
              const apps = JSON.parse(fs.readFileSync(0, "utf8") || "[]");
              const app = apps.find((entry) => entry?.name === "bloom-evaluator-llm");
              console.log("[llama-pm2] " + JSON.stringify({ maxMemoryRestart: app?.pm2_env?.max_memory_restart ?? null, status: app?.pm2_env?.status ?? null }));
            ' || true
            curl -fsS --max-time 3 http://127.0.0.1:8091/health || true
            echo
            pm2 logs bloom-evaluator-llm --lines 160 --nostream || true
            echo "=== pm2 daemon memory/restart log ==="
            tail -n 500 /home/ubuntu/.pm2/pm2.log 2>/dev/null | grep -Ei 'bloom-evaluator-llm|max memory|memory|stopping app|restart|exceeded' | tail -n 160 || true
            echo "=== host memory ==="
            free -h || true
            echo "=== deployed writer guard ==="
            echo "production_head=$(git rev-parse HEAD)"
            echo "[local-agent-require-mutation]"
            grep -n -F 'input.requireMutation === true' /home/ubuntu/bloombouquet/.tmp/bloom-worker/bloomLocalAgentRuntime.js | head -5 || true
            echo "[bridge-require-mutation]"
            grep -a -o -F 'requireMutation' /home/ubuntu/bloombouquet/bloom-runtime/target/release/bloom-runtime-bridge | head -5 || true
            ACTIVE_LEASE="$(printf 'X-Builder-Worker-Token: %s\n' "$BUILDER_WORKER_TOKEN" | curl -fsS --max-time 20 -H @- 'http://127.0.0.1:8080/internal/builder/worker/runs/active-lease?workerId=bloom-builder-production')"
            echo "active_lease=${ACTIVE_LEASE}"
            case "$ACTIVE_LEASE" in true|false) ;; *) echo "unexpected active lease response: $ACTIVE_LEASE" >&2; exit 1 ;; esac
            echo "=== drain files ==="
            ls -l /tmp/bloom-builder-worker.drain /tmp/bloom-builder-worker.busy 2>/dev/null || true
            if [ "$PROJECT_ID" = "55" ] && [ "$RUN_ID" = "55" ] && [ -n "$FRONTEND_TASK_ID" ]; then
              export API_BASE TOKEN PROJECT_ID RUN_ID RUNTIME_ROOT WT PLAN_FILE
              bash scripts/ops-reproduce-bloom-local-agent-first-write.sh
            fi
