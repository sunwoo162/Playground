name: Ops Bloom Runtime Diagnostics

on:
  push:
    branches:
      - ops/live-e2e-model-diagnostics

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require production SSH credential
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: test -n "$SSH_PASSWORD" || { echo "SSH_PASSWORD is required" >&2; exit 1; }

      - name: Inspect Bloom run 45 and local model
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 8m
          script: |
            set -eu
            cd /home/ubuntu/bloombouquet
            API_BASE="http://127.0.0.1:3000"
            PROJECT_ID=45
            RUN_ID=45
            set -a
            . /home/ubuntu/bloombouquet/.env
            set +a
            TOKEN="$(node - <<'NODE'
            const jwt = require('jsonwebtoken');
            process.stdout.write(jwt.sign({
              id: 'bloom-runtime-diagnostics',
              login: 'bloom-runtime-diagnostics',
              name: 'Bloom Runtime Diagnostics',
              avatar_url: '',
              type: 'access',
            }, process.env.JWT_SECRET, { expiresIn: '10m' }));
            NODE
            )"
            export TOKEN
            trap 'unset TOKEN' EXIT

            echo "=== run 45 ==="
            curl -fsS --max-time 20 -H "Authorization: Bearer ${TOKEN}" \
              "$API_BASE/api/builder/projects/${PROJECT_ID}/runs/${RUN_ID}" || true
            echo

            SNAPSHOT_FILE="$(mktemp)"
            CODE="$(curl -sS --max-time 20 -o "$SNAPSHOT_FILE" -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              "$API_BASE/api/builder/projects/${PROJECT_ID}/runs/${RUN_ID}/snapshot" || true)"
            echo "snapshot_http=${CODE}"
            if [ "$CODE" = "200" ]; then
              node - "$SNAPSHOT_FILE" <<'NODE'
            const fs = require('fs');
            const envelope = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            const payload = JSON.parse(envelope.payloadJson);
            console.log(JSON.stringify({
              phase: envelope.phase,
              blockedReason: payload.blockedReason,
              repository: payload.plan?.repositoryName ?? null,
              intakeReady: Boolean(payload.intake),
              pmReady: Boolean(payload.pm),
              taskCount: payload.taskRuns?.length ?? 0,
              tasks: (payload.taskRuns ?? []).map(({ taskId, role, status, attempts, lastError }) => ({ taskId, role, status, attempts, lastError })),
            }, null, 2));
            NODE
            fi
            rm -f "$SNAPSHOT_FILE"

            echo "=== local model health ==="
            curl -sS --max-time 5 -i http://127.0.0.1:8091/health || true
            echo "=== bloom-evaluator-llm status ==="
            pm2 status bloom-evaluator-llm || true
            echo "=== bloom-evaluator-llm logs ==="
            pm2 logs bloom-evaluator-llm --lines 200 --nostream || true
            echo "=== memory ==="
            free -m || true
            echo "=== swap ==="
            swapon --show || true
            echo "=== kernel OOM evidence ==="
            sudo dmesg --ctime 2>/dev/null | grep -Ei 'out of memory|oom|killed process' | tail -n 100 || true
