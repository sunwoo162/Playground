name: Harness

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deployed playground web
        run: pnpm run build:playground-web

      - name: Build Bloom web control plane
        run: pnpm run build:bloom-web

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Test builder backend protocol
        run: bash backend/gradlew -p backend test --no-daemon

      - name: Build Luna desktop pet
        run: pnpm --dir apps/desktop run build

      - name: Run Bloom agent runtime policy tests
        run: pnpm run test:bloom-runtime

      - name: Build Bloom headless worker
        run: pnpm run build:bloom-worker

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check Luna desktop shell
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Check Bloom runtime
        run: cargo check --manifest-path bloom-runtime/Cargo.toml

      - name: Run harness invariants
        run: pnpm run harness
