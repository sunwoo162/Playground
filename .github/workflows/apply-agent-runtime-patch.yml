name: Apply Agent Runtime Patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/agent-linked-worktree-gitdir'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-linked-worktree-gitdir
          fetch-depth: 0
      - name: Apply runtime-owned publishing patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('bloom-runtime/src/agent_runtime.rs')
          text = path.read_text()

          old_prompt = "Inspect the actual repository first, implement the task in this worktree, run applicable verification, make small logical English commits, push your branch, and open or update your own PR targeting `develop`. Do not merge the PR yourself and never push directly to `main` or `develop`."
          new_prompt = "Inspect the actual repository first, implement the task in this worktree, and run applicable verification. Git metadata is protected inside the Codex sandbox, so do not run Git write commands such as add, commit, checkout, switch, reset, rebase, merge, or push, do not create or update a PR, and do not create temporary Git metadata to work around the sandbox. Read-only Git inspection is allowed. Luna Runtime will publish your completed work after this turn. Never push directly to `main` or `develop`."
          if old_prompt not in text:
              raise SystemExit('writer prompt sentence anchor not found')
          text = text.replace(old_prompt, new_prompt, 1)

          anchor = 'fn verify_repository_writer_result(\n'
          if anchor not in text:
              raise SystemExit('verify function anchor not found')

          publish = r'''fn publish_repository_writer_result(
              input: &AgentTaskRuntimeInput,
              worktree: &Path,
              branch: &str,
              report: &mut AgentTaskReport,
          ) -> Result<(), String> {
              if report.status != "completed" {
                  return Ok(());
              }

              let current_branch = run_checked("git", &git_args(worktree, &["branch", "--show-current"]))?;
              let current_branch = String::from_utf8_lossy(&current_branch.stdout).trim().to_string();
              if current_branch != branch {
                  return Err(format!("Agent가 예상 브랜치를 벗어났습니다: {current_branch}"));
              }

              let status = run_checked("git", &git_args(worktree, &["status", "--porcelain"]))?;
              if !String::from_utf8_lossy(&status.stdout).trim().is_empty() {
                  run_checked("git", &git_args(worktree, &["add", "-A"]))?;
                  let commit_message = format!("task: {} {}", input.task_id, input.title);
                  run_checked(
                      "git",
                      &git_args(worktree, &["commit", "-m", commit_message.as_str()]),
                  )?;
              }

              run_checked("git", &git_args(worktree, &["push", "-u", "origin", branch]))?;

              let pr_output = run_checked(
                  "gh",
                  &[
                      "pr".to_string(),
                      "list".to_string(),
                      "--repo".to_string(),
                      input.repository_full_name.clone(),
                      "--head".to_string(),
                      branch.to_string(),
                      "--base".to_string(),
                      "develop".to_string(),
                      "--state".to_string(),
                      "open".to_string(),
                      "--limit".to_string(),
                      "1".to_string(),
                      "--json".to_string(),
                      "number".to_string(),
                  ],
              )?;
              let prs: Vec<Value> = serde_json::from_slice(&pr_output.stdout)
                  .map_err(|error| format!("Agent PR publish 확인 결과 파싱 실패: {error}"))?;
              if prs.is_empty() {
                  let pr_title = format!("{}: {}", input.task_id, input.title);
                  let pr_body = format!(
                      "Luna Agent `{}` completed `{}`.\n\n{}",
                      input.agent_id, input.task_id, report.summary
                  );
                  run_checked(
                      "gh",
                      &[
                          "pr".to_string(),
                          "create".to_string(),
                          "--repo".to_string(),
                          input.repository_full_name.clone(),
                          "--head".to_string(),
                          branch.to_string(),
                          "--base".to_string(),
                          "develop".to_string(),
                          "--title".to_string(),
                          pr_title,
                          "--body".to_string(),
                          pr_body,
                      ],
                  )?;
              }

              verify_repository_writer_result(input, worktree, branch, report)
          }

          '''
          text = text.replace(anchor, publish + anchor, 1)

          old_dispatch = 'verify_repository_writer_result(&input, &worktree, branch_name, &mut report)?;'
          new_dispatch = 'publish_repository_writer_result(&input, &worktree, branch_name, &mut report)?;'
          if old_dispatch not in text:
              raise SystemExit('dispatch call anchor not found')
          text = text.replace(old_dispatch, new_dispatch, 1)

          path.write_text(text)
          PY
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "Luna Runtime Patch"
          git config user.email "luna-runtime@users.noreply.github.com"
          git add bloom-runtime/src/agent_runtime.rs
          git commit -m "fix : publish agent git results outside sandbox"
          git push origin HEAD:fix/agent-linked-worktree-gitdir
