name: Apply Agent Runtime Patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/agent-linked-worktree-gitdir'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-linked-worktree-gitdir
          fetch-depth: 0
      - name: Extract and apply prepared patch
        shell: bash
        run: |
          python3 - <<'PY_EXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/patch-agent-runtime-publishing.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-agent-runtime-patch.py').write_text('\n'.join(lines) + '\n')
          PY_EXTRACT
          python3 /tmp/apply-agent-runtime-patch.py
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "Luna Runtime Patch"
          git config user.email "luna-runtime@users.noreply.github.com"
          git add bloom-runtime/src/agent_runtime.rs
          git commit -m "fix : publish agent git results outside sandbox"
          git push origin HEAD:fix/agent-linked-worktree-gitdir
