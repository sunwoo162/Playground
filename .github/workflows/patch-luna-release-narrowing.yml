name: Patch Luna release promotion narrowing

on:
  push:
    branches:
      - feat/luna-automatic-delivery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/luna-automatic-delivery
          fetch-depth: 0
      - name: Patch release narrowing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('bloom-runtime/ts/headlessBuilderExecutor.ts')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'(?P<i>\s*)if \(!payload\.release\) \{\n(?P=i)  if \(!options\.runtime\.promoteRelease\) \{\n(?P=i)    await failBlocked\("Release promotion Runtime이 연결되지 않았습니다\."\);\n(?P=i)  \}\n(?P=i)  payload\.release = await options\.runtime\.promoteRelease\(\{\n')
          replacement = r'\g<i>if (!payload.release) {\n\g<i>  const promoteRelease = options.runtime.promoteRelease;\n\g<i>  if (!promoteRelease) {\n\g<i>    await failBlocked("Release promotion Runtime이 연결되지 않았습니다.");\n\g<i>    throw new Error("Release promotion Runtime is unreachable after failBlocked.");\n\g<i>  }\n\g<i>  payload.release = await promoteRelease({\n'
          patched, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one release promotion block, found {count}')
          path.write_text(patched, encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/patch-luna-release-narrowing.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloom-runtime/ts/headlessBuilderExecutor.ts .github/workflows/patch-luna-release-narrowing.yml
          git diff --cached --check
          git commit -m "fix: narrow Luna release promotion runtime"
          git push origin HEAD:feat/luna-automatic-delivery
