name: Patch Luna release promotion narrowing

on:
  push:
    branches:
      - feat/luna-automatic-delivery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/luna-automatic-delivery
          fetch-depth: 0
      - name: Patch exact TypeScript narrowing site
        shell: python
        run: |
          from pathlib import Path
          path = Path('bloom-runtime/ts/headlessBuilderExecutor.ts')
          text = path.read_text(encoding='utf-8')
          old = '''    if (!payload.release) {
      if (!options.runtime.promoteRelease) {
        await failBlocked("Release promotion Runtime이 연결되지 않았습니다.");
      }
      payload.release = await options.runtime.promoteRelease({
'''
          new = '''    if (!payload.release) {
      const promoteRelease = options.runtime.promoteRelease;
      if (!promoteRelease) {
        await failBlocked("Release promotion Runtime이 연결되지 않았습니다.");
        throw new Error("Release promotion Runtime is unreachable after failBlocked.");
      }
      payload.release = await promoteRelease({
'''
          if old not in text:
              raise SystemExit('expected release promotion block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Remove one-shot patch workflow
        run: rm .github/workflows/patch-luna-release-narrowing.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloom-runtime/ts/headlessBuilderExecutor.ts .github/workflows/patch-luna-release-narrowing.yml
          git diff --cached --check
          git commit -m "fix: narrow Luna release promotion runtime"
          git push origin HEAD:feat/luna-automatic-delivery
