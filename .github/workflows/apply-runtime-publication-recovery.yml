name: Apply Runtime Publication Recovery

on:
  push:
    branches:
      - fix/runtime-owned-publication-blocker

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore : apply runtime publication recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-owned-publication-blocker
          fetch-depth: 0
      - name: Patch Runtime-owned publication recovery
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bloom-runtime/src/agent_runtime.rs')
          source = path.read_text()

          old_prompt = "Luna Runtime will publish your completed work after this turn. Never push directly to `main` or `develop`."
          new_prompt = "Luna Runtime will publish your completed work after this turn. Runtime-owned Git publication is not a task blocker: never return blocked solely because you cannot commit, push, or create a PR inside the sandbox. Never push directly to `main` or `develop`."
          if old_prompt not in source:
              raise SystemExit('writer prompt anchor missing')
          source = source.replace(old_prompt, new_prompt, 1)

          publish_anchor = "fn publish_repository_writer_result(\n"
          helper = r'''fn is_runtime_owned_publication_blocker(blocker: &String) -> bool {
              let normalized = blocker.to_ascii_lowercase();
              let names_publication = normalized.contains("commit")
                  && (normalized.contains(" pr") || normalized.contains("pull request"));
              let names_runtime_owner = normalized.contains("luna runtime")
                  && normalized.contains("publish");
              let names_sandbox_limit = normalized.contains("git write")
                  || normalized.contains("sandbox")
                  || normalized.contains("prohibit");
              names_publication && names_runtime_owner && names_sandbox_limit
          }

          fn recover_runtime_owned_publication_blocker(
              input: &AgentTaskRuntimeInput,
              worktree: &Path,
              report: &mut AgentTaskReport,
          ) -> Result<(), String> {
              if !is_repository_writer(&input.role)
                  || report.status != "blocked"
                  || report.blockers.is_empty()
              {
                  return Ok(());
              }

              if report.verification.iter().any(|verification| {
                  verification.status == "failed" || verification.status == "blocked"
              }) {
                  return Ok(());
              }
              if !report.blockers.iter().all(is_runtime_owned_publication_blocker) {
                  return Ok(());
              }

              let status = run_checked("git", &git_args(worktree, &["status", "--porcelain"]))?;
              if String::from_utf8_lossy(&status.stdout).trim().is_empty() {
                  return Ok(());
              }

              report.status = "completed".to_string();
              report.evidence.push(
                  "Luna Runtime recovered a publication-only blocker after confirming repository changes remain in the writer worktree; Runtime owns commit and PR publication."
                      .to_string(),
              );
              report.blockers.clear();
              Ok(())
          }

          '''
          if publish_anchor not in source:
              raise SystemExit('publish helper anchor missing')
          source = source.replace(publish_anchor, helper + publish_anchor, 1)

          old_dispatch = '''    if let Some(branch_name) = branch.as_deref() {
              publish_repository_writer_result(&input, &worktree, branch_name, &mut report)?;
          }
          '''
          new_dispatch = '''    if branch.is_some() {
              recover_runtime_owned_publication_blocker(&input, &worktree, &mut report)?;
          }
          if let Some(branch_name) = branch.as_deref() {
              publish_repository_writer_result(&input, &worktree, branch_name, &mut report)?;
          }
          '''
          if old_dispatch not in source:
              raise SystemExit('dispatch anchor missing')
          source = source.replace(old_dispatch, new_dispatch, 1)

          path.write_text(source)
          PY
      - name: Remove one-shot workflow and publish patch
        run: |
          rm .github/workflows/apply-runtime-publication-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloom-runtime/src/agent_runtime.rs .github/workflows/apply-runtime-publication-recovery.yml
          git commit -m "fix : recover runtime-owned publication blockers"
          git push origin HEAD:fix/runtime-owned-publication-blocker
