name: Patch headless promote release fixture

on:
  push:
    branches:
      - feat/luna-automatic-delivery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/luna-automatic-delivery
          fetch-depth: 0
      - name: Patch promoteRelease fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('bloom-runtime/ts/headlessBuilderExecutor.policy-test.ts')
          text = path.read_text(encoding='utf-8')
          if 'async promoteRelease(input)' in text:
              raise SystemExit('promoteRelease fixture already exists')
          start = text.index('    async mergePullRequests(input) {')
          end = text.index('    },\n  };', start) + len('    },\n')
          insert = '    async promoteRelease(input) {\n      events.push("promote-release");\n      return {\n        repositoryFullName: input.repositoryFullName,\n        releaseSha: "0123456789abcdef0123456789abcdef01234567",\n        releasePullRequestNumber: 202,\n      };\n    },\n'
          path.write_text(text[:end] + insert + text[end:], encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        shell: bash
        run: rm .github/workflows/patch-headless-promote-release-fixture.yml
      - name: Commit fixture patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloom-runtime/ts/headlessBuilderExecutor.policy-test.ts .github/workflows/patch-headless-promote-release-fixture.yml
          git diff --cached --check
          git commit -m "test: add release promotion runtime fixture"
          git push origin HEAD:feat/luna-automatic-delivery
