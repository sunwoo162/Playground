name: Deploy Bloom Worker

on:
  workflow_run:
    workflows: ["Deploy to Server"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: bloom-worker-production
  cancel-in-progress: true

jobs:
  provision-worker:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Bloom worker
        run: pnpm run build:bloom-worker

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build headless runtime binary
        run: pnpm run build:bloom-runtime-bridge

      - name: Transfer headless runtime binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          source: "bloom-runtime/target/release/bloom-runtime-bridge"
          target: "/home/ubuntu/bloombouquet/bloom-runtime/target/release/"
          strip_components: 3

      - name: Provision and start Bloom workers
        uses: appleboy/ssh-action@v1.0.3
        env:
          BLOOM_GITHUB_TOKEN: ${{ secrets.BLOOM_GITHUB_TOKEN }}
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          envs: BLOOM_GITHUB_TOKEN
          command_timeout: 20m
          script: |
            set -eu
            cd /home/ubuntu/bloombouquet
            export PATH="$HOME/.local/bin:$HOME/.llama/bin:$HOME/.local/node_modules/.bin:$PATH"

            git fetch origin main
            git reset --hard origin/main

            command -v pnpm >/dev/null 2>&1 || npm install --prefix "$HOME/.local" pnpm@10.33.0
            command -v gh >/dev/null 2>&1 || { echo "GitHub CLI is required for Bloom builder mode"; exit 1; }
            test -n "${BLOOM_GITHUB_TOKEN:-}" || { echo "BLOOM_GITHUB_TOKEN is required for Bloom builder mode"; exit 1; }
            printf '%s\n' "$BLOOM_GITHUB_TOKEN" | gh auth login --hostname github.com --with-token
            unset BLOOM_GITHUB_TOKEN
            gh auth setup-git
            gh api user >/dev/null 2>&1 || { echo "GitHub CLI authentication is required for Bloom builder mode"; exit 1; }
            pnpm install --frozen-lockfile
            pnpm run build:bloom-worker
            chmod 755 bloom-runtime/target/release/bloom-runtime-bridge
            test -x bloom-runtime/target/release/bloom-runtime-bridge || { echo "Bloom runtime bridge is missing"; exit 1; }

            ENV_FILE=/home/ubuntu/bloombouquet/.env
            touch "$ENV_FILE"
            chmod 600 "$ENV_FILE"

            TOKEN_CREATED=false
            if ! grep -Eq '^BUILDER_WORKER_TOKEN=.+$' "$ENV_FILE"; then
              WORKER_TOKEN="$(openssl rand -hex 32)"
              printf '\nBUILDER_WORKER_TOKEN=%s\n' "$WORKER_TOKEN" >> "$ENV_FILE"
              TOKEN_CREATED=true
              echo "Generated a server-local BUILDER_WORKER_TOKEN"
            fi

            append_default_env() {
              KEY="$1"
              VALUE="$2"
              if ! grep -Eq "^${KEY}=.+$" "$ENV_FILE"; then
                printf '%s=%s\n' "$KEY" "$VALUE" >> "$ENV_FILE"
              fi
            }

            set_env_value() {
              KEY="$1"
              VALUE="$2"
              if grep -q "^${KEY}=" "$ENV_FILE"; then
                sed -i "s|^${KEY}=.*$|${KEY}=${VALUE}|" "$ENV_FILE"
              else
                printf '%s=%s\n' "$KEY" "$VALUE" >> "$ENV_FILE"
              fi
            }

            set_env_value BLOOM_WORKER_MODE evaluator
            set_env_value BLOOM_EVALUATOR_RUNTIME local
            set_env_value BLOOM_LOCAL_EVALUATOR_URL http://127.0.0.1:8091/v1/chat/completions
            append_default_env BLOOM_LOCAL_EVALUATOR_MODEL qwen2.5-coder-1.5b-instruct
            append_default_env BLOOM_API_BASE_URL http://localhost:8080
            append_default_env BLOOM_WORKER_ID bloom-evaluator-production
            append_default_env BLOOM_EVALUATOR_WORKER_ID bloom-evaluator-production
            append_default_env BLOOM_BUILDER_WORKER_ID bloom-builder-production
            append_default_env BLOOM_GITHUB_ORGANIZATION sunwoo162
            append_default_env BLOOM_WORKSPACE_ROOT /home/ubuntu/bloom-workspaces
            append_default_env BLOOM_TEAM_ID rose
            append_default_env BLOOM_TEAM_NAME Rose
            append_default_env BLOOM_WORKER_POLL_INTERVAL_MS 5000
            append_default_env BLOOM_WORKER_HEARTBEAT_INTERVAL_MS 30000

            grep -Eq '^BUILDER_WORKER_TOKEN=.+$' "$ENV_FILE" || { echo "BUILDER_WORKER_TOKEN is missing"; exit 1; }
            grep -Eq '^BLOOM_WORKER_MODE=evaluator$' "$ENV_FILE" || { echo "BLOOM_WORKER_MODE must be evaluator"; exit 1; }
            grep -Eq '^BLOOM_EVALUATOR_RUNTIME=local$' "$ENV_FILE" || { echo "BLOOM_EVALUATOR_RUNTIME must be local"; exit 1; }

            if [ "$TOKEN_CREATED" = "true" ]; then
              pm2 reload ecosystem.config.js --only backend --update-env
            fi

            bash scripts/setup-bloom-evaluator-local-llm.sh
            curl -fsS --max-time 3 http://127.0.0.1:8091/health >/dev/null || {
              echo "Bloom local evaluator model health check failed"
              pm2 status bloom-evaluator-llm || true
              exit 1
            }

            node <<'NODE'
            const { createLocalEvaluatorTransport } = require('./.tmp/bloom-worker/bloomBouquetLocalSeniorEvaluator.js');

            async function main() {
              const transport = createLocalEvaluatorTransport({
                endpoint: 'http://127.0.0.1:8091/v1/chat/completions',
                model: 'qwen2.5-coder-1.5b-instruct',
                timeoutMs: 120000,
                maxTokens: 64,
                maxRetries: 2,
              });
              const value = await transport.run({
                title: 'production-inference-smoke',
                prompt: 'Return exactly one JSON object with {"ok":true}. Do not add any other fields.',
                outputSchema: {
                  type: 'object',
                  additionalProperties: false,
                  required: ['ok'],
                  properties: { ok: { type: 'boolean' } },
                },
              });
              if (!value || value.ok !== true) {
                throw new Error('Bloom local evaluator inference smoke returned an unexpected JSON object.');
              }
              console.log('Bloom local evaluator inference smoke OK');
            }

            main().catch((error) => {
              console.error(`Bloom local evaluator inference smoke failed: ${error instanceof Error ? error.message : String(error)}`);
              process.exit(1);
            });
            NODE

            pm2 delete bloom-worker 2>/dev/null || true
            pm2 delete bloom-evaluator-worker 2>/dev/null || true
            pm2 delete bloom-builder-worker 2>/dev/null || true
            rm -f "$HOME/.pm2/logs/bloom-evaluator-worker-out.log" "$HOME/.pm2/logs/bloom-evaluator-worker-error.log"
            rm -f "$HOME/.pm2/logs/bloom-builder-worker-out.log" "$HOME/.pm2/logs/bloom-builder-worker-error.log"
            pm2 start ecosystem.config.js --only bloom-evaluator-worker --update-env
            pm2 start ecosystem.config.js --only bloom-builder-worker --update-env
            sleep 3

            EVALUATOR_PID="$(pm2 pid bloom-evaluator-worker)"
            BUILDER_PID="$(pm2 pid bloom-builder-worker)"
            test -n "$EVALUATOR_PID" && [ "$EVALUATOR_PID" != "0" ] || { echo "Bloom evaluator worker did not stay online"; exit 1; }
            test -n "$BUILDER_PID" && [ "$BUILDER_PID" != "0" ] || { echo "Bloom builder worker did not stay online"; exit 1; }

            if ! pm2 logs bloom-evaluator-worker --lines 30 --nostream 2>/dev/null | grep -Fq 'started mode=evaluator runtime=local workerId='; then
              echo "Bloom evaluator worker did not report mode=evaluator runtime=local"
              pm2 status bloom-evaluator-worker || true
              exit 1
            fi
            if ! pm2 logs bloom-builder-worker --lines 30 --nostream 2>/dev/null | grep -Fq 'started mode=builder workerId='; then
              echo "Bloom builder worker did not report mode=builder"
              pm2 status bloom-builder-worker || true
              exit 1
            fi

            pm2 save
            echo "Bloom evaluator worker online runtime=local with PID $EVALUATOR_PID"
            echo "Bloom builder worker online with PID $BUILDER_PID"