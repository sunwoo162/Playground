name: Deploy Bloom Worker

on:
  workflow_run:
    workflows: ["Deploy to Server"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: bloom-worker-production
  cancel-in-progress: true

jobs:
  provision-worker:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Bloom worker
        run: pnpm run build:bloom-worker

      - name: Provision and start Bloom evaluator worker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.gsmsv.site
          port: 24136
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 15m
          script: |
            set -eu
            cd /home/ubuntu/playground
            export PATH="$HOME/.local/node_modules/.bin:$PATH"

            git fetch origin main
            git reset --hard origin/main

            command -v pnpm >/dev/null 2>&1 || npm install --prefix "$HOME/.local" pnpm@10.33.0
            pnpm install --frozen-lockfile
            pnpm run build:bloom-worker

            ENV_FILE=/home/ubuntu/playground/.env
            touch "$ENV_FILE"

            TOKEN_CREATED=false
            if ! grep -Eq '^BUILDER_WORKER_TOKEN=.+$' "$ENV_FILE"; then
              WORKER_TOKEN="$(openssl rand -hex 32)"
              printf '\nBUILDER_WORKER_TOKEN=%s\n' "$WORKER_TOKEN" >> "$ENV_FILE"
              TOKEN_CREATED=true
              echo "Generated a server-local BUILDER_WORKER_TOKEN"
            fi

            append_default_env() {
              KEY="$1"
              VALUE="$2"
              if ! grep -Eq "^${KEY}=.+$" "$ENV_FILE"; then
                printf '%s=%s\n' "$KEY" "$VALUE" >> "$ENV_FILE"
              fi
            }

            set_env_value() {
              KEY="$1"
              VALUE="$2"
              if grep -q "^${KEY}=" "$ENV_FILE"; then
                sed -i "s|^${KEY}=.*$|${KEY}=${VALUE}|" "$ENV_FILE"
              else
                printf '%s=%s\n' "$KEY" "$VALUE" >> "$ENV_FILE"
              fi
            }

            set_env_value BLOOM_WORKER_MODE evaluator
            append_default_env BLOOM_API_BASE_URL http://localhost:8080
            append_default_env BLOOM_WORKER_ID bloom-evaluator-production
            append_default_env BLOOM_WORKER_POLL_INTERVAL_MS 5000
            append_default_env BLOOM_WORKER_HEARTBEAT_INTERVAL_MS 30000

            grep -Eq '^BUILDER_WORKER_TOKEN=.+$' "$ENV_FILE" || { echo "BUILDER_WORKER_TOKEN is missing"; exit 1; }
            grep -Eq '^BLOOM_WORKER_MODE=evaluator$' "$ENV_FILE" || { echo "BLOOM_WORKER_MODE must be evaluator"; exit 1; }

            if ! command -v codex >/dev/null 2>&1; then
              npm install --prefix "$HOME/.local" @openai/codex@latest
            fi

            if [ "$TOKEN_CREATED" = "true" ]; then
              pm2 reload ecosystem.config.js --only backend --update-env
            fi

            if codex --version >/tmp/bloom-codex-version.log 2>&1; then
              echo "Bloom preflight: Codex CLI installed ($(cat /tmp/bloom-codex-version.log))"
            else
              echo "Bloom preflight: Codex CLI unavailable"
              pm2 delete bloom-worker 2>/dev/null || true
              pm2 save
              exit 2
            fi

            if codex login status >/tmp/bloom-codex-auth.log 2>&1; then
              echo "Bloom preflight: Codex ChatGPT authentication OK"
            else
              echo "Bloom preflight: Codex ChatGPT authentication MISSING"
              pm2 delete bloom-worker 2>/dev/null || true
              pm2 save
              exit 2
            fi

            pm2 delete bloom-worker 2>/dev/null || true
            rm -f "$HOME/.pm2/logs/bloom-worker-out.log" "$HOME/.pm2/logs/bloom-worker-error.log"
            pm2 start ecosystem.config.js --only bloom-worker --update-env
            sleep 3

            WORKER_PID="$(pm2 pid bloom-worker)"
            test -n "$WORKER_PID" && [ "$WORKER_PID" != "0" ] || { echo "Bloom evaluator worker did not stay online"; exit 1; }

            if ! pm2 logs bloom-worker --lines 30 --nostream 2>/dev/null | grep -Fq 'started mode=evaluator workerId='; then
              echo "Bloom evaluator worker did not report evaluator mode"
              pm2 status bloom-worker || true
              exit 1
            fi

            pm2 save
            echo "Bloom evaluator worker online with PID $WORKER_PID"
