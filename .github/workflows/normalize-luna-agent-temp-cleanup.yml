name: Normalize Luna Agent Temp Cleanup

on:
  push:
    branches:
      - fix/luna-agent-temp-cleanup
    paths:
      - .github/workflows/normalize-luna-agent-temp-cleanup.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/luna-agent-temp-cleanup
          fetch-depth: 0
      - name: Restore base formatting and apply minimal patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- bloom-runtime/src/agent_runtime.rs
          python3 <<'PY'
          from pathlib import Path

          path = Path('bloom-runtime/src/agent_runtime.rs')
          source = path.read_text()

          marker = 'fn git_args(workspace: &Path, tail: &[&str]) -> Vec<String> {'
          guard = '''struct AgentToolStateGuard {\n    root: PathBuf,\n}\n\nimpl AgentToolStateGuard {\n    fn prepare(root: PathBuf) -> Result<Self, String> {\n        if root.exists() {\n            fs::remove_dir_all(&root)\n                .map_err(|error| format!("stale Agent tool state 정리 실패: {error}"))?;\n        }\n        fs::create_dir_all(&root)\n            .map_err(|error| format!("Agent tool state root 생성 실패: {error}"))?;\n        Ok(Self { root })\n    }\n}\n\nimpl Drop for AgentToolStateGuard {\n    fn drop(&mut self) {\n        let _ = fs::remove_dir_all(&self.root);\n    }\n}\n\n'''
          if source.count(marker) != 1:
              raise SystemExit('git_args insertion marker mismatch')
          source = source.replace(marker, guard + marker, 1)

          tool_marker = '    let pnpm_home = tool_state_root.join("pnpm-home");'
          if source.count(tool_marker) != 1:
              raise SystemExit('pnpm_home insertion marker mismatch')
          source = source.replace(
              tool_marker,
              '    let _tool_state_guard = AgentToolStateGuard::prepare(tool_state_root.clone())?;\n' + tool_marker,
              1,
          )
          path.write_text(source)
          PY
          git diff --check
          git diff --stat origin/main -- bloom-runtime/src/agent_runtime.rs
          git diff origin/main -- bloom-runtime/src/agent_runtime.rs
      - name: Commit minimal implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bloom-runtime/src/agent_runtime.rs
          git commit -m 'fix : minimize Luna agent temp cleanup diff'
          git push origin HEAD:fix/luna-agent-temp-cleanup
