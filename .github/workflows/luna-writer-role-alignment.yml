name: Luna writer role alignment

on:
  push:
    branches:
      - fix/luna-interrupted-task-retry-v2

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'bootstrap-writer-role-alignment'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/luna-interrupted-task-retry-v2
          fetch-depth: 0
      - name: Align repository writer roles
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bloom-runtime/src/agent_reconciliation.rs')
          text = path.read_text()
          old = '''const WRITER_ROLES: &[&str] = &[
              "design-system",
              "designer",
              "frontend",
              "backend",
              "data-marketing",
              "documentation",
              "debug-router",
          ];'''
          new = '''const WRITER_ROLES: &[&str] = &[
              "design-system",
              "designer",
              "ux-research",
              "frontend",
              "backend",
              "database",
              "security",
              "devops",
              "accessibility",
              "performance",
              "api-integration",
              "test-automation",
              "data-marketing",
              "documentation",
              "debug-router",
          ];'''
          if text.count(old) != 1:
              raise SystemExit('expected writer-role block exactly once')
          path.write_text(text.replace(old, new))
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify writer retry safety policy
        run: |
          pnpm --dir apps/desktop exec tsc -p ../../bloom-runtime/tsconfig.policy-tests.json
          node .tmp/bloom-policy-tests/agentRuntimeOwnedPublishing.policy-test.js
      - name: Publish minimal fix
        run: |
          git diff --check
          git diff --stat
          git config user.name 'Luna Bloom'
          git config user.email 'luna-bloom@users.noreply.github.com'
          git add bloom-runtime/src/agent_reconciliation.rs
          git commit -m 'fix : align Luna retry writer roles'
          git push origin HEAD:fix/luna-interrupted-task-retry-v2
