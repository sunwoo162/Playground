<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사이트 액션 매크로 설정</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Site Action Macro</p>
          <h1>사이트별 예약 작업</h1>
          <p>URL 패턴, 실행 시간, 액션 순서를 지정하면 해당 사이트에서만 실행됩니다.</p>
        </div>
        <div class="header-actions">
          <label class="theme-control">테마
            <select id="themeSelect">
              <option value="light">화이트</option>
              <option value="dark">다크</option>
            </select>
          </label>
          <button id="addJob" type="button" class="primary">작업 추가</button>
        </div>
      </header>

      <section class="guardrail">
        <strong>안전 제한</strong>
        <span>최소 간격 5초, 작업당 액션 최대 20개, 비밀번호/로그인 폼 자동 입력 차단, 사이트 권한 허용 필요.</span>
      </section>

      <section id="jobEditorList" class="job-editor-list"></section>
    </main>

    <template id="jobTemplate">
      <article class="job-card">
        <div class="card-head">
          <input data-field="name" placeholder="작업 이름" />
          <label><input data-field="enabled" type="checkbox" /> 사용</label>
        </div>

        <div class="app-target">
          <label>대상 종류
            <select data-field="targetKind">
              <option value="web">웹/놀이터 앱</option>
              <option value="native">Windows 앱</option>
            </select>
          </label>
          <label>놀이터 주소 <input data-field="appBaseUrl" placeholder="https://playground.https.gsmsv.site" /></label>
          <label>대상 앱
            <select data-field="targetApp">
              <option value="">직접 URL 입력</option>
              <option value="/apps/study-planner/">스터디 플래너</option>
              <option value="/apps/focus-room/">몰입형 가상 면학석</option>
              <option value="/apps/todo/">Todo</option>
              <option value="/apps/day-schedule/">하루 시간표</option>
              <option value="/apps/dev-notes/">개발자 노트</option>
              <option value="/apps/dev-action-hub/">개발 액션 허브</option>
              <option value="/apps/cornell-notes/">코넬 노트</option>
              <option value="/apps/coding-log/">코테 일지</option>
              <option value="/apps/school-meal/">학교 알리미</option>
              <option value="/apps/mock-invest/">모의 투자</option>
              <option value="/apps/action-notifier/">Action 알리미</option>
              <option value="/apps/code-run-visualizer/">코드 실행 시각화</option>
              <option value="/apps/voice-phishing/">보이스피싱 체험</option>
              <option value="/apps/site-macro-extension/">사이트 액션 매크로</option>
              <option value="/apps/webbridge/">WebBridge</option>
              <option value="/apps/focustime-extension/">FocusTime</option>
            </select>
          </label>
          <label>직접 앱 경로 <input data-field="customAppPath" placeholder="/apps/todo/" /></label>
          <label>Windows 프로세스명 <input data-field="nativeProcess" placeholder="예: notepad" /></label>
          <label>Windows 창 제목 <input data-field="nativeWindowTitle" placeholder="예: 메모장" /></label>
        </div>

        <div class="grid">
          <label>대상 구역
            <select data-field="targetArea">
              <option value="">전체 화면</option>
              <option value="main">메인 영역</option>
              <option value="form">폼/입력 영역</option>
              <option value="header">상단 영역</option>
              <option value="nav">내비게이션</option>
              <option value="custom">직접 CSS 선택자</option>
            </select>
          </label>
          <label>구역 CSS 선택자 <input data-field="areaSelector" placeholder="예: main, form, .editor" /></label>
          <label>URL 패턴 <input data-field="urlPattern" placeholder="https://example.com/page*" /></label>
          <label>없으면 열 URL <input data-field="startUrl" placeholder="https://example.com/page" /></label>
          <label class="check"><input data-field="openIfMissing" type="checkbox" /> 탭이 없으면 새 탭으로 열기</label>
          <label class="check"><input data-field="backgroundTab" type="checkbox" /> 전용 백그라운드 탭에서 계속 실행</label>
        </div>

        <div class="grid schedule">
          <label>실행 방식
            <select data-field="scheduleType">
              <option value="interval">몇 초 간격</option>
              <option value="time">특정 시간</option>
            </select>
          </label>
          <label>간격(초) <input data-field="intervalSeconds" type="number" min="5" step="1" /></label>
          <label>특정 시간 <input data-field="timeOfDay" type="time" /></label>
        </div>

        <div class="actions-head">
          <strong>액션 순서</strong>
          <button data-action="addAction" type="button">액션 추가</button>
        </div>
        <div data-role="actions" class="actions-list"></div>

        <div class="footer-actions">
          <button data-action="permission" type="button">사이트 권한 허용</button>
          <button data-action="duplicate" type="button">복제</button>
          <button data-action="delete" type="button" class="danger">삭제</button>
        </div>
      </article>
    </template>

    <template id="actionTemplate">
      <div class="action-row">
        <select data-field="type">
          <option value="click">클릭</option>
          <option value="type">입력</option>
          <option value="key">키 입력</option>
          <option value="nativeClick">Windows 좌표 클릭</option>
          <option value="wait">대기</option>
          <option value="scroll">스크롤</option>
          <option value="reload">새로고침</option>
        </select>
        <input data-field="selector" placeholder="대상 CSS selector, 비워두면 현재 포커스/화면" />
        <input data-field="value" placeholder="입력값 또는 키, 예: Enter" />
        <input data-field="ms" type="number" placeholder="대기 ms" />
        <input data-field="x" type="number" placeholder="클릭 X" />
        <input data-field="y" type="number" placeholder="스크롤 Y" />
        <button data-action="removeAction" type="button">삭제</button>
      </div>
    </template>

    <script src="options.js"></script>
  </body>
</html>
