<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사이트 액션 매크로</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div>
        <strong>사이트 액션 매크로</strong>
        <p>선택한 사이트에서만 예약 작업을 실행합니다.</p>
      </div>
      <div class="header-actions">
        <select id="themeSelect" aria-label="테마 선택">
          <option value="light">화이트</option>
          <option value="dark">다크</option>
        </select>
        <button id="openOptions" type="button">설정</button>
      </div>
    </header>

    <main>
      <section class="notice">
        숨김 실행, 로그인 우회, 캡차 우회, 비밀번호 자동 입력은 지원하지 않습니다.
      </section>

      <section>
        <div class="section-title">
          <h2>작업 목록</h2>
          <button id="newJob" type="button">추가</button>
        </div>
        <div id="jobList" class="job-list"></div>
      </section>

      <section>
        <div class="section-title">
          <h2>최근 로그</h2>
          <button id="clearLogs" type="button">삭제</button>
        </div>
        <div id="logList" class="log-list"></div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
