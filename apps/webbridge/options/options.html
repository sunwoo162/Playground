<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>WebBridge · 규칙 관리</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="side-hd">
        <span class="logo">🌉 WebBridge</span>
        <button id="new-rule" class="btn primary sm">＋ 새 규칙</button>
      </div>
      <ul id="rule-list" class="side-list"></ul>
    </aside>

    <main class="editor" id="editor">
      <div id="empty-state" class="empty-state">
        <h2>규칙을 선택하거나 새로 만드세요</h2>
        <p>WebBridge는 API가 없는 웹사이트를 규칙 기반으로 연결합니다.</p>
        <div class="quick">
          <button class="btn" data-template="extract-send">현재 페이지 내용을 웹훅으로 보내기</button>
          <button class="btn" data-template="form-auto">현재 페이지 값으로 다른 사이트 폼 채우기</button>
          <button class="btn" data-template="scrape-store">목록을 긁어서 저장하고 알림 받기</button>
          <button class="btn" id="btn-data-link">웹 데이터를 다른 웹 입력칸에 채우기</button>
          <button class="btn" id="btn-web-link">로그인 토큰을 다른 웹 입력칸에 채우기</button>
        </div>

        <form id="data-link-builder" class="link-builder" hidden>
          <div class="builder-grid">
            <label>
              <span>출발 웹 URL 패턴</span>
              <input id="dl-source-pattern" placeholder="*://source.example.com/*" />
            </label>
            <label>
              <span>가져올 데이터 이름</span>
              <input id="dl-data-name" placeholder="title" />
            </label>
            <label>
              <span>가져올 CSS 셀렉터</span>
              <input id="dl-source-selector" placeholder="h1" />
            </label>
            <label>
              <span>가져올 값</span>
              <select id="dl-read-mode">
                <option value="text">화면 텍스트</option>
                <option value="value">입력값</option>
                <option value="href">링크 주소</option>
                <option value="src">이미지 주소</option>
                <option value="html">HTML</option>
              </select>
            </label>
            <label>
              <span>대상 웹 URL</span>
              <input id="dl-target-url" placeholder="https://target.example.com/form" />
            </label>
            <label>
              <span>채울 입력칸 CSS 셀렉터</span>
              <input id="dl-target-selector" placeholder="#title" />
            </label>
            <label>
              <span>입력 후 클릭 셀렉터</span>
              <input id="dl-submit-selector" placeholder="button[type=submit]" />
            </label>
          </div>
          <div class="builder-actions">
            <button type="button" id="dl-create" class="btn primary">규칙 만들기</button>
            <button type="button" id="dl-cancel" class="btn">닫기</button>
          </div>
        </form>

        <form id="web-link-builder" class="link-builder" hidden>
          <div class="builder-grid">
            <label>
              <span>출발 웹 URL 패턴</span>
              <input id="wl-source-pattern" placeholder="*://source.example.com/*" />
            </label>
            <label>
              <span>토큰 위치</span>
              <select id="wl-token-source">
                <option value="localStorage">localStorage</option>
                <option value="sessionStorage">sessionStorage</option>
                <option value="cookie">cookie</option>
                <option value="meta">meta</option>
                <option value="variable">window 변수</option>
              </select>
            </label>
            <label>
              <span>토큰 키/경로</span>
              <input id="wl-token-key" placeholder="accessToken" />
            </label>
            <label>
              <span>대상 웹 URL</span>
              <input id="wl-target-url" placeholder="https://target.example.com/form" />
            </label>
            <label>
              <span>입력칸 CSS 셀렉터</span>
              <input id="wl-target-selector" placeholder="#access-token" />
            </label>
            <label>
              <span>입력 후 클릭 셀렉터</span>
              <input id="wl-submit-selector" placeholder="button[type=submit]" />
            </label>
            <label>
              <span>토큰 신선도 기준(초)</span>
              <input id="wl-stale-seconds" type="number" min="5" value="5" />
            </label>
          </div>
          <div class="builder-actions">
            <button type="button" id="wl-create" class="btn primary">규칙 만들기</button>
            <button type="button" id="wl-cancel" class="btn">닫기</button>
          </div>
        </form>
      </div>

      <form id="rule-form" hidden>
        <div class="bar">
          <input type="text" id="f-name" placeholder="규칙 이름" class="name-input" required />
          <label class="sw" title="활성화">
            <input type="checkbox" id="f-enabled" checked />
            <span class="track"><span class="thumb"></span></span>
          </label>
          <button type="button" id="btn-save" class="btn primary">저장</button>
          <button type="button" id="btn-dup" class="btn">복제</button>
          <button type="button" id="btn-del" class="btn danger">삭제</button>
        </div>

        <div class="grid">
          <label class="field">
            <span>설명</span>
            <input type="text" id="f-desc" placeholder="이 규칙이 하는 일" />
          </label>

          <fieldset class="field">
            <legend>트리거</legend>
            <select id="f-trigger">
              <option value="manual">수동 (버튼/우클릭)</option>
              <option value="page-load">페이지 로드 시</option>
              <option value="interval">주기적 (간격)</option>
              <option value="shortcut">단축키 (Alt+Shift+B)</option>
            </select>
            <div id="trigger-extra" class="extra"></div>
          </fieldset>
        </div>

        <div class="steps-section">
          <div class="steps-hd">
            <h3>단계 (Steps)</h3>
            <div class="step-tools">
              <select id="step-template">
                <option value="">단계 삽입 ▾</option>
                <optgroup label="데이터">
                  <option value="extract">extract · 요소 추출</option>
                  <option value="transform">transform · JS 변환</option>
                  <option value="token">token · 토큰/쿠키/변수 추출</option>
                  <option value="watch-token">watch-token · 토큰 지속 갱신</option>
                  <option value="token-cache">token-cache · 신선한 토큰 읽기</option>
                  <option value="store">store · 저장</option>
                  <option value="read-store">read-store · 저장 읽기</option>
                </optgroup>
                <optgroup label="통신">
                  <option value="http">http · 웹훅/요청</option>
                  <option value="open-tab">open-tab · 탭 열기</option>
                  <option value="copy">copy · 클립보드</option>
                  <option value="notify">notify · 알림</option>
                </optgroup>
                <optgroup label="자동화">
                  <option value="automate">automate · 클릭/입력</option>
                  <option value="wait">wait · 대기</option>
                </optgroup>
                <optgroup label="제어">
                  <option value="if">if · 조건 분기</option>
                  <option value="loop">loop · 반복</option>
                  <option value="log">log · 로그</option>
                </optgroup>
              </select>
            </div>
          </div>
          <textarea id="f-steps" spellcheck="false" placeholder='[{ "type": "extract", "fields": { "title": "h1" } }]'></textarea>
          <div id="steps-error" class="err-msg"></div>
        </div>

        <div class="run-section">
          <button type="button" id="btn-test" class="btn">▶ 현재 탭에서 테스트 실행</button>
          <pre id="run-result" class="result"></pre>
        </div>
      </form>
    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
